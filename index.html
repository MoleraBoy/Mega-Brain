    function generateRoomCode() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let code = 'mb-';
      for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function getDeviceId() {
      let id = localStorage.getItem('mega_brain_device_id');
      if (!id) {
        id = 'dev-' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('mega_brain_device_id', id);
      }
      return id;
    }

    async function pushCloudState(roomCode, payload) {
      if (!roomCode) return false;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}`, {
          method: 'POST',
          body: JSON.stringify({
            updatedAt: Date.now(),
            deviceId: getDeviceId(),
            data: payload
          }),
          headers: {
            'Title': 'MegaBrainSync',
            'Tags': 'brain'
          }
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function pullCloudState(roomCode) {
      if (!roomCode) return null;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}/json?poll=1&since=all`);
        if (!res.ok) return null;
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const evt = JSON.parse(lines[i]);
            if (evt.event === 'message' && evt.message) {
              const parsed = JSON.parse(evt.message);
              if (parsed && parsed.data && parsed.updatedAt) {
                return parsed;
              }
            }
          } catch (err) {}
        }
      } catch (e) {}
      return null;
    }

    // =========================================================================

    function buildFallbackThumbDataUrl(rawUrl, titleText) {
      try {

        </svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      } catch (e) {
        return null;

    async function fetchAutoThumbnail(url, titleText = '') {
      if (!url || !url.trim()) return null;
      const normalized = url.trim().startsWith('http') ? url.trim() : `https://${url.trim()}`;

      if (normalized.includes('youtube.com') || normalized.includes('youtu.be')) {
        let videoId = '';
        if (normalized.includes('youtu.be/')) videoId = normalized.split('youtu.be/')[1]?.split('?')[0];
        else if (normalized.includes('watch?v=')) videoId = normalized.split('watch?v=')[1]?.split('&')[0];
        else if (normalized.includes('/shorts/')) videoId = normalized.split('/shorts/')[1]?.split('?')[0];
        if (videoId) return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      }

      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(normalized)}`);
        const data = await res.json();
        if (data && data.status === 'success' && data.data?.image?.url) {
          return data.data.image.url;
        }
      } catch (e) {}

      try {
        return `https://image.thum.io/get/width/800/crop/450/${encodeURIComponent(normalized)}`;
      } catch (e) {}

      return buildFallbackThumbDataUrl(normalized, titleText);
    }

    let sharedAudioCtx = null;

    function unlockMobileAudioAndPermissions() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
          if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
        }
      } catch (e) {}

      if (typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }
    }

    if (typeof window !== 'undefined') {
      ['touchstart', 'click', 'keydown'].forEach((evt) => {
        window.addEventListener(evt, unlockMobileAudioAndPermissions, { passive: true });
      });
    }

    function playAlarmTone() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
        if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();

        const playBeep = (startTime, freq1, freq2) => {
          const osc = sharedAudioCtx.createOscillator();
          const gain = sharedAudioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq1, startTime);
          osc.frequency.exponentialRampToValueAtTime(freq2, startTime + 0.25);
          gain.gain.setValueAtTime(0.45, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.55);
          osc.connect(gain);
          gain.connect(sharedAudioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.55);
        };

        const now = sharedAudioCtx.currentTime;
        playBeep(now, 587.33, 880);
        playBeep(now + 0.65, 659.25, 987.77);
      } catch (e) {}
    }

    async function triggerConfiguredAlert(title, body, mode = 'all', tag = 'megabrain-alert') {
      if (!mode || mode === 'none') return;

      const wantPopup = ['popup_only', 'popup_vibrate', 'popup_sound', 'all'].includes(mode);
      const wantVibrate = ['vibrate_only', 'popup_vibrate', 'vibrate_sound', 'all'].includes(mode);
      const wantSound = ['sound_only', 'popup_sound', 'vibrate_sound', 'all'].includes(mode);

      if (wantVibrate && typeof navigator !== 'undefined' && 'vibrate' in navigator) {
        try { navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) {}
      }

      if (wantSound) {
        playAlarmTone();
      }

      if (wantPopup && typeof window !== 'undefined' && 'Notification' in window) {
        let perm = Notification.permission;
        if (perm === 'default') {
          perm = await Notification.requestPermission();
        }
        if (perm === 'granted') {
          let sentViaSW = false;
          if ('serviceWorker' in navigator) {
            try {
              const reg = await navigator.serviceWorker.ready;
              if (reg && reg.active) {
                reg.active.postMessage({
                  type: 'SHOW_ALARM_NOTIFICATION',
                  payload: {
                    title,
                    body,
                    vibrate: wantVibrate,
                    silent: !wantSound,
                    tag,
                  },
                });
                sentViaSW = true;
              }
            } catch (e) {}
          }
          if (!sentViaSW) {
            try {
              new Notification(title, {
                body,
                tag,
                vibrate: wantVibrate ? [400, 150, 400, 150, 600] : undefined,
                silent: !wantSound,
              });
            } catch (e) {}
          }
        }
      }
    }

    async function scheduleExternalWakeupPush(roomCode, item) {

      try {
        const todayIso = item.reminderDate || new Date().toISOString().slice(0, 10);
        const targetDate = new Date(`${todayIso}T${item.reminderTime}:00`);
        const delaySec = Math.max(5, Math.floor((targetDate.getTime() - Date.now()) / 1000));
        if (delaySec > 86400 * 7) return;

        await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}-alarms`, {
          method: 'POST',
          body: item.freeNotes?.[0] || `⏰ Lembrete: ${item.title} (${item.reminderTime})`,

    // =========================================================================

    // =========================================================================
    function doesItemOccurOnDate(item, isoDateStr) {
      if (!item || !isoDateStr) return false;
      const canceled = Array.isArray(item.canceledDates) ? item.canceledDates : [];
      if (canceled.includes(isoDateStr)) return false;

      const baseDate = item.reminderDate || (item.createdAt ? item.createdAt.slice(0, 10) : '');
      if (!baseDate) return false;

      const targetObj = new Date(isoDateStr + 'T12:00:00');
      const baseObj = new Date(baseDate + 'T12:00:00');
      const dayOfWeek = targetObj.getDay(); // 0 = Dom, 6 = Sáb

      const rec = item.recurrence || 'none';
      if (rec === 'none') {
        return baseDate === isoDateStr || item.dueDate === isoDateStr;
      }
      if (rec === 'daily') {
        return targetObj >= baseObj;
      }
      if (rec === 'weekly') {
        return targetObj >= baseObj && targetObj.getDay() === baseObj.getDay();
      }
      if (rec === 'weekends') {
        return targetObj >= baseObj && (dayOfWeek === 0 || dayOfWeek === 6);
      }
      return baseDate === isoDateStr;
    }

    // =========================================================================

              >
                <Icon name="plus" size={14} /> Nova Tarefa em {selectedDateStr}

            <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-slate-400 mb-1.5">

            <div className="grid grid-cols-7 gap-1.5">
              {calendarCells.map((cell, idx) => {

                const dayTasks = scopedItems.filter((it) => doesItemOccurOnDate(it, cell.iso));
                const isSelected = selectedDateStr === cell.iso;

                  <button
                    key={cell.iso}
                    type="button"
                    onClick={() => setSelectedDateStr(cell.iso)}
                    className={`h-20 sm:h-24 rounded-xl border p-1.5 text-left flex flex-col justify-between transition overflow-hidden ${
                      isSelected
                        ? 'border-indigo-600 bg-indigo-50/60 dark:bg-indigo-950/40 ring-1 ring-indigo-600'

                    <div className="flex items-center gap-1.5 shrink-0">

    // =========================================================================
    // QUADRO DE DETETIVE (CARDS ARRASTÁVEIS + LINHAS CONECTORAS VERMELHAS)
    // =========================================================================
    const DetectiveBoardView = ({ items, onUpdateBoardPos, onToggleConnection, onOpenDetail }) => {
      const [draggingId, setDraggingId] = useState(null);
      const [linkingFromId, setLinkingFromId] = useState(null);
      const boardRef = useRef(null);
      const dragOffsetRef = useRef({ x: 0, y: 0 });

      const positions = useMemo(() => {
        const map = {};
        items.forEach((it, idx) => {
          const col = idx % 3;
          const row = Math.floor(idx / 3);
          map[it.id] = it.boardPos || { x: 36 + col * 310, y: 36 + row * 230 };
        });
        return map;
      }, [items]);

      useEffect(() => {
        const handleMove = (e) => {
          if (!draggingId || !boardRef.current) return;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const rect = boardRef.current.getBoundingClientRect();
          const newX = Math.max(12, clientX - rect.left - dragOffsetRef.current.x);
          const newY = Math.max(12, clientY - rect.top - dragOffsetRef.current.y);
          onUpdateBoardPos(draggingId, { x: Math.round(newX), y: Math.round(newY) });
        };

        const handleUp = () => {
          setDraggingId(null);
        };

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleUp);
        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleUp);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleUp);
        };
      }, [draggingId, onUpdateBoardPos]);

      const lines = useMemo(() => {
        const list = [];
        items.forEach((it) => {
          const fromPos = positions[it.id];
          if (!fromPos || !Array.isArray(it.boardConnections)) return;
          it.boardConnections.forEach((targetId) => {
            const toPos = positions[targetId];
            if (toPos) {
              list.push({
                id: `${it.id}->${targetId}`,
                x1: fromPos.x + 120,
                y1: fromPos.y + 70,
                x2: toPos.x + 120,
                y2: toPos.y + 70,
              });
            }
          });
        });
        return list;
      }, [items, positions]);

      return (
        <div className="space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 px-4 py-2.5 rounded-xl text-xs">
            <span className="font-semibold flex items-center gap-1.5">
              🕵️ Quadro de Detetive — Arraste as pistas/tarefas livremente e conecte fios vermelhos entre elas.
            </span>
            {linkingFromId && (
              <span className="text-rose-600 dark:text-rose-400 font-bold">
                Clique em outra tarefa para ligar/desligar o fio vermelho!
              </span>
            )}
          </div>

          <div
            ref={boardRef}
            className="relative w-full min-h-[640px] rounded-2xl border-2 border-amber-900/20 dark:border-amber-700/30 bg-[#f7f1e3] dark:bg-[#1e1b18] overflow-auto shadow-inner"
            style={{
              backgroundImage: 'radial-gradient(rgba(120, 53, 15, 0.14) 1px, transparent 1px)',
              backgroundSize: '20px 20px'
            }}
          >
            <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ minWidth: '960px', minHeight: '640px' }}>
              {lines.map((ln) => (
                <line
                  key={ln.id}
                  x1={ln.x1}
                  y1={ln.y1}
                  x2={ln.x2}
                  y2={ln.y2}
                  stroke="#dc2626"
                  strokeWidth="3"
                  strokeDasharray="6 3"
                />
              ))}
            </svg>

            {items.map((it) => {
              const pos = positions[it.id] || { x: 40, y: 40 };
              const thumb = it.thumbnail || (Array.isArray(it.images) && (typeof it.images[0] === 'string' ? it.images[0] : it.images[0]?.src));
              const isLinkingOrigin = linkingFromId === it.id;

              return (
                <div
                  key={it.id}
                  style={{ left: `${pos.x}px`, top: `${pos.y}px` }}
                  onMouseDown={(e) => {
                    if (e.target.closest('button')) return;
                    const rect = e.currentTarget.getBoundingClientRect();
                    dragOffsetRef.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                    setDraggingId(it.id);
                  }}
                  onTouchStart={(e) => {
                    if (e.target.closest('button')) return;
                    const rect = e.currentTarget.getBoundingClientRect();
                    const t = e.touches[0];
                    dragOffsetRef.current = { x: t.clientX - rect.left, y: t.clientY - rect.top };
                    setDraggingId(it.id);
                  }}
                  onClick={() => {
                    if (linkingFromId && linkingFromId !== it.id) {
                      onToggleConnection(linkingFromId, it.id);
                      setLinkingFromId(null);
                    }
                  }}
                  className={`absolute w-60 rounded-xl bg-amber-50 dark:bg-zinc-900 border-2 p-3 shadow-xl cursor-grab active:cursor-grabbing select-none ${
                    isLinkingOrigin
                      ? 'border-rose-600 ring-2 ring-rose-400'
                      : 'border-amber-700/40 dark:border-amber-500/40'
                  }`}
                >
                  <div className="w-3 h-3 rounded-full bg-rose-600 mx-auto -mt-4 mb-1.5 shadow" />
                  {thumb && (
                    <img src={thumb} alt={it.title} className="w-full h-24 object-cover rounded-lg mb-2 border border-amber-900/20" />
                  )}
                  <p className="text-xs font-bold leading-snug break-words">{it.title}</p>
                  {it.freeNotes && it.freeNotes[0] && (
                    <p className="text-[11px] text-slate-600 dark:text-zinc-400 line-clamp-2 mt-1">{it.freeNotes[0]}</p>
                  )}
                  <div className="flex items-center justify-between gap-1.5 mt-2.5 pt-2 border-t border-amber-900/15">
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setLinkingFromId(isLinkingOrigin ? null : it.id);
                      }}
                      className={`px-2 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 ${
                        isLinkingOrigin ? 'bg-rose-600 text-white' : 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                      }`}
                    >
                      🔗 {isLinkingOrigin ? 'Ligar em...' : 'Fio'}
                    </button>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        onOpenDetail(it);
                      }}
                      className="px-2 py-1 rounded-lg bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 text-[10px] font-semibold"
                    >
                      Abrir
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // =========================================================================
    // CRONÔMETRO + TEMPORIZADOR (POMODORO / CONTAGEM REGRESSIVA)
    // =========================================================================
    const StopwatchAndTimerWidget = ({ onNotify }) => {
      const [tabMode, setTabMode] = useState('timer'); // 'timer' | 'stopwatch'
      const [secondsLeft, setSecondsLeft] = useState(25 * 60);
      const [timerRunning, setTimerRunning] = useState(false);
      const [customMinutes, setCustomMinutes] = useState(25);
      const [alertMode, setAlertMode] = useState('vibrate_sound');

      const [stopwatchSeconds, setStopwatchSeconds] = useState(0);
      const [stopwatchRunning, setStopwatchRunning] = useState(false);
      const [laps, setLaps] = useState([]);

      useEffect(() => {
        if (!timerRunning) return;
        const interval = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              setTimerRunning(false);
              onNotify('⏰ Temporizador Finalizado!', 'O tempo configurado terminou.', alertMode);
              return customMinutes * 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [timerRunning, customMinutes, alertMode, onNotify]);

      useEffect(() => {
        if (!stopwatchRunning) return;
        const interval = setInterval(() => {
          setStopwatchSeconds((prev) => prev + 1);
        }, 1000);
        return () => clearInterval(interval);
      }, [stopwatchRunning]);

      const formatHMS = (totalSec) => {
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        if (hrs > 0) {
          return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-4 shadow-material">
          <div className="flex items-center justify-between gap-1 mb-3">
            <button
              type="button"
              onClick={() => setTabMode('timer')}
              className={`flex-1 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1 ${
                tabMode === 'timer' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300'
              }`}
            >
              <Icon name="timer" size={13} /> Temporizador
            </button>
            <button
              type="button"
              onClick={() => setTabMode('stopwatch')}
              className={`flex-1 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1 ${
                tabMode === 'stopwatch' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300'
              }`}
            >
              <Icon name="clock" size={13} /> Cronômetro
            </button>
          </div>

          {tabMode === 'timer' ? (
            <>
              <div className="flex gap-1 mb-2">
                {[5, 25, 45].map((m) => (
                  <button
                    key={m}
                    type="button"
                    onClick={() => { setTimerRunning(false); setCustomMinutes(m); setSecondsLeft(m * 60); }}
                    className={`flex-1 text-[11px] py-0.5 rounded-full font-semibold ${
                      customMinutes === m ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' : 'text-slate-500'
                    }`}
                  >
                    {m}m
                  </button>
                ))}
              </div>
              <div className="text-3xl font-bold tracking-tight text-center my-2 font-mono">
                {formatHMS(secondsLeft)}
              </div>
              <div className="flex items-center gap-2 mb-2 text-xs">
                <span className="text-slate-400">Min:</span>
                <input
                  type="number"
                  min={1}
                  max={240}
                  value={customMinutes}
                  onChange={(e) => {
                    const val = Math.max(1, Number(e.target.value) || 1);
                    setTimerRunning(false);
                    setCustomMinutes(val);
                    setSecondsLeft(val * 60);
                  }}
                  className="w-20 px-2 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent text-xs"
                />
              </div>
              <div className="mb-2.5">
                <select
                  value={alertMode}
                  onChange={(e) => setAlertMode(e.target.value)}
                  className="w-full text-[11px] px-2 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
                >
                  {NOTIF_MODES.map((m) => (
                    <option key={m.id} value={m.id} className="dark:bg-zinc-900">Alerta: {m.label}</option>
                  ))}
                </select>
              </div>
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setTimerRunning(!timerRunning)}
                  className="flex-1 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center justify-center gap-1"
                >
                  <Icon name={timerRunning ? 'pause' : 'play'} size={14} />
                  {timerRunning ? 'Pausar' : 'Iniciar'}
                </button>
                <button
                  type="button"
                  onClick={() => { setTimerRunning(false); setSecondsLeft(customMinutes * 60); }}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
                >
                  Resetar
                </button>
              </div>
            </>
          ) : (
            <>
              <div className="text-3xl font-bold tracking-tight text-center my-2 font-mono">
                {formatHMS(stopwatchSeconds)}
              </div>
              <div className="flex gap-1.5">
                <button
                  type="button"
                  onClick={() => setStopwatchRunning(!stopwatchRunning)}
                  className="flex-1 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold flex items-center justify-center gap-1"
                >
                  <Icon name={stopwatchRunning ? 'pause' : 'play'} size={14} />
                  {stopwatchRunning ? 'Pausar' : 'Iniciar'}
                </button>
                <button
                  type="button"
                  onClick={() => setLaps((prev) => [formatHMS(stopwatchSeconds), ...prev])}
                  className="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-zinc-800 text-xs font-semibold"
                >
                  Volta
                </button>
                <button
                  type="button"
                  onClick={() => { setStopwatchRunning(false); setStopwatchSeconds(0); setLaps([]); }}
                  className="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
                >
                  Zerar
                </button>
              </div>
              {laps.length > 0 && (
                <div className="mt-2.5 max-h-24 overflow-y-auto space-y-1 text-[11px] font-mono border-t border-slate-100 dark:border-zinc-800 pt-2">
                  {laps.map((lp, idx) => (
                    <div key={idx} className="flex justify-between text-slate-500">
                      <span>Volta #{laps.length - idx}</span>
                      <strong>{lp}</strong>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}
        </div>
      );
    };

    const PinModal = ({ isOpen, onClose, currentPin, onSetPin, onUnlock }) => {
      const [pinInput, setPinInput] = useState('');
      const [newPin, setNewPin] = useState('');

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">

                <Icon name="x" size={16} />

              <form

                  e.preventDefault();

                <input

                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}

                <button type="submit" className="w-full py-2 rounded-xl bg-amber-600 text-white text-xs font-semibold">

                  onSetPin(newPin.trim());
                  onUnlock();
                  onClose();

                className="space-y-3"

                <p className="text-xs text-slate-500">Defina um PIN para proteger suas pastas e tarefas no cofre:</p>
                <input
                  type="password"
                  maxLength={8}
                  required
                  value={newPin}
                  onChange={(e) => setNewPin(e.target.value)}
                  placeholder="Criar PIN (mín. 4 dígitos)..."
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-center text-lg tracking-widest"

    };

    // =========================================================================
    // REVISÃO DE QUARTA-FEIRA
    // =========================================================================
    const WednesdayReviewModal = ({ isOpen, onClose, items, onConfirmSeen, onSnoozeItems }) => {
      const [selectedIds, setSelectedIds] = useState([]);
      const [customDate, setCustomDate] = useState('');

      const unseenLaterItems = useMemo(
        () => items.filter((it) => it.watchLater && !it.seenConfirmed && !it.archivedToHistory),
        [items]
      );

      useEffect(() => {
        if (isOpen) {
          setSelectedIds(unseenLaterItems.map((i) => i.id));
        }
      }, [isOpen, unseenLaterItems]);

      if (!isOpen) return null;

      const toggleSelect = (id) => {
        setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
      };

      const nextWednesdayIso = () => {
        const d = new Date();
        const diff = (3 - d.getDay() + 7) % 7 || 7;
        d.setDate(d.getDate() + diff);
        return d.toISOString().slice(0, 10);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white dark:bg-zinc-900 rounded-2xl max-w-lg w-full p-6 border border-slate-200 dark:border-zinc-800 shadow-2xl my-8 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-zinc-800 pb-3">
              <div>
                <h3 className="text-base font-bold flex items-center gap-2">
                  <Icon name="calendar" size={18} className="text-indigo-500" />
                  Check-in de Quarta: Itens "Ver Depois"
                </h3>
                <p className="text-xs text-slate-500">
                  Itens marcados para ler/assistir depois sem data fixa. Deseja ver algum hoje?
                </p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800">
                <Icon name="x" size={16} />
              </button>
            </div>

            {unseenLaterItems.length === 0 ? (
              <p className="text-xs text-slate-400 py-6 text-center">Nenhum item pendente para revisão hoje!</p>
            ) : (
              <div className="space-y-2 max-h-60 overflow-y-auto">
                {unseenLaterItems.map((it) => (
                  <label
                    key={it.id}
                    className="flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 dark:border-zinc-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-zinc-950"
                  >
                    <input
                      type="checkbox"
                      checked={selectedIds.includes(it.id)}
                      onChange={() => toggleSelect(it.id)}
                      className="rounded text-indigo-600"
                    />
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-semibold truncate">{it.title}</p>
                      <p className="text-[11px] text-slate-400 truncate">{it.whySaved || it.whatIsIt}</p>
                    </div>
                  </label>
                ))}
              </div>
            )}

            <div className="pt-3 border-t border-slate-100 dark:border-zinc-800 space-y-3">
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={() => { onConfirmSeen(selectedIds); onClose(); }}
                  className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold"
                >
                  Marcar Selecionados como Vistos ({selectedIds.length})
                </button>
                <button
                  onClick={() => { onSnoozeItems(unseenLaterItems.map((i) => i.id), nextWednesdayIso()); onClose(); }}
                  className="px-3 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 text-xs font-semibold"
                >
                  Lembrar Próxima Quarta
                </button>
                <button
                  onClick={onClose}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
                >
                  Nenhum Hoje
                </button>
              </div>

              <div className="flex items-center gap-2 text-xs flex-wrap">
                <span>Escolher outro dia:</span>
                <input
                  type="date"
                  value={customDate}
                  onChange={(e) => setCustomDate(e.target.value)}
                  className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
                />
                <button
                  onClick={() => {
                    if (!customDate) return;
                    onSnoozeItems(unseenLaterItems.map((i) => i.id), customDate);
                    onClose();
                  }}
                  className="px-3 py-1 rounded-lg bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-semibold"
                >
                  Agendar
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // ÁRVORE DE PASTAS + LISTA DE TAREFAS E ANOTAÇÕES DENTRO DA PASTA SELECIONADA
    // =========================================================================
    const FolderTreeSidebar = ({
      folders,
      items,
      selectedFolderId,
      onSelectFolder,
      onCreateFolder,
      onEditFolder,
      onDeleteFolder,
      onAddFolderTask,
      onMoveFolderOrder,
      onToggleFolderVault,
      onOpenItemDetail,
      isPrivateMode
    }) => {
      const [contextMenu, setContextMenu] = useState(null);
      const [editingFolderId, setEditingFolderId] = useState(null);
      const [editName, setEditName] = useState('');
      const [creatingParentId, setCreatingParentId] = useState(null);
      const [newFolderName, setNewFolderName] = useState('');
      const [collapsedMap, setCollapsedMap] = useState({});
      const [dragOverFolderId, setDragOverFolderId] = useState(null);
      const [draggedFolderId, setDraggedFolderId] = useState(null);
      const longPressTimer = useRef(null);

      const scopedFolders = folders.filter((f) => Boolean(f.isPrivate) === Boolean(isPrivateMode));

      // Coleta pasta selecionada + subpastas dela para exibir tarefas e anotações em lista
      const selectedFolderBranchIds = useMemo(() => {
        if (!selectedFolderId) return null;
        const set = new Set([selectedFolderId]);
        let added = true;
        while (added) {
          added = false;
          folders.forEach((f) => {
            if (f.parentId && set.has(f.parentId) && !set.has(f.id)) {
              set.add(f.id);
              added = true;
            }
          });
        }
        return set;
      }, [selectedFolderId, folders]);

      const folderItemsList = useMemo(() => {
        if (!selectedFolderBranchIds) return [];
        return items.filter(
          (it) => Boolean(it.isPrivate) === Boolean(isPrivateMode) && it.folderId && selectedFolderBranchIds.has(it.folderId)
        );
      }, [items, isPrivateMode, selectedFolderBranchIds]);

      const toggleCollapse = (folderId, e) => {
        if (e) e.stopPropagation();
        setCollapsedMap((prev) => ({ ...prev, [folderId]: !prev[folderId] }));
      };

      const handleTouchStart = (folder, e) => {
        longPressTimer.current = setTimeout(() => {
          const touch = e.touches[0];
          setDraggedFolderId(folder.id);
          setContextMenu({ folder, x: touch.clientX, y: touch.clientY });
        }, 550);
      };

      const handleTouchEnd = () => {
        if (longPressTimer.current) clearTimeout(longPressTimer.current);
      };

      const renderBranch = (parentId = null, depth = 0) => {
        const children = scopedFolders.filter((f) => (f.parentId || null) === parentId);
        return (
          <div className={depth > 0 ? 'ml-3 pl-2 border-l border-slate-200 dark:border-zinc-800 space-y-1 mt-1' : 'space-y-1'}>
            {children.map((folder) => {
              const hasSubfolders = scopedFolders.some((f) => f.parentId === folder.id);
              const isCollapsed = Boolean(collapsedMap[folder.id]);
              const isSelected = selectedFolderId === folder.id;
              const isEditing = editingFolderId === folder.id;
              const isDragTarget = dragOverFolderId === folder.id;

              return (
                <div key={folder.id} className="relative">
                  {isEditing ? (
                    <div className="flex gap-1 py-1">
                      <input
                        autoFocus
                        type="text"
                        value={editName}
                        onChange={(e) => setEditName(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            onEditFolder(folder.id, editName);
                            setEditingFolderId(null);
                          }
                        }}
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-500 bg-white dark:bg-zinc-900"
                      />
                      <button
                        onClick={() => {
                          onEditFolder(folder.id, editName);
                          setEditingFolderId(null);
                        }}
                        className="px-2 py-1 bg-indigo-600 text-white text-xs rounded"
                      >
                        OK
                      </button>
                    </div>
                  ) : (
                    <div
                      draggable
                      onDragStart={(e) => {
                        setDraggedFolderId(folder.id);
                        e.dataTransfer.setData('text/plain', `folder:${folder.id}`);
                      }}
                      onDragEnter={(e) => {
                        e.preventDefault();
                        setDragOverFolderId(folder.id);
                      }}
                      onDragOver={(e) => {
                        e.preventDefault();
                        if (dragOverFolderId !== folder.id) setDragOverFolderId(folder.id);
                      }}
                      onDragLeave={() => {
                        if (dragOverFolderId === folder.id) setDragOverFolderId(null);
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        setDragOverFolderId(null);
                        const data = e.dataTransfer.getData('text/plain') || (draggedFolderId ? `folder:${draggedFolderId}` : '');
                        setDraggedFolderId(null);
                        if (!data) return;
                        if (data.startsWith('item:')) {
                          const itemId = data.split(':')[1];
                          window.dispatchEvent(new CustomEvent('megabrain:move-item', { detail: { itemId, folderId: folder.id } }));
                        } else if (data.startsWith('folder:')) {
                          const fromFolderId = data.split(':')[1];
                          if (fromFolderId && fromFolderId !== folder.id && onMoveFolderOrder) {
                            onMoveFolderOrder(fromFolderId, folder.id);
                          }
                        }
                      }}
                      onTouchStart={(e) => handleTouchStart(folder, e)}
                      onTouchEnd={handleTouchEnd}
                      onClick={() => onSelectFolder(folder.id)}
                      onContextMenu={(e) => {
                        e.preventDefault();
                        setContextMenu({ folder, x: e.clientX, y: e.clientY });
                      }}
                      className={`group flex items-center justify-between px-2 py-1.5 rounded-lg text-sm cursor-pointer transition select-none ${
                        isDragTarget ? 'drag-over-target' : ''
                      } ${
                        isSelected
                          ? 'bg-indigo-600 text-white font-medium shadow-sm'
                          : 'text-slate-700 dark:text-zinc-300 hover:bg-slate-200/70 dark:hover:bg-zinc-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 min-w-0">
                        <button
                          type="button"
                          onClick={(e) => toggleCollapse(folder.id, e)}
                          title={isCollapsed ? 'Maximizar pasta' : 'Minimizar pasta'}
                          className={`p-0.5 rounded hover:bg-black/10 dark:hover:bg-white/10 ${
                            isSelected ? 'text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name={isCollapsed ? 'chevron-right' : 'chevron-down'} size={14} />
                        </button>
                        <Icon
                          name={folder.isPrivate ? 'lock' : isCollapsed ? 'folder' : hasSubfolders ? 'folder-open' : 'folder'}
                          size={15}
                          className={isSelected ? 'text-white' : 'text-indigo-500'}
                        />
                        <span className="truncate">{folder.name}</span>
                      </div>

                      <div className="flex items-center gap-0.5 shrink-0">
                        <button
                          type="button"
                          onClick={(e) => toggleCollapse(folder.id, e)}
                          title={isCollapsed ? 'Maximizar' : 'Minimizar'}
                          className={`p-1 rounded text-[11px] opacity-70 group-hover:opacity-100 ${
                            isSelected ? 'text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name={isCollapsed ? 'maximize-2' : 'minimize-2'} size={12} />
                        </button>
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            const rect = e.currentTarget.getBoundingClientRect();
                            setContextMenu({ folder, x: rect.left, y: rect.bottom + 5 });
                          }}
                          className={`p-1 rounded opacity-80 group-hover:opacity-100 ${isSelected ? 'text-white' : 'text-slate-500'}`}
                        >
                          <Icon name="more-vertical" size={14} />
                        </button>
                      </div>
                    </div>
                  )}

                  {creatingParentId === folder.id && (
                    <div className="mt-1 ml-4 flex gap-1">
                      <input
                        autoFocus
                        type="text"
                        value={newFolderName}
                        onChange={(e) => setNewFolderName(e.target.value)}
                        placeholder="Nome da subpasta..."
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-400 bg-white dark:bg-zinc-900"
                      />
                      <button
                        onClick={() => {
                          if (newFolderName.trim()) {
                            onCreateFolder(newFolderName.trim(), folder.id, isPrivateMode);
                            setNewFolderName('');
                            setCreatingParentId(null);
                            setCollapsedMap((prev) => ({ ...prev, [folder.id]: false }));
                          }
                        }}
                        className="px-2 py-1 bg-indigo-600 text-white text-xs rounded"
                      >
                        Criar
                      </button>
                    </div>
                  )}

                  {!isCollapsed && renderBranch(folder.id, depth + 1)}
                </div>
              );
            })}
          </div>
        );
      };

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-3.5 shadow-material space-y-2.5">
          <div className="flex items-center justify-between">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
              {isPrivateMode ? 'Pastas do Cofre 🔒' : 'Pastas & Subpastas'}
            </span>
            <button
              onClick={() => {
                const name = prompt('Nome da nova pasta raiz:');
                if (name) onCreateFolder(name, null, isPrivateMode);
              }}
              className="text-xs flex items-center gap-1 text-indigo-600 dark:text-indigo-400 font-medium"
            >
              <Icon name="plus" size={14} /> Nova
            </button>
          </div>

          <button
            onClick={() => onSelectFolder(null)}
            className={`w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-sm transition ${
              selectedFolderId === null
                ? 'bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-medium'
                : 'text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800'
            }`}
          >
            <Icon name="layers" size={15} />
            <span>Todas as Pastas</span>
          </button>

          {renderBranch(null, 0)}

          {/* Lista compacta de tarefas e anotações dentro da pasta/subpasta clicada */}
          {selectedFolderId && (
            <div className="pt-2.5 border-t border-slate-100 dark:border-zinc-800 space-y-1.5">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold text-slate-500">
                  Itens na pasta ({folderItemsList.length})
                </span>
                <button
                  onClick={() => onAddFolderTask(selectedFolderId)}
                  className="text-[11px] text-indigo-600 dark:text-indigo-400 font-semibold hover:underline"
                >
                  + Adicionar
                </button>
              </div>
              {folderItemsList.length === 0 ? (
                <p className="text-[11px] text-slate-400 py-1">Nenhuma tarefa ou anotação nesta pasta.</p>
              ) : (
                <ul className="space-y-1 max-h-48 overflow-y-auto pr-0.5">
                  {folderItemsList.map((it) => {
                    const notesPreview = Array.isArray(it.freeNotes) && it.freeNotes.length > 0 ? it.freeNotes[0] : '';
                    return (
                      <li key={it.id}>
                        <button
                          type="button"
                          onClick={() => onOpenItemDetail(it)}
                          className="w-full text-left px-2 py-1.5 rounded-lg bg-slate-50 dark:bg-zinc-950 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 border border-slate-200/70 dark:border-zinc-800 transition"
                        >
                          <p className="text-xs font-semibold truncate">{it.title}</p>
                          {notesPreview && (
                            <p className="text-[10px] text-amber-700 dark:text-amber-300 truncate">📝 {notesPreview}</p>
                          )}
                        </button>
                      </li>
                    );
                  })}
                </ul>
              )}
            </div>
          )}

          {contextMenu && (
            <div className="fixed inset-0 z-50" onClick={() => setContextMenu(null)}>
              <div
                style={{ top: Math.min(contextMenu.y, window.innerHeight - 280), left: Math.min(contextMenu.x, window.innerWidth - 220) }}
                className="absolute bg-white dark:bg-zinc-900 rounded-xl border border-slate-200 dark:border-zinc-700 shadow-2xl py-1.5 w-56 text-xs z-50"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-3 py-1.5 font-bold text-slate-400 border-b border-slate-100 dark:border-zinc-800 truncate">
                  {contextMenu.folder.name}
                </div>
                <button
                  onClick={() => { toggleCollapse(contextMenu.folder.id); setContextMenu(null); }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name={collapsedMap[contextMenu.folder.id] ? 'maximize-2' : 'minimize-2'} size={14} />

    // =========================================================================
    // CARD DE ITEM (CLICAR ABRE DETALHES; BOTÃO EDITAR FICA JUNTO AOS BOTÕES DE AÇÃO)

    const BrainItemCard = ({
      item,
      folderPath,
      viewMode,
      onOpenDetail,
      onToggleDone,
      onRequestCancelItem,
      onToggleVault,
      onEdit,
      onTagClick,
      draggable,

    }) => {
      const pMeta = PRIORITY_META[item.priority] || PRIORITY_META.later;
      const itemImages = useMemo(() => {
        const list = [];
        if (item.thumbnail) list.push(item.thumbnail);
        if (Array.isArray(item.images)) {
          item.images.forEach((img) => {
            const src = typeof img === 'string' ? img : img?.src;
            if (src && !list.includes(src)) list.push(src);
          });
        }
        return list;
      }, [item.thumbnail, item.images]);

      const itemAudios = useMemo(() => {
        if (!Array.isArray(item.audios)) return [];
        return item.audios.map((a, idx) =>
          typeof a === 'string'
            ? { id: `aud-${idx}`, name: `Áudio ${idx + 1}`, src: a }
            : { id: a.id || `aud-${idx}`, name: a.name || `Áudio ${idx + 1}`, src: a.src }
        );
      }, [item.audios]);

      const itemNotes = useMemo(() => {
        if (!Array.isArray(item.freeNotes)) return [];
        return item.freeNotes.filter((n) => typeof n === 'string' && n.trim());

      const recurrenceLabel =
        item.recurrence === 'daily'
          ? 'Diária'

      if (viewMode === 'thumb') {

        return (
          <div
            draggable={draggable}
            onDragStart={onDragStart}

            className="group relative aspect-square rounded-2xl overflow-hidden bg-slate-200 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-800 cursor-pointer shadow-material"
          >
            {firstThumb ? (

      if (viewMode === 'list') {

            onDragStart={onDragStart}
            onDragOver={onDragOver}

            className={`bg-white dark:bg-zinc-900 rounded-xl border border-slate-200/80 dark:border-zinc-800 px-3.5 py-2.5 flex items-center justify-between gap-3 shadow-material ${pMeta.border}`}
          >
            <div className="flex items-center gap-3 min-w-0 flex-1 cursor-pointer" onClick={() => onOpenDetail(item)}>
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onToggleDone(item); }}
                className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${
                  item.priority === 'done' ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'
                }`}
              >
                {item.priority === 'done' && <Icon name="check" size={12} />}
              </button>
              <div className="min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-sm font-semibold truncate ${item.priority === 'done' ? 'line-through opacity-60' : ''}`}>
                    {item.title}
                  </span>
                  {folderPath && <span className="text-[11px] text-slate-400">• 📁 {folderPath}</span>}
                  {item.dueDate && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-semibold">
                      🏁 {item.dueDate}
                    </span>
                  )}
                  {recurrenceLabel && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-purple-50 text-purple-700 font-semibold">
                      🔁 {recurrenceLabel}
                    </span>
                  )}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              <button onClick={() => onEdit(item)} title="Editar" className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800 text-indigo-600">
                <Icon name="pencil" size={14} />

              <button onClick={() => onRequestCancelItem(item)} title="Excluir" className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500">
                <Icon name="trash-2" size={14} />

      const hrefUrl = item.url ? (item.url.startsWith('http') ? item.url : `https://${item.url}`) : null;

      return (
        <div
          draggable={draggable}
          onDragStart={onDragStart}
          onDragOver={onDragOver}
          onDrop={onDrop}
          className={`group bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 overflow-hidden shadow-material hover:shadow-material-lg transition-all flex flex-col justify-between ${pMeta.border}`}
        >
          <div onClick={() => onOpenDetail(item)} className="cursor-pointer">
            {itemImages.length > 0 && (
              <div className="relative h-36 w-full overflow-hidden bg-slate-100 dark:bg-zinc-800">
                <img
                  src={itemImages[0]}
                  alt={item.title}
                  className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div className="absolute top-2.5 left-2.5 flex gap-1.5">
                  <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full border backdrop-blur-md shadow-sm ${pMeta.badge}`}>
                    {pMeta.dot} {pMeta.label.split('/')[0]}
                  </span>
                </div>
              </div>

            <div className="p-4">
              {itemImages.length === 0 && (
                <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
                  <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full border ${pMeta.badge}`}>
                    {pMeta.dot} {pMeta.label.split('/')[0]}
                  </span>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {recurrenceLabel && (
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-purple-50 text-purple-700 dark:bg-purple-950 dark:text-purple-300 font-semibold">
                        🔁 {recurrenceLabel}
                      </span>
                    )}
                  </div>
                </div>
              )}

              <div className="flex items-center gap-1.5 text-xs text-indigo-600 dark:text-indigo-400 font-medium mb-1 flex-wrap">
                <span>{item.genreOrTopic || 'Geral'}</span>
                {folderPath && <span className="text-slate-400">• 📁 {folderPath}</span>}
                {item.dueDate && (
                  <span className="text-emerald-600 dark:text-emerald-400">• 🏁 {item.dueDate}</span>
                )}
              </div>

              <h3 className={`font-semibold text-base leading-snug mb-2 ${item.priority === 'done' ? 'line-through opacity-60' : ''}`}>
                {item.title}
              </h3>

              {itemNotes.length > 0 && (
                <div className="space-y-1 mb-2">
                  {itemNotes.slice(0, 2).map((noteText, nIdx) => (
                    <div
                      key={nIdx}
                      className="text-xs p-2 rounded-lg bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200/60 dark:border-amber-800/50 text-slate-700 dark:text-zinc-200 line-clamp-2"
                    >
                      📝 {noteText}
                    </div>
                  ))}
                </div>
              )}

              {itemAudios.length > 0 && (
                <div className="mb-2 text-[11px] font-semibold text-rose-700 dark:text-rose-300">
                  🎤 {itemAudios.length} áudio(s) anexado(s) — clique para ouvir
                </div>
              )}

              {item.tags && item.tags.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-2" onClick={(e) => e.stopPropagation()}>
                  {item.tags.map((tag, idx) => (
                    <button
                      key={idx}
                      onClick={() => onTagClick(tag)}
                      className="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400 hover:underline font-medium"
                    >
                      #{tag}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="px-4 py-2.5 bg-slate-50/80 dark:bg-zinc-950/60 border-t border-slate-100 dark:border-zinc-800 flex items-center justify-between gap-2 flex-wrap">
            <div className="flex items-center gap-1.5 flex-wrap">
              {(() => {
                const cardLinks =
                  Array.isArray(item.links) && item.links.length > 0
                    ? item.links
                    : hrefUrl
                    ? [{ id: 'lnk-0', url: hrefUrl, label: 'Link' }]
                    : [];
                return cardLinks.map((lnk, idx) => {
                  const rawU = typeof lnk === 'string' ? lnk : lnk?.url;
                  if (!rawU) return null;
                  const fullHref = rawU.startsWith('http') ? rawU : `https://${rawU}`;
                  const labelText =
                    typeof lnk === 'object' && lnk?.label
                      ? lnk.label
                      : cardLinks.length > 1
                      ? `Link ${idx + 1}`
                      : 'Link';
                  return (
                    <a
                      key={lnk?.id || idx}
                      href={fullHref}
                      target="_blank"
                      rel="noreferrer"
                      onClick={(e) => e.stopPropagation()}
                      title={fullHref}
                      className="px-2.5 py-1 rounded-lg bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs font-medium flex items-center gap-1 max-w-[140px]"
                    >
                      <Icon name="external-link" size={13} className="shrink-0" />
                      <span className="truncate">{labelText}</span>
                    </a>
                  );
                });
              })()}
              <button
                onClick={() => onToggleDone(item)}
                className="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-medium flex items-center gap-1"
              >
                <Icon name="check-circle" size={13} /> {item.priority === 'done' ? 'Reabrir' : 'Concluir'}
              </button>
              <button
                onClick={() => onEdit(item)}
                className="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200/70 text-xs font-semibold flex items-center gap-1"
              >
                <Icon name="pencil" size={13} /> Editar
              </button>
            </div>

            <div className="flex items-center gap-1">
              <button onClick={() => onToggleVault(item)} title="Cofre" className="p-1.5 rounded-lg hover:bg-amber-50 text-amber-600">
                <Icon name={item.isPrivate ? 'unlock' : 'lock'} size={14} />
              </button>
              <button onClick={() => onRequestCancelItem(item)} title="Excluir" className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500">
                <Icon name="trash-2" size={14} />
              </button>
            </div>
          </div>
        </div>
      );

    // =========================================================================
    // MODAL DE CRIAÇÃO / EDIÇÃO COM SEÇÕES MINIMIZÁVEIS E ESPAÇO SEGURO NO RODAPÉ
    // =========================================================================
    const ItemFormModal = ({
      isOpen,
      onClose,
      onSave,
      folders,
      existingItems = [],
      initialItem,
      isPrivateMode,
      defaultFolderId,
      defaultDateStr
    }) => {
      const [title, setTitle] = useState('');
      const [url, setUrl] = useState('');
      const [links, setLinks] = useState([]);
      const [newLinkUrl, setNewLinkUrl] = useState('');
      const [newLinkLabel, setNewLinkLabel] = useState('');
      const [thumbOnlyUrl, setThumbOnlyUrl] = useState('');
      const [fetchingLinkId, setFetchingLinkId] = useState(null);
      const [thumbnail, setThumbnail] = useState('');
      const thumbDeviceInputRef = useRef(null);

      const [reminderDate, setReminderDate] = useState('');
      const [reminderTime, setReminderTime] = useState('');
      const [dueDate, setDueDate] = useState('');
      const [recurrence, setRecurrence] = useState('none');

      const [images, setImages] = useState([]);
      const cameraInputRef = useRef(null);
      const galleryInputRef = useRef(null);

      const [audios, setAudios] = useState([]);
      const [recording, setRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const [freeNotes, setFreeNotes] = useState([]);
      const [noteDraft, setNoteDraft] = useState('');

      const [genreOrTopic, setGenreOrTopic] = useState('');
      const [tagsInput, setTagsInput] = useState('');
      const [folderId, setFolderId] = useState(defaultFolderId || '');
      const [priority, setPriority] = useState('later');
      const [notificationMode, setNotificationMode] = useState('none');
      const [watchLater, setWatchLater] = useState(false);
      const [itemIsPrivate, setItemIsPrivate] = useState(Boolean(isPrivateMode));
      const [assignedPersonInput, setAssignedPersonInput] = useState('');
      const [assignedPersons, setAssignedPersons] = useState([]);
      const [fetchingThumb, setFetchingThumb] = useState(false);

      // Seções minimizáveis na criação/edição
      const [minimizedSections, setMinimizedSections] = useState({
        schedule: false,
        notes: false,
        audios: true,
        images: true,
        extra: true,
      });

      const toggleSection = (key) => {
        setMinimizedSections((prev) => ({ ...prev, [key]: !prev[key] }));
      };

      useEffect(() => {
        if (initialItem) {
          setTitle(initialItem.title || '');
          setUrl(initialItem.url || '');
          const migratedLinks =
            Array.isArray(initialItem.links) && initialItem.links.length > 0
              ? initialItem.links.map((l, i) =>
                  typeof l === 'string'
                    ? { id: `lnk-${i}`, url: l, label: '', thumb: '' }
                    : { id: l.id || `lnk-${i}`, url: l.url || '', label: l.label || '', thumb: l.thumb || '' }
                )
              : initialItem.url
              ? [{ id: 'lnk-0', url: initialItem.url, label: '', thumb: initialItem.thumbnail || '' }]
              : [];
          setLinks(migratedLinks);
          setNewLinkUrl('');
          setNewLinkLabel('');
          setThumbOnlyUrl('');
          setFetchingLinkId(null);
          setThumbnail(initialItem.thumbnail || '');
          setReminderDate(initialItem.reminderDate || '');
          setReminderTime(initialItem.reminderTime || '');
          setDueDate(initialItem.dueDate || '');
          setRecurrence(initialItem.recurrence || 'none');

          const loadedImgs = Array.isArray(initialItem.images)
            ? initialItem.images.map((im, idx) =>
                typeof im === 'string' ? { id: `img-${idx}`, src: im, name: `Foto ${idx + 1}` } : im
              )
            : [];
          setImages(loadedImgs);

          const loadedAuds = Array.isArray(initialItem.audios)
            ? initialItem.audios.map((au, idx) =>
                typeof au === 'string' ? { id: `aud-${idx}`, src: au, name: `Áudio ${idx + 1}` } : au
              )
            : [];
          setAudios(loadedAuds);

          setFreeNotes(Array.isArray(initialItem.freeNotes) ? initialItem.freeNotes : []);
          setNoteDraft('');
          setGenreOrTopic(initialItem.genreOrTopic || '');
          setTagsInput((initialItem.tags || []).join(', '));
          setFolderId(initialItem.folderId || defaultFolderId || '');
          setPriority(initialItem.priority || 'later');
          setNotificationMode(initialItem.notificationMode || 'none');
          setWatchLater(Boolean(initialItem.watchLater));
          setItemIsPrivate(Boolean(initialItem.isPrivate));
          setAssignedPersons(initialItem.assignedPersons || []);
        } else {
          setTitle('');
          setUrl('');
          setLinks([]);
          setNewLinkUrl('');
          setNewLinkLabel('');
          setThumbOnlyUrl('');
          setFetchingLinkId(null);
          setThumbnail('');
          setReminderDate(defaultDateStr || '');
          setReminderTime('');
          setDueDate(defaultDateStr || '');
          setRecurrence('none');
          setImages([]);
          setAudios([]);
          setFreeNotes([]);
          setNoteDraft('');
          setGenreOrTopic('');
          setTagsInput('');
          setFolderId(defaultFolderId || '');
          setPriority('later');
          setNotificationMode('none');
          setWatchLater(false);
          setItemIsPrivate(Boolean(isPrivateMode));
          setAssignedPersons([]);
        }
      }, [initialItem, isOpen, defaultFolderId, isPrivateMode, defaultDateStr]);

      const normalizeLinkUrl = (raw) => {
        const trimmed = (raw || '').trim();
        if (!trimmed) return '';
        return trimmed.startsWith('http://') || trimmed.startsWith('https://')
          ? trimmed
          : `https://${trimmed}`;
      };

      const handleAddLinkEntry = async () => {
        const normalized = normalizeLinkUrl(newLinkUrl);
        if (!normalized) {
          alert('Digite ou cole um link para adicionar.');
          return;
        }
        const entryId = `lnk-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
        const entry = {
          id: entryId,
          url: normalized,
          label: newLinkLabel.trim(),
          thumb: ''
        };
        setLinks((prev) => [...prev, entry]);
        setNewLinkUrl('');
        setNewLinkLabel('');

        setFetchingLinkId(entryId);
        const autoThumb = await fetchAutoThumbnail(normalized, entry.label || title);
        if (autoThumb) {
          setLinks((prev) =>
            prev.map((itemL) => (itemL.id === entryId ? { ...itemL, thumb: autoThumb } : itemL))
          );
          if (!thumbnail) {
            setThumbnail(autoThumb);
          }
        }
        setFetchingLinkId(null);
      };

      const handleGenerateThumbForLink = async (linkObj) => {
        const normalized = normalizeLinkUrl(linkObj?.url);
        if (!normalized) return;
        setFetchingLinkId(linkObj.id);
        const thumb = await fetchAutoThumbnail(normalized, linkObj.label || title);
        if (thumb) {
          setLinks((prev) =>
            prev.map((itemL) => (itemL.id === linkObj.id ? { ...itemL, thumb } : itemL))
          );
          setThumbnail(thumb);
        }
        setFetchingLinkId(null);
      };

      const handleGenerateThumbNow = async () => {
        const targetRaw = thumbOnlyUrl.trim() || newLinkUrl.trim() || links[0]?.url || url.trim();
        if (!targetRaw) {
          alert('Informe um link para gerar ou buscar a thumbnail.');
          return;
        }
        const normalized = normalizeLinkUrl(targetRaw);
        setFetchingThumb(true);
        setFetchingLinkId('thumb-only');
        const isDirectImg = /\.(png|jpe?g|gif|webp|svg|avif)(\?.*)?$/i.test(normalized);
        const thumb = isDirectImg ? normalized : await fetchAutoThumbnail(normalized, title);
        if (thumb) {
          setThumbnail(thumb);
          if (thumbOnlyUrl.trim()) {
            setThumbOnlyUrl('');
          }
        }
        setFetchingThumb(false);
        setFetchingLinkId(null);
      };

      const handleUploadThumbFromDevice = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          if (ev.target?.result) {
            setThumbnail(ev.target.result);
          }
        };
        reader.readAsDataURL(file);
      };

      const appendImagesFromFiles = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        Array.from(fileList).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setImages((prev) => [
              ...prev,
              {
                id: `img-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                name: file.name || 'Foto',
                src: ev.target.result
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
      };

      const appendAudioFromFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setAudios((prev) => [
            ...prev,
            {
              id: `aud-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              name: file.name || `Áudio ${prev.length + 1}`,
              src: ev.target.result
            }
          ]);
        };
        reader.readAsDataURL(file);
      };

      const startRecordingAudio = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          audioChunksRef.current = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (ev) => {
              setAudios((prev) => [
                ...prev,
                {
                  id: `aud-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  name: `Gravação de voz ${prev.length + 1}`,
                  src: ev.target.result
                }
              ]);
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach((t) => t.stop());
          };
          recorder.start();

          nextTitle = `Teste-${String(counter).padStart(2, '0')}`;

        const target = new Date(Date.now() + 60 * 1000);
        const autoDateIso = `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, '0')}-${String(target.getDate()).padStart(2, '0')}`;
        const autoTimeHHMM = `${String(target.getHours()).padStart(2, '0')}:${String(target.getMinutes()).padStart(2, '0')}`;

        const parsedTags = tagsInput

          title: nextTitle,
          url: (links[0]?.url || normalizeLinkUrl(newLinkUrl) || url.trim()) || undefined,

          folderId: folderId || null,
          priority: 'urgent',

          watchLater,
          reminderDate: reminderDate || autoDateIso,
          reminderTime: reminderTime || autoTimeHHMM,
          dueDate: dueDate || autoDateIso,
          recurrence: 'none',
          canceledDates: [],
          isPrivate: Boolean(itemIsPrivate),
          assignedPersons,
          seenConfirmed: false,
          archivedToHistory: false,
          createdAt: new Date().toISOString(),
          order: 0,
          boardPos: { x: 60 + Math.floor(Math.random() * 180), y: 60 + Math.floor(Math.random() * 180) },
          boardConnections: [],
        };

        onClose();
