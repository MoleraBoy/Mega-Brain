    const SYNC_BASE = 'https://ntfy.sh';

    function generateRoomCode() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let code = 'mb-';
      for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function getDeviceId() {
      let id = localStorage.getItem('mega_brain_device_id');
      if (!id) {
        id = 'dev-' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('mega_brain_device_id', id);
      }
      return id;
    }

    async function pushCloudState(roomCode, payload) {
      if (!roomCode) return false;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}`, {
          method: 'POST',
          body: JSON.stringify({
            updatedAt: Date.now(),
            deviceId: getDeviceId(),
            data: payload
          }),
          headers: {
            'Title': 'MegaBrainSync',
            'Tags': 'brain'
          }
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function pullCloudState(roomCode) {
      if (!roomCode) return null;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}/json?poll=1&since=all`);
        if (!res.ok) return null;
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const evt = JSON.parse(lines[i]);
            if (evt.event === 'message' && evt.message) {
              const parsed = JSON.parse(evt.message);
              if (parsed && parsed.data && parsed.updatedAt) {
                return parsed;
              }
            }
          } catch (err) {}
        }
      } catch (e) {}
      return null;
    }

        return null;

    async function fetchAutoThumbnail(url, titleText = '') {
      if (!url || !url.trim()) return null;
      const normalized = url.trim().startsWith('http') ? url.trim() : `https://${url.trim()}`;

      if (normalized.includes('youtube.com') || normalized.includes('youtu.be')) {
        let videoId = '';
        if (normalized.includes('youtu.be/')) videoId = normalized.split('youtu.be/')[1]?.split('?')[0];
        else if (normalized.includes('watch?v=')) videoId = normalized.split('watch?v=')[1]?.split('&')[0];
        else if (normalized.includes('/shorts/')) videoId = normalized.split('/shorts/')[1]?.split('?')[0];
        if (videoId) return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      }

      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(normalized)}`);
        const data = await res.json();
        if (data && data.status === 'success' && data.data?.image?.url) {
          return data.data.image.url;
        }
      } catch (e) {}

      try {
        return `https://image.thum.io/get/width/800/crop/450/${encodeURIComponent(normalized)}`;
      } catch (e) {}

      return buildFallbackThumbDataUrl(normalized, titleText);
    }

    // =========================================================================

    function triggerConfiguredAlert(title, body, mode = 'popup_only') {
      if (!mode || mode === 'none') return;

      if ((mode === 'vibrate_only' || mode === 'vibrate_sound') && typeof navigator !== 'undefined' && 'vibrate' in navigator) {
        try { navigator.vibrate([300, 150, 300, 150, 450]); } catch (e) {}
      }

      if (mode === 'vibrate_sound' && typeof window !== 'undefined') {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.65);
        } catch (e) {}
      }

      if ((mode === 'popup_only' || mode === 'vibrate_sound') && typeof window !== 'undefined' && 'Notification' in window) {
        if (Notification.permission === 'granted') {
          new Notification(title, { body });
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then((p) => {
            if (p === 'granted') new Notification(title, { body });
          });
        }
      }
    }

    // =========================================================================

    function doesItemOccurOnDate(item, isoDateStr) {
      if (!item || !isoDateStr) return false;
      const canceled = Array.isArray(item.canceledDates) ? item.canceledDates : [];
      if (canceled.includes(isoDateStr)) return false;

      const baseDate = item.reminderDate || (item.createdAt ? item.createdAt.slice(0, 10) : '');
      if (!baseDate) return false;

      const targetObj = new Date(isoDateStr + 'T12:00:00');
      const baseObj = new Date(baseDate + 'T12:00:00');
      const dayOfWeek = targetObj.getDay(); // 0 = Dom, 6 = Sáb

      const rec = item.recurrence || 'none';
      if (rec === 'none') {
        return baseDate === isoDateStr || item.dueDate === isoDateStr;
      }
      if (rec === 'daily') {
        return targetObj >= baseObj;
      }
      if (rec === 'weekly') {
        return targetObj >= baseObj && targetObj.getDay() === baseObj.getDay();
      }
      if (rec === 'weekends') {
        return targetObj >= baseObj && (dayOfWeek === 0 || dayOfWeek === 6);
      }
      return baseDate === isoDateStr;
    }

    // =========================================================================
    // QUADRO DE DETETIVE (CARDS ARRASTÁVEIS + LINHAS CONECTORAS VERMELHAS)
    // =========================================================================
    const DetectiveBoardView = ({ items, onUpdateBoardPos, onToggleConnection, onOpenDetail }) => {
      const [draggingId, setDraggingId] = useState(null);
      const [linkingFromId, setLinkingFromId] = useState(null);
      const boardRef = useRef(null);
      const dragOffsetRef = useRef({ x: 0, y: 0 });

      const positions = useMemo(() => {
        const map = {};
        items.forEach((it, idx) => {
          const col = idx % 3;
          const row = Math.floor(idx / 3);
          map[it.id] = it.boardPos || { x: 36 + col * 310, y: 36 + row * 230 };
        });
        return map;
      }, [items]);

      useEffect(() => {
        const handleMove = (e) => {
          if (!draggingId || !boardRef.current) return;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const rect = boardRef.current.getBoundingClientRect();
          const newX = Math.max(12, clientX - rect.left - dragOffsetRef.current.x);
          const newY = Math.max(12, clientY - rect.top - dragOffsetRef.current.y);
          onUpdateBoardPos(draggingId, { x: Math.round(newX), y: Math.round(newY) });
        };

        const handleUp = () => {
          setDraggingId(null);
        };

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleUp);
        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleUp);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleUp);
        };
      }, [draggingId, onUpdateBoardPos]);

      const lines = useMemo(() => {
        const list = [];
        items.forEach((it) => {
          const fromPos = positions[it.id];
          if (!fromPos || !Array.isArray(it.boardConnections)) return;
          it.boardConnections.forEach((targetId) => {
            const toPos = positions[targetId];
            if (toPos) {
              list.push({
                id: `${it.id}->${targetId}`,
                x1: fromPos.x + 120,
                y1: fromPos.y + 70,
                x2: toPos.x + 120,
                y2: toPos.y + 70,
              });
            }
          });
        });
        return list;
      }, [items, positions]);

      return (
        <div className="space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 px-4 py-2.5 rounded-xl text-xs">
            <span className="font-semibold flex items-center gap-1.5">
              🕵️ Quadro de Detetive — Arraste as pistas/tarefas livremente e conecte fios vermelhos entre elas.
            </span>
            {linkingFromId && (
              <span className="text-rose-600 dark:text-rose-400 font-bold">
                Clique em outra tarefa para ligar/desligar o fio vermelho!
              </span>
            )}
          </div>

          <div
            ref={boardRef}
            className="relative w-full min-h-[640px] rounded-2xl border-2 border-amber-900/20 dark:border-amber-700/30 bg-[#f7f1e3] dark:bg-[#1e1b18] overflow-auto shadow-inner"
            style={{
              backgroundImage: 'radial-gradient(rgba(120, 53, 15, 0.14) 1px, transparent 1px)',
              backgroundSize: '20px 20px'
            }}
          >
            <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ minWidth: '960px', minHeight: '640px' }}>
              {lines.map((ln) => (
                <line
                  key={ln.id}
                  x1={ln.x1}
                  y1={ln.y1}
                  x2={ln.x2}
                  y2={ln.y2}
                  stroke="#dc2626"
                  strokeWidth="3"
                  strokeDasharray="6 3"
                />
              ))}
            </svg>

            {items.map((it) => {
              const pos = positions[it.id] || { x: 40, y: 40 };
              const thumb = it.thumbnail || (Array.isArray(it.images) && (typeof it.images[0] === 'string' ? it.images[0] : it.images[0]?.src));
              const isLinkingOrigin = linkingFromId === it.id;

              return (
                <div
                  key={it.id}
                  style={{ left: `${pos.x}px`, top: `${pos.y}px` }}
                  onMouseDown={(e) => {
                    if (e.target.closest('button')) return;
                    const rect = e.currentTarget.getBoundingClientRect();
                    dragOffsetRef.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                    setDraggingId(it.id);
                  }}
                  onTouchStart={(e) => {
                    if (e.target.closest('button')) return;
                    const rect = e.currentTarget.getBoundingClientRect();
                    const t = e.touches[0];
                    dragOffsetRef.current = { x: t.clientX - rect.left, y: t.clientY - rect.top };
                    setDraggingId(it.id);
                  }}
                  onClick={() => {
                    if (linkingFromId && linkingFromId !== it.id) {
                      onToggleConnection(linkingFromId, it.id);
                      setLinkingFromId(null);
                    }
                  }}
                  className={`absolute w-60 rounded-xl bg-amber-50 dark:bg-zinc-900 border-2 p-3 shadow-xl cursor-grab active:cursor-grabbing select-none ${
                    isLinkingOrigin
                      ? 'border-rose-600 ring-2 ring-rose-400'
                      : 'border-amber-700/40 dark:border-amber-500/40'
                  }`}
                >
                  <div className="w-3 h-3 rounded-full bg-rose-600 mx-auto -mt-4 mb-1.5 shadow" />
                  {thumb && (
                    <img src={thumb} alt={it.title} className="w-full h-24 object-cover rounded-lg mb-2 border border-amber-900/20" />
                  )}
                  <p className="text-xs font-bold leading-snug break-words">{it.title}</p>
                  {it.freeNotes && it.freeNotes[0] && (
                    <p className="text-[11px] text-slate-600 dark:text-zinc-400 line-clamp-2 mt-1">{it.freeNotes[0]}</p>
                  )}
                  <div className="flex items-center justify-between gap-1.5 mt-2.5 pt-2 border-t border-amber-900/15">
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setLinkingFromId(isLinkingOrigin ? null : it.id);
                      }}
                      className={`px-2 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 ${
                        isLinkingOrigin ? 'bg-rose-600 text-white' : 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                      }`}
                    >
                      🔗 {isLinkingOrigin ? 'Ligar em...' : 'Fio'}
                    </button>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        onOpenDetail(it);
                      }}
                      className="px-2 py-1 rounded-lg bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 text-[10px] font-semibold"
                    >
                      Abrir
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // =========================================================================
    // CRONÔMETRO + TEMPORIZADOR (POMODORO / CONTAGEM REGRESSIVA)
    // =========================================================================
    const StopwatchAndTimerWidget = ({ onNotify }) => {
      const [tabMode, setTabMode] = useState('timer'); // 'timer' | 'stopwatch'
      const [secondsLeft, setSecondsLeft] = useState(25 * 60);
      const [timerRunning, setTimerRunning] = useState(false);
      const [customMinutes, setCustomMinutes] = useState(25);
      const [alertMode, setAlertMode] = useState('vibrate_sound');

      const [stopwatchSeconds, setStopwatchSeconds] = useState(0);
      const [stopwatchRunning, setStopwatchRunning] = useState(false);
      const [laps, setLaps] = useState([]);

      useEffect(() => {
        if (!timerRunning) return;
        const interval = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              setTimerRunning(false);
              onNotify('⏰ Temporizador Finalizado!', 'O tempo configurado terminou.', alertMode);
              return customMinutes * 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [timerRunning, customMinutes, alertMode, onNotify]);

      useEffect(() => {
        if (!stopwatchRunning) return;
        const interval = setInterval(() => {
          setStopwatchSeconds((prev) => prev + 1);
        }, 1000);
        return () => clearInterval(interval);
      }, [stopwatchRunning]);

      const formatHMS = (totalSec) => {
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        if (hrs > 0) {
          return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-4 shadow-material">
          <div className="flex items-center justify-between gap-1 mb-3">
            <button
              type="button"
              onClick={() => setTabMode('timer')}
              className={`flex-1 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1 ${
                tabMode === 'timer' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300'
              }`}
            >
              <Icon name="timer" size={13} /> Temporizador
            </button>
            <button
              type="button"
              onClick={() => setTabMode('stopwatch')}
              className={`flex-1 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1 ${
                tabMode === 'stopwatch' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300'
              }`}
            >
              <Icon name="clock" size={13} /> Cronômetro
            </button>
          </div>

          {tabMode === 'timer' ? (
            <>
              <div className="flex gap-1 mb-2">
                {[5, 25, 45].map((m) => (
                  <button
                    key={m}
                    type="button"
                    onClick={() => { setTimerRunning(false); setCustomMinutes(m); setSecondsLeft(m * 60); }}
                    className={`flex-1 text-[11px] py-0.5 rounded-full font-semibold ${
                      customMinutes === m ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' : 'text-slate-500'
                    }`}
                  >
                    {m}m
                  </button>
                ))}
              </div>
              <div className="text-3xl font-bold tracking-tight text-center my-2 font-mono">
                {formatHMS(secondsLeft)}
              </div>
              <div className="flex items-center gap-2 mb-2 text-xs">
                <span className="text-slate-400">Min:</span>
                <input
                  type="number"
                  min={1}
                  max={240}
                  value={customMinutes}
                  onChange={(e) => {
                    const val = Math.max(1, Number(e.target.value) || 1);
                    setTimerRunning(false);
                    setCustomMinutes(val);
                    setSecondsLeft(val * 60);
                  }}
                  className="w-20 px-2 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent text-xs"
                />
              </div>
              <div className="mb-2.5">
                <select
                  value={alertMode}
                  onChange={(e) => setAlertMode(e.target.value)}
                  className="w-full text-[11px] px-2 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
                >
                  {NOTIF_MODES.map((m) => (
                    <option key={m.id} value={m.id} className="dark:bg-zinc-900">Alerta: {m.label}</option>
                  ))}
                </select>
              </div>
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setTimerRunning(!timerRunning)}
                  className="flex-1 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center justify-center gap-1"
                >
                  <Icon name={timerRunning ? 'pause' : 'play'} size={14} />
                  {timerRunning ? 'Pausar' : 'Iniciar'}
                </button>
                <button
                  type="button"
                  onClick={() => { setTimerRunning(false); setSecondsLeft(customMinutes * 60); }}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
                >
                  Resetar
                </button>
              </div>
            </>
          ) : (
            <>
              <div className="text-3xl font-bold tracking-tight text-center my-2 font-mono">
                {formatHMS(stopwatchSeconds)}
              </div>
              <div className="flex gap-1.5">
                <button
                  type="button"
                  onClick={() => setStopwatchRunning(!stopwatchRunning)}
                  className="flex-1 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold flex items-center justify-center gap-1"
                >
                  <Icon name={stopwatchRunning ? 'pause' : 'play'} size={14} />
                  {stopwatchRunning ? 'Pausar' : 'Iniciar'}
                </button>
                <button
                  type="button"
                  onClick={() => setLaps((prev) => [formatHMS(stopwatchSeconds), ...prev])}
                  className="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-zinc-800 text-xs font-semibold"
                >
                  Volta
                </button>
                <button
                  type="button"
                  onClick={() => { setStopwatchRunning(false); setStopwatchSeconds(0); setLaps([]); }}
                  className="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
                >
                  Zerar
                </button>
              </div>
              {laps.length > 0 && (
                <div className="mt-2.5 max-h-24 overflow-y-auto space-y-1 text-[11px] font-mono border-t border-slate-100 dark:border-zinc-800 pt-2">
                  {laps.map((lp, idx) => (
                    <div key={idx} className="flex justify-between text-slate-500">
                      <span>Volta #{laps.length - idx}</span>
                      <strong>{lp}</strong>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}
        </div>
      );
    };

    const PinModal = ({ isOpen, onClose, currentPin, onSetPin, onUnlock }) => {
      const [pinInput, setPinInput] = useState('');
      const [newPin, setNewPin] = useState('');

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-zinc-900 rounded-2xl max-w-sm w-full p-6 border border-slate-200 dark:border-zinc-800 shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-base font-bold flex items-center gap-2">
                <Icon name="lock" size={18} className="text-amber-500" /> Cofre & Pastas Privadas
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800">
                <Icon name="x" size={16} />
              </button>
            </div>

            {currentPin ? (
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (pinInput === currentPin) {
                    setPinInput('');
                    onUnlock();
                    onClose();
                  } else {
                    alert('PIN incorreto!');
                  }
                }}
                className="space-y-3"
              >
                <p className="text-xs text-slate-500">Digite seu PIN de acesso para gerenciar ou visualizar itens/pastas privadas:</p>
                <input
                  type="password"
                  maxLength={8}
                  required
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  placeholder="Digite o PIN..."
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-center text-lg tracking-widest"
                />
                <button type="submit" className="w-full py-2 rounded-xl bg-amber-600 text-white text-xs font-semibold">
                  Desbloquear Cofre Privado
                </button>
              </form>
            ) : (
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (newPin.trim().length < 4) {
                    alert('Escolha um PIN de pelo menos 4 dígitos.');
                    return;
                  }
                  onSetPin(newPin.trim());
                  onUnlock();
                  onClose();
                }}
                className="space-y-3"
              >
                <p className="text-xs text-slate-500">Defina um PIN para proteger suas pastas e tarefas no cofre:</p>
                <input
                  type="password"
                  maxLength={8}
                  required
                  value={newPin}
                  onChange={(e) => setNewPin(e.target.value)}
                  placeholder="Criar PIN (mín. 4 dígitos)..."
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-center text-lg tracking-widest"
                />
                <button type="submit" className="w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">
                  Salvar PIN e Continuar
                </button>
              </form>
            )}
          </div>
        </div>
      );
    };

    const CancelRecurrenceModal = ({ isOpen, onClose, item, dateStr, onCancelOnlyThisDate, onCancelAllOccurrences }) => {
