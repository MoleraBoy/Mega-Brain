          <div className="bg-white dark:bg-zinc-900 rounded-2xl max-w-md w-full p-6 border border-slate-200 dark:border-zinc-800 shadow-2xl space-y-4">
            <h3 className="text-base font-bold flex items-center gap-2 text-rose-600">
              <Icon name="repeat" size={18} /> Cancelar Atividade Recorrente
            </h3>
            <p className="text-xs text-slate-600 dark:text-zinc-300">
              A tarefa <strong>"{item.title}"</strong> possui recorrência. Você deseja cancelar apenas a ocorrência de <strong>{dateStr}</strong> ou todas as ocorrências?
            </p>
            <div className="flex flex-col gap-2 pt-2">
              <button
                onClick={() => { onCancelOnlyThisDate(item.id, dateStr); onClose(); }}
                className="w-full py-2.5 px-4 rounded-xl bg-amber-600 text-white text-xs font-semibold text-left flex items-center justify-between"
              >
                <span>Cancelar só para este dia ({dateStr})</span>
                <Icon name="calendar-x" size={15} />
              </button>
              <button
                onClick={() => { onCancelAllOccurrences(item.id); onClose(); }}
                className="w-full py-2.5 px-4 rounded-xl bg-rose-600 text-white text-xs font-semibold text-left flex items-center justify-between"
              >
                <span>Cancelar para todas as ocorrências</span>
                <Icon name="trash-2" size={15} />
              </button>
              <button
                onClick={onClose}
                className="w-full py-2 px-4 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-medium"
              >
                Voltar
              </button>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // REVISÃO DE QUARTA-FEIRA
    // =========================================================================
    const WednesdayReviewModal = ({ isOpen, onClose, items, onConfirmSeen, onSnoozeItems }) => {
      const [selectedIds, setSelectedIds] = useState([]);
      const [customDate, setCustomDate] = useState('');

      const unseenLaterItems = useMemo(
        () => items.filter((it) => it.watchLater && !it.seenConfirmed && !it.archivedToHistory),
        [items]
      );

      useEffect(() => {
        if (isOpen) {
          setSelectedIds(unseenLaterItems.map((i) => i.id));
        }
      }, [isOpen, unseenLaterItems]);

      if (!isOpen) return null;

      const toggleSelect = (id) => {
        setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
      };

      const nextWednesdayIso = () => {
        const d = new Date();
        const diff = (3 - d.getDay() + 7) % 7 || 7;
        d.setDate(d.getDate() + diff);
        return d.toISOString().slice(0, 10);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white dark:bg-zinc-900 rounded-2xl max-w-lg w-full p-6 border border-slate-200 dark:border-zinc-800 shadow-2xl my-8 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-zinc-800 pb-3">
              <div>
                <h3 className="text-base font-bold flex items-center gap-2">
                  <Icon name="calendar" size={18} className="text-indigo-500" />
                  Check-in de Quarta: Itens "Ver Depois"
                </h3>
                <p className="text-xs text-slate-500">
                  Itens marcados para ler/assistir depois sem data fixa. Deseja ver algum hoje?
                </p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800">
                <Icon name="x" size={16} />
              </button>
            </div>

            {unseenLaterItems.length === 0 ? (
              <p className="text-xs text-slate-400 py-6 text-center">Nenhum item pendente para revisão hoje!</p>
            ) : (
              <div className="space-y-2 max-h-60 overflow-y-auto">
                {unseenLaterItems.map((it) => (
                  <label
                    key={it.id}
                    className="flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 dark:border-zinc-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-zinc-950"
                  >
                    <input
                      type="checkbox"
                      checked={selectedIds.includes(it.id)}
                      onChange={() => toggleSelect(it.id)}
                      className="rounded text-indigo-600"
                    />
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-semibold truncate">{it.title}</p>
                      <p className="text-[11px] text-slate-400 truncate">{it.whySaved || it.whatIsIt}</p>
                    </div>
                  </label>
                ))}
              </div>
            )}

            <div className="pt-3 border-t border-slate-100 dark:border-zinc-800 space-y-3">
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={() => { onConfirmSeen(selectedIds); onClose(); }}
                  className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold"
                >
                  Marcar Selecionados como Vistos ({selectedIds.length})
                </button>
                <button
                  onClick={() => { onSnoozeItems(unseenLaterItems.map((i) => i.id), nextWednesdayIso()); onClose(); }}
                  className="px-3 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 text-xs font-semibold"
                >
                  Lembrar Próxima Quarta
                </button>
                <button
                  onClick={onClose}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
                >
                  Nenhum Hoje
                </button>
              </div>

              <div className="flex items-center gap-2 text-xs flex-wrap">
                <span>Escolher outro dia:</span>
                <input
                  type="date"
                  value={customDate}
                  onChange={(e) => setCustomDate(e.target.value)}
                  className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
                />
                <button
                  onClick={() => {
                    if (!customDate) return;
                    onSnoozeItems(unseenLaterItems.map((i) => i.id), customDate);
                    onClose();
                  }}
                  className="px-3 py-1 rounded-lg bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-semibold"
                >
                  Agendar
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // ÁRVORE DE PASTAS + LISTA DE TAREFAS E ANOTAÇÕES DENTRO DA PASTA SELECIONADA
    // =========================================================================
    const FolderTreeSidebar = ({
      folders,
      items,
      selectedFolderId,
      onSelectFolder,
      onCreateFolder,
      onEditFolder,
      onDeleteFolder,
      onAddFolderTask,
      onMoveFolderOrder,
      onToggleFolderVault,
      onOpenItemDetail,
      isPrivateMode
    }) => {
      const [contextMenu, setContextMenu] = useState(null);
      const [editingFolderId, setEditingFolderId] = useState(null);
      const [editName, setEditName] = useState('');
      const [creatingParentId, setCreatingParentId] = useState(null);
      const [newFolderName, setNewFolderName] = useState('');
      const [collapsedMap, setCollapsedMap] = useState({});
      const [dragOverFolderId, setDragOverFolderId] = useState(null);
      const [draggedFolderId, setDraggedFolderId] = useState(null);
      const longPressTimer = useRef(null);

      const scopedFolders = folders.filter((f) => Boolean(f.isPrivate) === Boolean(isPrivateMode));

      // Coleta pasta selecionada + subpastas dela para exibir tarefas e anotações em lista
      const selectedFolderBranchIds = useMemo(() => {
        if (!selectedFolderId) return null;
        const set = new Set([selectedFolderId]);
        let added = true;
        while (added) {
          added = false;
          folders.forEach((f) => {
            if (f.parentId && set.has(f.parentId) && !set.has(f.id)) {
              set.add(f.id);
              added = true;
            }
          });
        }
        return set;
      }, [selectedFolderId, folders]);

      const folderItemsList = useMemo(() => {
        if (!selectedFolderBranchIds) return [];
        return items.filter(
          (it) => Boolean(it.isPrivate) === Boolean(isPrivateMode) && it.folderId && selectedFolderBranchIds.has(it.folderId)
        );
      }, [items, isPrivateMode, selectedFolderBranchIds]);

      const toggleCollapse = (folderId, e) => {
        if (e) e.stopPropagation();
        setCollapsedMap((prev) => ({ ...prev, [folderId]: !prev[folderId] }));
      };

      const handleTouchStart = (folder, e) => {
        longPressTimer.current = setTimeout(() => {
          const touch = e.touches[0];
          setDraggedFolderId(folder.id);
          setContextMenu({ folder, x: touch.clientX, y: touch.clientY });
        }, 550);
      };

      const handleTouchEnd = () => {
        if (longPressTimer.current) clearTimeout(longPressTimer.current);
      };

      const renderBranch = (parentId = null, depth = 0) => {
        const children = scopedFolders.filter((f) => (f.parentId || null) === parentId);
        return (
          <div className={depth > 0 ? 'ml-3 pl-2 border-l border-slate-200 dark:border-zinc-800 space-y-1 mt-1' : 'space-y-1'}>
            {children.map((folder) => {
              const hasSubfolders = scopedFolders.some((f) => f.parentId === folder.id);
              const isCollapsed = Boolean(collapsedMap[folder.id]);
              const isSelected = selectedFolderId === folder.id;
              const isEditing = editingFolderId === folder.id;
              const isDragTarget = dragOverFolderId === folder.id;

              return (
                <div key={folder.id} className="relative">
                  {isEditing ? (
                    <div className="flex gap-1 py-1">
                      <input
                        autoFocus
                        type="text"
                        value={editName}
                        onChange={(e) => setEditName(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            onEditFolder(folder.id, editName);
                            setEditingFolderId(null);
                          }
                        }}
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-500 bg-white dark:bg-zinc-900"
                      />
                      <button
                        onClick={() => {
                          onEditFolder(folder.id, editName);
                          setEditingFolderId(null);
                        }}
                        className="px-2 py-1 bg-indigo-600 text-white text-xs rounded"
                      >
                        OK
                      </button>
                    </div>
                  ) : (
                    <div
                      draggable
                      onDragStart={(e) => {
                        setDraggedFolderId(folder.id);
                        e.dataTransfer.setData('text/plain', `folder:${folder.id}`);
                      }}
                      onDragEnter={(e) => {
                        e.preventDefault();
                        setDragOverFolderId(folder.id);
                      }}
                      onDragOver={(e) => {
                        e.preventDefault();
                        if (dragOverFolderId !== folder.id) setDragOverFolderId(folder.id);
                      }}
                      onDragLeave={() => {
                        if (dragOverFolderId === folder.id) setDragOverFolderId(null);
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        setDragOverFolderId(null);
                        const data = e.dataTransfer.getData('text/plain') || (draggedFolderId ? `folder:${draggedFolderId}` : '');
                        setDraggedFolderId(null);
                        if (!data) return;
                        if (data.startsWith('item:')) {
                          const itemId = data.split(':')[1];
                          window.dispatchEvent(new CustomEvent('megabrain:move-item', { detail: { itemId, folderId: folder.id } }));
                        } else if (data.startsWith('folder:')) {
                          const fromFolderId = data.split(':')[1];
                          if (fromFolderId && fromFolderId !== folder.id && onMoveFolderOrder) {
                            onMoveFolderOrder(fromFolderId, folder.id);
                          }
                        }
                      }}
                      onTouchStart={(e) => handleTouchStart(folder, e)}
                      onTouchEnd={handleTouchEnd}
                      onClick={() => onSelectFolder(folder.id)}
                      onContextMenu={(e) => {
                        e.preventDefault();
                        setContextMenu({ folder, x: e.clientX, y: e.clientY });
                      }}
                      className={`group flex items-center justify-between px-2 py-1.5 rounded-lg text-sm cursor-pointer transition select-none ${
                        isDragTarget ? 'drag-over-target' : ''
                      } ${
                        isSelected
                          ? 'bg-indigo-600 text-white font-medium shadow-sm'
                          : 'text-slate-700 dark:text-zinc-300 hover:bg-slate-200/70 dark:hover:bg-zinc-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 min-w-0">
                        <button
                          type="button"
                          onClick={(e) => toggleCollapse(folder.id, e)}
                          title={isCollapsed ? 'Maximizar pasta' : 'Minimizar pasta'}
                          className={`p-0.5 rounded hover:bg-black/10 dark:hover:bg-white/10 ${
                            isSelected ? 'text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name={isCollapsed ? 'chevron-right' : 'chevron-down'} size={14} />
                        </button>
                        <Icon
                          name={folder.isPrivate ? 'lock' : isCollapsed ? 'folder' : hasSubfolders ? 'folder-open' : 'folder'}
                          size={15}
                          className={isSelected ? 'text-white' : 'text-indigo-500'}
                        />
                        <span className="truncate">{folder.name}</span>
                      </div>

                      <div className="flex items-center gap-0.5 shrink-0">
                        <button
                          type="button"
                          onClick={(e) => toggleCollapse(folder.id, e)}
                          title={isCollapsed ? 'Maximizar' : 'Minimizar'}
                          className={`p-1 rounded text-[11px] opacity-70 group-hover:opacity-100 ${
                            isSelected ? 'text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name={isCollapsed ? 'maximize-2' : 'minimize-2'} size={12} />
                        </button>
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            const rect = e.currentTarget.getBoundingClientRect();
                            setContextMenu({ folder, x: rect.left, y: rect.bottom + 5 });
                          }}
                          className={`p-1 rounded opacity-80 group-hover:opacity-100 ${isSelected ? 'text-white' : 'text-slate-500'}`}
                        >
                          <Icon name="more-vertical" size={14} />
                        </button>
                      </div>
                    </div>
                  )}

                  {creatingParentId === folder.id && (
                    <div className="mt-1 ml-4 flex gap-1">
                      <input
                        autoFocus
                        type="text"
                        value={newFolderName}
                        onChange={(e) => setNewFolderName(e.target.value)}
                        placeholder="Nome da subpasta..."
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-400 bg-white dark:bg-zinc-900"
                      />
                      <button
                        onClick={() => {
                          if (newFolderName.trim()) {
                            onCreateFolder(newFolderName.trim(), folder.id, isPrivateMode);
                            setNewFolderName('');
                            setCreatingParentId(null);
                            setCollapsedMap((prev) => ({ ...prev, [folder.id]: false }));
                          }
                        }}
                        className="px-2 py-1 bg-indigo-600 text-white text-xs rounded"
                      >
                        Criar
                      </button>
                    </div>
                  )}

                  {!isCollapsed && renderBranch(folder.id, depth + 1)}
                </div>
              );
            })}
          </div>
        );
      };

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-3.5 shadow-material space-y-2.5">
          <div className="flex items-center justify-between">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
              {isPrivateMode ? 'Pastas do Cofre 🔒' : 'Pastas & Subpastas'}
            </span>
            <button
              onClick={() => {
                const name = prompt('Nome da nova pasta raiz:');
                if (name) onCreateFolder(name, null, isPrivateMode);
              }}
              className="text-xs flex items-center gap-1 text-indigo-600 dark:text-indigo-400 font-medium"
            >
              <Icon name="plus" size={14} /> Nova
            </button>
          </div>

          <button
            onClick={() => onSelectFolder(null)}
            className={`w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-sm transition ${
              selectedFolderId === null
                ? 'bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-medium'
                : 'text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800'
            }`}
          >
            <Icon name="layers" size={15} />
            <span>Todas as Pastas</span>
          </button>

          {renderBranch(null, 0)}

          {/* Lista compacta de tarefas e anotações dentro da pasta/subpasta clicada */}
          {selectedFolderId && (
            <div className="pt-2.5 border-t border-slate-100 dark:border-zinc-800 space-y-1.5">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold text-slate-500">
                  Itens na pasta ({folderItemsList.length})
                </span>
                <button
                  onClick={() => onAddFolderTask(selectedFolderId)}
                  className="text-[11px] text-indigo-600 dark:text-indigo-400 font-semibold hover:underline"
                >
                  + Adicionar
                </button>
              </div>
              {folderItemsList.length === 0 ? (
                <p className="text-[11px] text-slate-400 py-1">Nenhuma tarefa ou anotação nesta pasta.</p>
              ) : (
                <ul className="space-y-1 max-h-48 overflow-y-auto pr-0.5">
                  {folderItemsList.map((it) => {
                    const notesPreview = Array.isArray(it.freeNotes) && it.freeNotes.length > 0 ? it.freeNotes[0] : '';
                    return (
                      <li key={it.id}>
                        <button
                          type="button"
                          onClick={() => onOpenItemDetail(it)}
                          className="w-full text-left px-2 py-1.5 rounded-lg bg-slate-50 dark:bg-zinc-950 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 border border-slate-200/70 dark:border-zinc-800 transition"
                        >
                          <p className="text-xs font-semibold truncate">{it.title}</p>
                          {notesPreview && (
                            <p className="text-[10px] text-amber-700 dark:text-amber-300 truncate">📝 {notesPreview}</p>
                          )}
                        </button>
                      </li>
                    );
                  })}
                </ul>
              )}
            </div>
          )}

          {contextMenu && (
            <div className="fixed inset-0 z-50" onClick={() => setContextMenu(null)}>
              <div
                style={{ top: Math.min(contextMenu.y, window.innerHeight - 280), left: Math.min(contextMenu.x, window.innerWidth - 220) }}
                className="absolute bg-white dark:bg-zinc-900 rounded-xl border border-slate-200 dark:border-zinc-700 shadow-2xl py-1.5 w-56 text-xs z-50"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-3 py-1.5 font-bold text-slate-400 border-b border-slate-100 dark:border-zinc-800 truncate">
                  {contextMenu.folder.name}
                </div>
                <button
                  onClick={() => { toggleCollapse(contextMenu.folder.id); setContextMenu(null); }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name={collapsedMap[contextMenu.folder.id] ? 'maximize-2' : 'minimize-2'} size={14} />
                  {collapsedMap[contextMenu.folder.id] ? 'Maximizar Pasta' : 'Minimizar Pasta'}
                </button>
                <button
                  onClick={() => {
                    setEditingFolderId(contextMenu.folder.id);
                    setEditName(contextMenu.folder.name);
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name="pencil" size={14} /> Editar / Renomear Pasta
                </button>
                <button
                  onClick={() => {
                    setCreatingParentId(contextMenu.folder.id);
                    setNewFolderName('');
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name="folder-plus" size={14} /> Criar Subpasta
                </button>
                <button
                  onClick={() => {
                    onAddFolderTask(contextMenu.folder.id);
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name="check-square" size={14} /> Adicionar Tarefa aqui
                </button>
                <button
                  onClick={() => {
                    onToggleFolderVault(contextMenu.folder);
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-amber-50 dark:hover:bg-amber-950/40 text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-2"
                >
                  <Icon name={contextMenu.folder.isPrivate ? 'unlock' : 'lock'} size={14} />
                  {contextMenu.folder.isPrivate ? 'Mover Pasta para Público' : 'Mover Pasta para o Cofre'}
                </button>
                <button
                  onClick={() => {
                    if (confirm(`Deseja excluir a pasta "${contextMenu.folder.name}"?`)) {
                      onDeleteFolder(contextMenu.folder.id);
                    }
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-rose-50 text-rose-600 flex items-center gap-2 border-t border-slate-100 dark:border-zinc-800"
                >
                  <Icon name="trash-2" size={14} /> Excluir Pasta
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // CARD DE ITEM (CLICAR ABRE DETALHES; BOTÃO EDITAR FICA JUNTO AOS BOTÕES DE AÇÃO)
    // =========================================================================
    const BrainItemCard = ({
      item,
      folderPath,
      viewMode,
      onOpenDetail,
      onToggleDone,
      onRequestCancelItem,
      onToggleVault,
      onEdit,
      onTagClick,
      draggable,
      onDragStart,
      onDragOver,
      onDrop
    }) => {
      const pMeta = PRIORITY_META[item.priority] || PRIORITY_META.later;
      const itemImages = useMemo(() => {
        const list = [];
        if (item.thumbnail) list.push(item.thumbnail);
        if (Array.isArray(item.images)) {
          item.images.forEach((img) => {
            const src = typeof img === 'string' ? img : img?.src;
            if (src && !list.includes(src)) list.push(src);
          });
        }
        return list;
      }, [item.thumbnail, item.images]);

      const itemAudios = useMemo(() => {
        if (!Array.isArray(item.audios)) return [];
        return item.audios.map((a, idx) =>
          typeof a === 'string'
            ? { id: `aud-${idx}`, name: `Áudio ${idx + 1}`, src: a }
            : { id: a.id || `aud-${idx}`, name: a.name || `Áudio ${idx + 1}`, src: a.src }
        );
      }, [item.audios]);

      const itemNotes = useMemo(() => {
        if (!Array.isArray(item.freeNotes)) return [];
        return item.freeNotes.filter((n) => typeof n === 'string' && n.trim());
      }, [item.freeNotes]);

      const recurrenceLabel =
        item.recurrence === 'daily'
          ? 'Diária'
          : item.recurrence === 'weekly'
          ? 'Semanal'
          : item.recurrence === 'weekends'
          ? 'Fins de Semana'
          : null;

      if (viewMode === 'thumb') {
        const firstThumb = itemImages[0];
        return (
          <div
            draggable={draggable}
            onDragStart={onDragStart}
            onDragOver={onDragOver}
            onDrop={onDrop}
            onClick={() => onOpenDetail(item)}
            className="group relative aspect-square rounded-2xl overflow-hidden bg-slate-200 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-800 cursor-pointer shadow-material"
          >
            {firstThumb ? (
              <img src={firstThumb} alt={item.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            ) : (
              <div className="w-full h-full flex flex-col items-center justify-center p-3 text-center">
                <Icon name={itemAudios.length > 0 ? 'mic' : itemNotes.length > 0 ? 'file-text' : 'bookmark'} size={24} className="text-indigo-500 mb-1" />
                <span className="text-xs font-semibold line-clamp-2">{item.title}</span>
              </div>
            )}
            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 via-black/30 to-transparent p-2.5 text-white">
              <p className="text-xs font-semibold truncate">{item.title}</p>
            </div>
          </div>
        );
      }

      if (viewMode === 'list') {
        return (
          <div
            draggable={draggable}
            onDragStart={onDragStart}
            onDragOver={onDragOver}
            onDrop={onDrop}
            className={`bg-white dark:bg-zinc-900 rounded-xl border border-slate-200/80 dark:border-zinc-800 px-3.5 py-2.5 flex items-center justify-between gap-3 shadow-material ${pMeta.border}`}
          >
            <div className="flex items-center gap-3 min-w-0 flex-1 cursor-pointer" onClick={() => onOpenDetail(item)}>
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onToggleDone(item); }}
                className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${
                  item.priority === 'done' ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'
                }`}
              >
                {item.priority === 'done' && <Icon name="check" size={12} />}
              </button>
              <div className="min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-sm font-semibold truncate ${item.priority === 'done' ? 'line-through opacity-60' : ''}`}>
                    {item.title}
                  </span>
                  {folderPath && <span className="text-[11px] text-slate-400">• 📁 {folderPath}</span>}
                  {item.dueDate && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-semibold">
                      🏁 {item.dueDate}
                    </span>
                  )}
                  {recurrenceLabel && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-purple-50 text-purple-700 font-semibold">
                      🔁 {recurrenceLabel}
                    </span>
                  )}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              <button onClick={() => onEdit(item)} title="Editar" className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800 text-indigo-600">
                <Icon name="pencil" size={14} />
              </button>
              <button onClick={() => onRequestCancelItem(item)} title="Excluir" className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500">
                <Icon name="trash-2" size={14} />
              </button>
            </div>
          </div>
        );
      }

      const hrefUrl = item.url ? (item.url.startsWith('http') ? item.url : `https://${item.url}`) : null;

      return (
        <div
          draggable={draggable}
          onDragStart={onDragStart}
          onDragOver={onDragOver}
          onDrop={onDrop}
          className={`group bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 overflow-hidden shadow-material hover:shadow-material-lg transition-all flex flex-col justify-between ${pMeta.border}`}
        >
          <div onClick={() => onOpenDetail(item)} className="cursor-pointer">
            {itemImages.length > 0 && (
              <div className="relative h-36 w-full overflow-hidden bg-slate-100 dark:bg-zinc-800">
                <img
                  src={itemImages[0]}
                  alt={item.title}
                  className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div className="absolute top-2.5 left-2.5 flex gap-1.5">
                  <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full border backdrop-blur-md shadow-sm ${pMeta.badge}`}>
                    {pMeta.dot} {pMeta.label.split('/')[0]}
                  </span>
                </div>
              </div>
            )}

            <div className="p-4">
              {itemImages.length === 0 && (
                <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
                  <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full border ${pMeta.badge}`}>
                    {pMeta.dot} {pMeta.label.split('/')[0]}
                  </span>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {recurrenceLabel && (
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-purple-50 text-purple-700 dark:bg-purple-950 dark:text-purple-300 font-semibold">
                        🔁 {recurrenceLabel}
                      </span>
                    )}
                  </div>
                </div>
              )}

              <div className="flex items-center gap-1.5 text-xs text-indigo-600 dark:text-indigo-400 font-medium mb-1 flex-wrap">
                <span>{item.genreOrTopic || 'Geral'}</span>
                {folderPath && <span className="text-slate-400">• 📁 {folderPath}</span>}
                {item.dueDate && (
                  <span className="text-emerald-600 dark:text-emerald-400">• 🏁 {item.dueDate}</span>
                )}
              </div>

              <h3 className={`font-semibold text-base leading-snug mb-2 ${item.priority === 'done' ? 'line-through opacity-60' : ''}`}>
                {item.title}
              </h3>

              {itemNotes.length > 0 && (
                <div className="space-y-1 mb-2">
                  {itemNotes.slice(0, 2).map((noteText, nIdx) => (
                    <div
                      key={nIdx}
                      className="text-xs p-2 rounded-lg bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200/60 dark:border-amber-800/50 text-slate-700 dark:text-zinc-200 line-clamp-2"
                    >
                      📝 {noteText}
                    </div>
                  ))}
                </div>
              )}

              {itemAudios.length > 0 && (
                <div className="mb-2 text-[11px] font-semibold text-rose-700 dark:text-rose-300">
                  🎤 {itemAudios.length} áudio(s) anexado(s) — clique para ouvir
                </div>
              )}

              {item.tags && item.tags.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-2" onClick={(e) => e.stopPropagation()}>
                  {item.tags.map((tag, idx) => (
                    <button
                      key={idx}
                      onClick={() => onTagClick(tag)}
                      className="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400 hover:underline font-medium"
                    >
                      #{tag}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="px-4 py-2.5 bg-slate-50/80 dark:bg-zinc-950/60 border-t border-slate-100 dark:border-zinc-800 flex items-center justify-between gap-2 flex-wrap">
            <div className="flex items-center gap-1.5 flex-wrap">
              {hrefUrl && (
                <a
                  href={hrefUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="px-2.5 py-1 rounded-lg bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs font-medium flex items-center gap-1"
                >
                  <Icon name="external-link" size={13} /> Link
                </a>
              )}
              <button
                onClick={() => onToggleDone(item)}
                className="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-medium flex items-center gap-1"
              >
                <Icon name="check-circle" size={13} /> {item.priority === 'done' ? 'Reabrir' : 'Concluir'}
              </button>
              <button
                onClick={() => onEdit(item)}
                className="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200/70 text-xs font-semibold flex items-center gap-1"
              >
                <Icon name="pencil" size={13} /> Editar
              </button>
            </div>

            <div className="flex items-center gap-1">
              <button onClick={() => onToggleVault(item)} title="Cofre" className="p-1.5 rounded-lg hover:bg-amber-50 text-amber-600">
                <Icon name={item.isPrivate ? 'unlock' : 'lock'} size={14} />
              </button>
              <button onClick={() => onRequestCancelItem(item)} title="Excluir" className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500">
                <Icon name="trash-2" size={14} />
              </button>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // MODAL DE CRIAÇÃO / EDIÇÃO COM SEÇÕES MINIMIZÁVEIS E ESPAÇO SEGURO NO RODAPÉ
    // =========================================================================
    const ItemFormModal = ({
      isOpen,
      onClose,
      onSave,
      folders,
      initialItem,
      isPrivateMode,
      defaultFolderId,
      defaultDateStr
    }) => {
      const [title, setTitle] = useState('');
      const [url, setUrl] = useState('');
      const [thumbnail, setThumbnail] = useState('');

      const [reminderDate, setReminderDate] = useState('');
      const [reminderTime, setReminderTime] = useState('');
      const [dueDate, setDueDate] = useState('');
      const [recurrence, setRecurrence] = useState('none');

      const [images, setImages] = useState([]);
      const cameraInputRef = useRef(null);
      const galleryInputRef = useRef(null);

      const [audios, setAudios] = useState([]);
      const [recording, setRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const [freeNotes, setFreeNotes] = useState([]);
      const [noteDraft, setNoteDraft] = useState('');

      const [genreOrTopic, setGenreOrTopic] = useState('');
      const [tagsInput, setTagsInput] = useState('');
      const [folderId, setFolderId] = useState(defaultFolderId || '');
      const [priority, setPriority] = useState('later');
      const [notificationMode, setNotificationMode] = useState('none');
      const [watchLater, setWatchLater] = useState(false);
      const [itemIsPrivate, setItemIsPrivate] = useState(Boolean(isPrivateMode));
      const [assignedPersonInput, setAssignedPersonInput] = useState('');
      const [assignedPersons, setAssignedPersons] = useState([]);
      const [fetchingThumb, setFetchingThumb] = useState(false);

      // Seções minimizáveis na criação/edição
      const [minimizedSections, setMinimizedSections] = useState({
        schedule: false,
        notes: false,
        audios: true,
        images: true,
        extra: true,
      });

      const toggleSection = (key) => {
        setMinimizedSections((prev) => ({ ...prev, [key]: !prev[key] }));
      };

      useEffect(() => {
        if (initialItem) {
          setTitle(initialItem.title || '');
          setUrl(initialItem.url || '');
          setThumbnail(initialItem.thumbnail || '');
          setReminderDate(initialItem.reminderDate || '');
          setReminderTime(initialItem.reminderTime || '');
          setDueDate(initialItem.dueDate || '');
          setRecurrence(initialItem.recurrence || 'none');

          const loadedImgs = Array.isArray(initialItem.images)
            ? initialItem.images.map((im, idx) =>
                typeof im === 'string' ? { id: `img-${idx}`, src: im, name: `Foto ${idx + 1}` } : im
              )
            : [];
          setImages(loadedImgs);

          const loadedAuds = Array.isArray(initialItem.audios)
            ? initialItem.audios.map((au, idx) =>
                typeof au === 'string' ? { id: `aud-${idx}`, src: au, name: `Áudio ${idx + 1}` } : au
              )
            : [];
          setAudios(loadedAuds);

          setFreeNotes(Array.isArray(initialItem.freeNotes) ? initialItem.freeNotes : []);
          setNoteDraft('');
          setGenreOrTopic(initialItem.genreOrTopic || '');
          setTagsInput((initialItem.tags || []).join(', '));
          setFolderId(initialItem.folderId || defaultFolderId || '');
          setPriority(initialItem.priority || 'later');
          setNotificationMode(initialItem.notificationMode || 'none');
          setWatchLater(Boolean(initialItem.watchLater));
          setItemIsPrivate(Boolean(initialItem.isPrivate));
          setAssignedPersons(initialItem.assignedPersons || []);
        } else {
          setTitle('');
          setUrl('');
          setThumbnail('');
          setReminderDate(defaultDateStr || '');
          setReminderTime('');
          setDueDate(defaultDateStr || '');
          setRecurrence('none');
          setImages([]);
          setAudios([]);
          setFreeNotes([]);
          setNoteDraft('');
          setGenreOrTopic('');
          setTagsInput('');
          setFolderId(defaultFolderId || '');
          setPriority('later');
          setNotificationMode('none');
          setWatchLater(false);
          setItemIsPrivate(Boolean(isPrivateMode));
          setAssignedPersons([]);
        }
      }, [initialItem, isOpen, defaultFolderId, isPrivateMode, defaultDateStr]);

      const handleGenerateThumbNow = async () => {
        if (!url || !url.trim()) {
          alert('Cole ou digite um link primeiro para gerar a thumb.');
          return;
        }
        setFetchingThumb(true);
        const thumb = await fetchAutoThumbnail(url, title);
        if (thumb) {
          setThumbnail(thumb);
          setImages((prev) => {
            if (prev.some((i) => i.src === thumb)) return prev;
            return [{ id: `thumb-${Date.now()}`, name: 'Capa Gerada', src: thumb }, ...prev];
          });
        }
        setFetchingThumb(false);
      };

      const appendImagesFromFiles = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        Array.from(fileList).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setImages((prev) => [
              ...prev,
              {
                id: `img-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                name: file.name || 'Foto',
                src: ev.target.result
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
      };

      const appendAudioFromFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setAudios((prev) => [
            ...prev,
            {
              id: `aud-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              name: file.name || `Áudio ${prev.length + 1}`,
              src: ev.target.result
            }
          ]);
        };
        reader.readAsDataURL(file);
      };

      const startRecordingAudio = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          audioChunksRef.current = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (ev) => {
              setAudios((prev) => [
                ...prev,
                {
                  id: `aud-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  name: `Gravação de voz ${prev.length + 1}`,
                  src: ev.target.result
                }
              ]);
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach((t) => t.stop());
          };
          recorder.start();
          mediaRecorderRef.current = recorder;
          setRecording(true);
        } catch (err) {
          alert('Não foi possível acessar o microfone.');
        }
      };

      const stopRecordingAudio = () => {
        if (mediaRecorderRef.current && recording) {
          mediaRecorderRef.current.stop();
          setRecording(false);
        }
      };

      const handleAddFreeNote = () => {
        if (!noteDraft.trim()) return;
        setFreeNotes((prev) => [...prev, noteDraft.trim()]);
        setNoteDraft('');
      };

      if (!isOpen) return null;

      const scopedFolders = folders.filter((f) => Boolean(f.isPrivate) === Boolean(itemIsPrivate));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        const finalPersons = [...assignedPersons];
        if (assignedPersonInput.trim() && !finalPersons.includes(assignedPersonInput.trim())) {
          finalPersons.push(assignedPersonInput.trim());
        }

        const finalNotes = [...freeNotes];
        if (noteDraft.trim()) {
          finalNotes.push(noteDraft.trim());
        }

        const parsedTags = tagsInput
          .split(',')
          .map((t) => t.trim())
          .filter(Boolean);

        const payload = {
          ...(initialItem || {}),
          id: initialItem ? initialItem.id : `item-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          title: title.trim(),
          url: url.trim() || undefined,
          thumbnail: thumbnail.trim() || (images[0]?.src) || undefined,
          images,
          audios,
          freeNotes: finalNotes,
          genreOrTopic: genreOrTopic.trim() || 'Geral',
          tags: parsedTags,
          folderId: folderId || null,
          priority,
          notificationMode,
          watchLater,
          reminderDate: reminderDate || '',
          reminderTime: reminderTime || '',
          dueDate: dueDate || '',
          recurrence: recurrence || 'none',
          canceledDates: initialItem?.canceledDates || [],
          isPrivate: Boolean(itemIsPrivate),
          assignedPersons: finalPersons,
          seenConfirmed: initialItem ? initialItem.seenConfirmed : false,
          archivedToHistory: false,
          createdAt: initialItem ? initialItem.createdAt : new Date().toISOString(),
          order: initialItem ? initialItem.order : 0,
          boardPos: initialItem?.boardPos || { x: 60 + Math.floor(Math.random() * 180), y: 60 + Math.floor(Math.random() * 180) },
          boardConnections: initialItem?.boardConnections || [],
        };

        onSave(payload);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/55 backdrop-blur-sm flex items-start justify-center p-2 sm:p-4 overflow-y-auto pb-28">
          <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200 dark:border-zinc-800 w-full max-w-2xl p-4 sm:p-6 shadow-2xl my-2 sm:my-6 mb-24">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-zinc-800 gap-2">
              <h2 className="text-base sm:text-lg font-bold truncate">
                {initialItem ? 'Editar Tarefa / Item' : 'Nova Tarefa / Item'}
              </h2>
              <button type="button" onClick={onClose} className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800 shrink-0">
                <Icon name="x" size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 mt-4">
              {/* Título */}
              <div className="w-full">
                <label className="block text-xs font-semibold mb-1">Título da Tarefa / Item *</label>
                <input
                  required
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="Ex: Visita ao médico, Estudo React, Lembrete..."
                  className="w-full min-w-0 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-sm"
                />
              </div>

              {/* Link + Botão Gerar Thumb */}
              <div className="w-full">
                <label className="block text-xs font-semibold mb-1">Link da Tarefa / Mídia</label>
                <div className="flex flex-col sm:flex-row gap-2 w-full">
                  <input
                    type="text"
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    placeholder="https://..."
                    className="flex-1 min-w-0 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-sm"
                  />
                  <button
                    type="button"
                    onClick={handleGenerateThumbNow}
                    disabled={fetchingThumb}
                    className="px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center justify-center gap-1.5 shrink-0"
                  >
                    <Icon name="image" size={14} />
                    {fetchingThumb ? 'Gerando...' : 'Gerar Thumb'}
                  </button>
                </div>

                {thumbnail && (
                  <div className="mt-2 flex items-center gap-3 p-2 rounded-xl bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800">
                    <img src={thumbnail} alt="Thumb gerada" className="h-14 w-24 rounded-lg object-cover shrink-0" />
                    <div className="min-w-0 flex-1">
                      <p className="text-[11px] font-semibold text-emerald-600">Thumb pronta!</p>
                      <button type="button" onClick={() => setThumbnail('')} className="text-[11px] text-rose-500 hover:underline mt-0.5">
                        Remover thumb
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* SEÇÃO MINIMIZÁVEL: LEMBRETE, CONCLUSÃO E RECORRÊNCIA */}
              <div className="p-3 rounded-xl bg-indigo-50/50 dark:bg-indigo-950/20 border border-indigo-200/70 dark:border-indigo-800/50 space-y-2.5">
                <button
                  type="button"
                  onClick={() => toggleSection('schedule')}
                  className="w-full flex items-center justify-between text-xs font-bold text-indigo-900 dark:text-indigo-200"
                >
                  <span className="flex items-center gap-1.5">
                    <Icon name="bell" size={14} /> Data, Lembrete & Recorrência
                  </span>
                  <Icon name={minimizedSections.schedule ? 'chevron-down' : 'chevron-up'} size={15} />
                </button>

                {!minimizedSections.schedule && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 pt-1">
                    <div className="min-w-0">
                      <label className="block text-[11px] font-semibold mb-1">Dia do Lembrete</label>
                      <input
                        type="date"
                        value={reminderDate}
                        onChange={(e) => setReminderDate(e.target.value)}
                        className="w-full min-w-0 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                      />
                    </div>
                    <div className="min-w-0">
                      <label className="block text-[11px] font-semibold mb-1">Horário</label>
                      <input
                        type="time"
                        value={reminderTime}
                        onChange={(e) => setReminderTime(e.target.value)}
                        className="w-full min-w-0 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                      />
                    </div>
                    <div className="min-w-0">
                      <label className="block text-[11px] font-semibold mb-1">Data Conclusão</label>
                      <input
                        type="date"
                        value={dueDate}
                        onChange={(e) => setDueDate(e.target.value)}
                        className="w-full min-w-0 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                      />
                    </div>
                    <div className="min-w-0">
                      <label className="block text-[11px] font-semibold mb-1">Recorrência</label>
                      <select
                        value={recurrence}
                        onChange={(e) => setRecurrence(e.target.value)}
                        className="w-full min-w-0 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                      >
                        {RECURRENCE_MODES.map((r) => (
                          <option key={r.id} value={r.id}>{r.label}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                )}
              </div>

              {/* SEÇÃO MINIMIZÁVEL: NOTAS LIVRES */}
              <div className="p-3 rounded-xl bg-amber-50/50 dark:bg-amber-950/20 border border-amber-200/70 dark:border-amber-800/50 space-y-2">
                <button
                  type="button"
                  onClick={() => toggleSection('notes')}
                  className="w-full flex items-center justify-between text-xs font-bold text-amber-900 dark:text-amber-200"
                >
                  <span className="flex items-center gap-1.5">
                    <Icon name="file-text" size={14} /> Notas Livres ({freeNotes.length})
                  </span>
                  <Icon name={minimizedSections.notes ? 'chevron-down' : 'chevron-up'} size={15} />
                </button>

    // =========================================================================
    // APLICAÇÃO PRINCIPAL (MEGA BRAIN V9)
    // =========================================================================
    function MegaBrainApp() {
      const [roomCode, setRoomCode] = useState(() => localStorage.getItem('mega_brain_sync_room') || generateRoomCode());
      const [roomInput, setRoomInput] = useState(roomCode);
      const [syncStatus, setSyncStatus] = useState('Sincronizado');
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const lastPushRef = useRef(0);
      const lastPulledAtRef = useRef(0);

      const [state, setState] = useState(() => {
        try {
          const saved =
            localStorage.getItem('mega_brain_v9_state') ||
            localStorage.getItem('mega_brain_v8_state') ||
            localStorage.getItem('mega_brain_v7_state') ||
            localStorage.getItem('mega_brain_v6_state') ||
            localStorage.getItem('mega_brain_v4_state');
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              folders: parsed.folders || INITIAL_FOLDERS,
              items: parsed.items || INITIAL_ITEMS,
              history: parsed.history || [],
              privatePin: parsed.privatePin || null,
              preferences: {
                theme: parsed.preferences?.theme || 'light',
                viewMode: parsed.preferences?.viewMode || 'cards',
                tagOrder: parsed.preferences?.tagOrder || []
              },
              stats: parsed.stats || { completedCount: 0, studiesCount: 0 }
            };
          }
        } catch (e) {}
        return {
          folders: INITIAL_FOLDERS,
          items: INITIAL_ITEMS,
          history: [],
          privatePin: null,
          preferences: { theme: 'light', viewMode: 'cards', tagOrder: [] },
          stats: { completedCount: 0, studiesCount: 0 }
        };
      });

      const [activeTab, setActiveTab] = useState('home');
      const [isPrivateMode, setIsPrivateMode] = useState(false);
      const [isPrivateUnlocked, setIsPrivateUnlocked] = useState(false);
      const [pinModalOpen, setPinModalOpen] = useState(false);
      const [pendingVaultAction, setPendingVaultAction] = useState(null);

      const [cancelRecurrenceTarget, setCancelRecurrenceTarget] = useState(null);
      const [detailItem, setDetailItem] = useState(null);
      const [defaultDateStr, setDefaultDateStr] = useState('');

      const [selectedFolderId, setSelectedFolderId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTagFilter, setActiveTagFilter] = useState(null);
      const [modalOpen, setModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [tourOpen, setTourOpen] = useState(false);
      const [wednesdayOpen, setWednesdayOpen] = useState(false);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 2600);
      };

      useEffect(() => {
        localStorage.setItem('mega_brain_sync_room', roomCode);
      }, [roomCode]);

      const syncToCloud = useCallback(async (newState) => {
        if (!roomCode) return;
        setSyncStatus('Enviando...');
        const now = Date.now();
        lastPushRef.current = now;
        const ok = await pushCloudState(roomCode, newState);
        if (ok) {
          setSyncStatus('Sincronizado');
          setLastSyncTime(new Date().toLocaleTimeString());
        } else {
          setSyncStatus('Local salvo');
        }
      }, [roomCode]);

      const commitState = useCallback((updaterFn) => {
        setState((prev) => {
          const next = typeof updaterFn === 'function' ? updaterFn(prev) : updaterFn;
          try {
            localStorage.setItem('mega_brain_v9_state', JSON.stringify(next));
          } catch (e) {}
          syncToCloud(next);
          return next;
        });
      }, [syncToCloud]);

      const pullFromCloud = useCallback(async () => {
        if (!roomCode) return;
        const remote = await pullCloudState(roomCode);
        if (remote && remote.data && remote.updatedAt > lastPulledAtRef.current) {
          if (remote.deviceId !== getDeviceId() && remote.updatedAt > lastPushRef.current) {
            lastPulledAtRef.current = remote.updatedAt;
            setState(remote.data);
            try {
              localStorage.setItem('mega_brain_v9_state', JSON.stringify(remote.data));
            } catch (e) {}
            setSyncStatus('Atualizado em tempo real');
            setLastSyncTime(new Date().toLocaleTimeString());
          }
        }
      }, [roomCode]);

      useEffect(() => {
        pullFromCloud();
        const interval = setInterval(pullFromCloud, 3000);
        const onVis = () => {
          if (document.visibilityState === 'visible') pullFromCloud();
        };
        document.addEventListener('visibilitychange', onVis);
        window.addEventListener('focus', pullFromCloud);
        return () => {
          clearInterval(interval);
          document.removeEventListener('visibilitychange', onVis);
          window.removeEventListener('focus', pullFromCloud);
        };
      }, [pullFromCloud]);

      useEffect(() => {
        const handleMove = (e) => {
          const { itemId, folderId } = e.detail;
          commitState((prev) => ({
            ...prev,
            items: prev.items.map((it) => (it.id === itemId ? { ...it, folderId } : it))
          }));
          showToast('Item movido para a pasta!');
        };
        window.addEventListener('megabrain:move-item', handleMove);
        return () => window.removeEventListener('megabrain:move-item', handleMove);
      }, [commitState]);

      useEffect(() => {
        if (state.preferences.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [state.preferences.theme]);

      const getFolderPath = (fId) => {
        if (!fId) return '';
        const f = state.folders.find((x) => x.id === fId);
        return f ? f.name : '';
      };

      const handleSaveItem = (itemData) => {
        commitState((prev) => {
          const exists = prev.items.some((i) => i.id === itemData.id);
          const nextItems = exists
            ? prev.items.map((i) => (i.id === itemData.id ? itemData : i))
            : [itemData, ...prev.items];
          return { ...prev, items: nextItems };
        });
        showToast(itemData.isPrivate ? 'Salvo no Cofre Privado!' : 'Item salvo com sucesso!');
      };

      const applyItemVaultToggle = (item) => {
        const nextPrivate = !Boolean(item.isPrivate);
        commitState((prev) => ({
          ...prev,
          items: prev.items.map((i) => (i.id === item.id ? { ...i, isPrivate: nextPrivate, folderId: null } : i))
        }));
        showToast(nextPrivate ? 'Item movido para o Cofre!' : 'Item removido do Cofre!');
      };

      const handleToggleVault = (item) => {
        if (!state.privatePin) {
          setPendingVaultAction({ type: 'item', payload: item });
          setPinModalOpen(true);
          return;
        }
        applyItemVaultToggle(item);
      };

      const applyFolderVaultToggle = (folder) => {
        const nextPrivate = !Boolean(folder.isPrivate);
        commitState((prev) => {
          const targetIds = new Set([
            folder.id,
            ...prev.folders.filter((f) => f.parentId === folder.id).map((f) => f.id)
          ]);
          return {
            ...prev,
            folders: prev.folders.map((f) =>
              targetIds.has(f.id)
                ? { ...f, isPrivate: nextPrivate, parentId: f.id === folder.id ? null : f.parentId }
                : f
            ),
            items: prev.items.map((it) =>
              it.folderId && targetIds.has(it.folderId) ? { ...it, isPrivate: nextPrivate } : it
            )
          };
        });
        if (selectedFolderId === folder.id) setSelectedFolderId(null);
        showToast(nextPrivate ? 'Pasta movida para o Cofre!' : 'Pasta movida para o ambiente público!');
      };

      const handleToggleFolderVault = (folder) => {
        if (!state.privatePin) {
          setPendingVaultAction({ type: 'folder', payload: folder });
          setPinModalOpen(true);
          return;
        }
        applyFolderVaultToggle(folder);
      };

      const handleRequestCancelItem = (item) => {
        const hasRecurrence = item.recurrence && item.recurrence !== 'none';
        if (hasRecurrence) {
          const todayIso = new Date().toISOString().slice(0, 10);
          setCancelRecurrenceTarget({ item, dateStr: item.reminderDate || todayIso });
          return;
        }
        handleDeleteItem(item.id);
      };

      const handleCancelOnlyThisDate = (itemId, dateStr) => {
        commitState((prev) => ({
          ...prev,
          items: prev.items.map((it) =>
            it.id === itemId
              ? { ...it, canceledDates: [...(it.canceledDates || []), dateStr] }
              : it
          )
        }));
        showToast(`Cancelada apenas a ocorrência de ${dateStr}.`);
      };

      const handleCancelAllOccurrences = (itemId) => {
        commitState((prev) => ({
          ...prev,
          items: prev.items.filter((i) => i.id !== itemId)
        }));
        showToast('Cancelada para todas as ocorrências.');
      };

      const handleDeleteItem = (id) => {
        commitState((prev) => ({ ...prev, items: prev.items.filter((i) => i.id !== id) }));
        showToast('Item excluído.');
      };

      const handleToggleDone = (item) => {
        const willComplete = item.priority !== 'done';
        if (willComplete && item.notificationMode) {
          triggerConfiguredAlert('Tarefa Concluída!', item.title, item.notificationMode);
        }
        commitState((prev) => ({
          ...prev,
          stats: {
            ...prev.stats,
            completedCount: willComplete ? (prev.stats.completedCount || 0) + 1 : prev.stats.completedCount,
            studiesCount: willComplete && ((item.tags || []).includes('estudos') || (item.genreOrTopic || '').toLowerCase().includes('estud'))
              ? (prev.stats.studiesCount || 0) + 1
              : prev.stats.studiesCount,
          },
          history: willComplete
            ? [{ ...item, completedAt: new Date().toISOString() }, ...(prev.history || [])]
            : prev.history,
          items: prev.items.map((i) => (i.id === item.id ? { ...i, priority: willComplete ? 'done' : 'attention' } : i))
        }));
        showToast(willComplete ? 'Concluído e salvo no histórico!' : 'Reaberto!');
      };

      const handleMoveItemOrder = (draggedId, targetId) => {
        if (!draggedId || draggedId === targetId) return;
        commitState((prev) => {
          const list = [...prev.items];
          const fromIdx = list.findIndex((i) => i.id === draggedId);
          const toIdx = list.findIndex((i) => i.id === targetId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          return { ...prev, items: list };
        });
      };

      const handleMoveFolderOrder = (draggedFolderId, targetFolderId) => {
        if (!draggedFolderId || draggedFolderId === targetFolderId) return;
        commitState((prev) => {
          const list = [...prev.folders];
          const fromIdx = list.findIndex((f) => f.id === draggedFolderId);
          const toIdx = list.findIndex((f) => f.id === targetFolderId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          return { ...prev, folders: list };
        });
        showToast('Ordem das pastas atualizada!');
      };

      const handleUpdateBoardPos = useCallback((itemId, pos) => {
        setState((prev) => {
          const next = {
            ...prev,
            items: prev.items.map((it) => (it.id === itemId ? { ...it, boardPos: pos } : it))
          };
          try { localStorage.setItem('mega_brain_v9_state', JSON.stringify(next)); } catch (e) {}
          return next;
        });
      }, []);

      const handleToggleConnection = useCallback((fromId, toId) => {
        commitState((prev) => ({
          ...prev,
          items: prev.items.map((it) => {
            if (it.id !== fromId) return it;
            const conns = Array.isArray(it.boardConnections) ? it.boardConnections : [];
            const exists = conns.includes(toId);
            return {
              ...it,
              boardConnections: exists ? conns.filter((x) => x !== toId) : [...conns, toId]
            };
          })
        }));
        showToast('Conexão do quadro atualizada!');
      }, [commitState]);

      const allTags = useMemo(() => {
        const set = new Set();
        state.items.forEach((it) => {
          if (Boolean(it.isPrivate) === Boolean(isPrivateMode)) {
            (it.tags || []).forEach((t) => set.add(t));
          }
        });
        const arr = Array.from(set);
        const order = state.preferences.tagOrder || [];
        return arr.sort((a, b) => {
          const ia = order.indexOf(a);
          const ib = order.indexOf(b);
          if (ia === -1 && ib === -1) return a.localeCompare(b);
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
      }, [state.items, isPrivateMode, state.preferences.tagOrder]);

      const togglePrivateMode = () => {
        if (!isPrivateMode) {
          if (isPrivateUnlocked || !state.privatePin) {
            setIsPrivateMode(true);
            setSelectedFolderId(null);
            if (!state.privatePin) setPinModalOpen(true);
          } else {
            setPinModalOpen(true);
          }
        } else {
          setIsPrivateMode(false);
          setSelectedFolderId(null);
        }
      };

      const filteredItems = useMemo(() => {
        return state.items.filter((item) => {
          if (Boolean(item.isPrivate) !== Boolean(isPrivateMode)) return false;
          if (isPrivateMode && state.privatePin && !isPrivateUnlocked) return false;
          if (activeTagFilter && !(item.tags || []).includes(activeTagFilter)) return false;
          if (selectedFolderId && item.folderId !== selectedFolderId) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = (item.title || '').toLowerCase().includes(q);
            const matchPersons = (item.assignedPersons || []).some((p) => p.toLowerCase().includes(q));
            const matchTags = (item.tags || []).some((t) => t.toLowerCase().includes(q));
            const matchNotes = (item.freeNotes || []).some((n) => n.toLowerCase().includes(q));
            return matchTitle || matchPersons || matchTags || matchNotes;
          }
          return true;
        });
      }, [state.items, isPrivateMode, isPrivateUnlocked, state.privatePin, activeTagFilter, selectedFolderId, searchQuery]);

      const viewMode = state.preferences.viewMode || 'cards';

      return (
        <div className="min-h-screen flex flex-col w-full overflow-x-hidden">
          {toastMsg && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 px-4 py-2 rounded-full text-xs font-semibold shadow-xl">
              {toastMsg}
            </div>
          )}

          {/* HEADER SUPERIOR RESPONSIVO */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md border-b border-slate-200/80 dark:border-zinc-800 w-full">
            <div className="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex flex-wrap items-center justify-between gap-2.5">

                      showToast('Pasta atualizada!');

                        folders: prev.folders.filter((f) => f.id !== id && f.parentId !== id)

                          onDrop={(e) => {
                            e.preventDefault();
                            const data = e.dataTransfer.getData('text/plain');
                            if (data && data.startsWith('tag:')) {
                              const draggedTag = data.split(':')[1];
                              if (draggedTag !== tag) {
                                const current = [...allTags];
                                const fi = current.indexOf(draggedTag);
                                const ti = current.indexOf(tag);
                                current.splice(fi, 1);
                                current.splice(ti, 0, draggedTag);
                                commitState((prev) => ({

                                  preferences: { ...prev.preferences, tagOrder: current }
                                }));
                              }
                            }
