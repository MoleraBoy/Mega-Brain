    // =========================================================================
    // APLICAÇÃO PRINCIPAL (MEGA BRAIN V9)
    // =========================================================================
    function MegaBrainApp() {
      const brandAudioRef = useRef(null);
      const [isPlayingBrandAudio, setIsPlayingBrandAudio] = useState(false);

      useEffect(() => {
        return () => {
          if (brandAudioRef.current) {
            brandAudioRef.current.pause();
            brandAudioRef.current = null;
          }
        };
      }, []);

      const handleBrandLogoClick = (e) => {
        e.stopPropagation();
        setActiveTab('home');
        try {
          if (!brandAudioRef.current) {
            brandAudioRef.current = new Audio('./Mega%20Brain.mp3');
            brandAudioRef.current.onended = () => setIsPlayingBrandAudio(false);
            brandAudioRef.current.onpause = () => {
              if (brandAudioRef.current && brandAudioRef.current.ended) {
                setIsPlayingBrandAudio(false);
              }
            };
          }
          brandAudioRef.current.currentTime = 0;
          const playPromise = brandAudioRef.current.play();
          setIsPlayingBrandAudio(true);
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {
              const fallbackAudio = new Audio('Mega Brain.mp3');
              fallbackAudio.onended = () => setIsPlayingBrandAudio(false);
              brandAudioRef.current = fallbackAudio;
              fallbackAudio.play().catch(() => setIsPlayingBrandAudio(false));
            });
          }
        } catch (err) {
          setIsPlayingBrandAudio(false);
        }
      };

      const [roomCode, setRoomCode] = useState(() => localStorage.getItem('mega_brain_sync_room') || generateRoomCode());
      const [roomInput, setRoomInput] = useState(roomCode);
      const [syncStatus, setSyncStatus] = useState('Sincronizado');
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const lastPushRef = useRef(0);
      const lastPulledAtRef = useRef(0);

      const [state, setState] = useState(() => {
        try {
          const saved =
            localStorage.getItem('mega_brain_v9_state') ||
            localStorage.getItem('mega_brain_v8_state') ||
            localStorage.getItem('mega_brain_v7_state') ||
            localStorage.getItem('mega_brain_v6_state') ||
            localStorage.getItem('mega_brain_v4_state');
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              folders: parsed.folders || INITIAL_FOLDERS,
              items: parsed.items || INITIAL_ITEMS,
              history: parsed.history || [],
              privatePin: parsed.privatePin || null,
              preferences: {
                theme: parsed.preferences?.theme || 'light',
                viewMode: parsed.preferences?.viewMode || 'cards',
                tagOrder: parsed.preferences?.tagOrder || []
              },
              stats: parsed.stats || { completedCount: 0, studiesCount: 0 }
            };
          }
        } catch (e) {}
        return {
          folders: INITIAL_FOLDERS,
          items: INITIAL_ITEMS,
          history: [],
          privatePin: null,
          preferences: { theme: 'light', viewMode: 'cards', tagOrder: [] },
          stats: { completedCount: 0, studiesCount: 0 }
        };
      });

      const [activeTab, setActiveTab] = useState('home');
      const [isPrivateMode, setIsPrivateMode] = useState(false);
      const [isPrivateUnlocked, setIsPrivateUnlocked] = useState(false);
      const [pinModalOpen, setPinModalOpen] = useState(false);
      const [pendingVaultAction, setPendingVaultAction] = useState(null);

      const [cancelRecurrenceTarget, setCancelRecurrenceTarget] = useState(null);
      const [detailItem, setDetailItem] = useState(null);
      const [defaultDateStr, setDefaultDateStr] = useState('');

      const [selectedFolderId, setSelectedFolderId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTagFilter, setActiveTagFilter] = useState(null);
      const [modalOpen, setModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [tourOpen, setTourOpen] = useState(false);
      const [wednesdayOpen, setWednesdayOpen] = useState(false);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      // Agendador automático de lembretes/alarmes (verifica a cada 5s e ao desbloquear a tela)
      useEffect(() => {
        const checkScheduledTasks = () => {
          const now = new Date();
          const todayIso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
          const nowMinutes = now.getHours() * 60 + now.getMinutes();

          let firedList = [];
          try {
            firedList = JSON.parse(localStorage.getItem('mega_brain_fired_alarms') || '[]');
          } catch (e) {}
          const firedSet = new Set(firedList);
          let updated = false;

          state.items.forEach((item) => {
            if (item.priority === 'done' || item.archivedToHistory) return;
            if (!item.notificationMode || item.notificationMode === 'none') return;
            if (!item.reminderTime) return;
            if (!doesItemOccurOnDate(item, todayIso)) return;

            const [remH, remM] = item.reminderTime.split(':').map(Number);
            if (isNaN(remH) || isNaN(remM)) return;
            const remMinutes = remH * 60 + remM;
            const diff = nowMinutes - remMinutes;
            const alarmKey = `${item.id}_${todayIso}_${item.reminderTime}`;

            if (diff >= 0 && diff <= 15 && !firedSet.has(alarmKey)) {
              firedSet.add(alarmKey);
              updated = true;
              triggerConfiguredAlert(
                `⏰ Lembrete: ${item.title}`,
                item.freeNotes?.[0] || `Agendado para ${item.reminderTime}`,
                item.notificationMode,
                alarmKey
              );
              showToast(`⏰ Alarme: ${item.title}`);
            }
          });

          if (updated) {
            try {
              localStorage.setItem('mega_brain_fired_alarms', JSON.stringify(Array.from(firedSet).slice(-300)));
            } catch (e) {}
          }
        };

        try {
          const initialFired = JSON.parse(localStorage.getItem('mega_brain_fired_alarms') || '[]');
          scheduleBackgroundPushAndSW(state.items, initialFired);
        } catch (e) {}

        const onSwMessage = (event) => {
          if (event.data && event.data.type === 'ALARM_FIRED_FROM_SW') {
            const { item, alarmKey } = event.data.payload || {};
            if (item) {
              const wantSound = ['sound_only', 'popup_sound', 'vibrate_sound', 'all'].includes(item.notificationMode);
              if (wantSound) playAlarmTone();
              showToast(`⏰ Alarme: ${item.title}`);
              if (alarmKey) {
                try {
                  const list = JSON.parse(localStorage.getItem('mega_brain_fired_alarms') || '[]');
                  if (!list.includes(alarmKey)) {
                    list.push(alarmKey);
                    localStorage.setItem('mega_brain_fired_alarms', JSON.stringify(list.slice(-300)));
                  }
                } catch (e) {}
              }
            }
          }
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', onSwMessage);
        }

        checkScheduledTasks();
        const timer = setInterval(checkScheduledTasks, 5000);
        document.addEventListener('visibilitychange', checkScheduledTasks);
        window.addEventListener('focus', checkScheduledTasks);

        return () => {
          clearInterval(timer);
          document.removeEventListener('visibilitychange', checkScheduledTasks);
          window.removeEventListener('focus', checkScheduledTasks);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.removeEventListener('message', onSwMessage);
          }
        };
      }, [state.items]);

      const handleCreateTestAlarmTask = (mode = 'all') => {
        unlockMobileAudioAndPermissions();
        const target = new Date(Date.now() + 60 * 1000);
        const dateIso = `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, '0')}-${String(target.getDate()).padStart(2, '0')}`;
        const timeHHMM = `${String(target.getHours()).padStart(2, '0')}:${String(target.getMinutes()).padStart(2, '0')}`;

        const testTask = {
          id: `test-alarm-${Date.now()}`,
          kind: 'note',
          title: `🔔 Teste de Alarme (${timeHHMM})`,
          images: [],
          audios: [],
          freeNotes: ['Tarefa criada automaticamente para testar Popup, Som e Vibração em 1 minuto.'],
          genreOrTopic: 'Teste de Sistema',
          tags: ['teste', 'alarme'],
          folderId: null,
          priority: 'urgent',
          notificationMode: mode,
          watchLater: false,
          reminderDate: dateIso,
          reminderTime: timeHHMM,
          dueDate: dateIso,
          recurrence: 'none',
          canceledDates: [],
          isPrivate: false,
          assignedPersons: [],
          seenConfirmed: false,
          archivedToHistory: false,
          createdAt: new Date().toISOString(),
          order: 0,
          boardPos: { x: 80, y: 80 },
          boardConnections: [],
        };

        commitState((prev) => ({
          ...prev,
          items: [testTask, ...prev.items],
        }));

        showToast(`Tarefa de teste criada! O alarme tocará às ${timeHHMM} (em 1 min).`);
      };

      useEffect(() => {
        localStorage.setItem('mega_brain_sync_room', roomCode);
      }, [roomCode]);

      const syncToCloud = useCallback(async (newState) => {
        if (!roomCode) return;
        setSyncStatus('Enviando...');
        const now = Date.now();
        lastPushRef.current = now;
        const ok = await pushCloudState(roomCode, newState);
        if (ok) {
          setSyncStatus('Sincronizado');
          setLastSyncTime(new Date().toLocaleTimeString());
        } else {
          setSyncStatus('Local salvo');
        }
      }, [roomCode]);

      const commitState = useCallback((updaterFn) => {
        setState((prev) => {
          const next = typeof updaterFn === 'function' ? updaterFn(prev) : updaterFn;
          try {
            localStorage.setItem('mega_brain_v9_state', JSON.stringify(next));
          } catch (e) {}
          syncToCloud(next);
          return next;
        });
      }, [syncToCloud]);

      const pullFromCloud = useCallback(async () => {
        if (!roomCode) return;
        const remote = await pullCloudState(roomCode);
        if (remote && remote.data && remote.updatedAt > lastPulledAtRef.current) {
          if (remote.deviceId !== getDeviceId() && remote.updatedAt > lastPushRef.current) {
            lastPulledAtRef.current = remote.updatedAt;
            setState(remote.data);
            try {
              localStorage.setItem('mega_brain_v9_state', JSON.stringify(remote.data));
            } catch (e) {}
            setSyncStatus('Atualizado em tempo real');
            setLastSyncTime(new Date().toLocaleTimeString());
          }
        }
      }, [roomCode]);

      useEffect(() => {
        pullFromCloud();
        const interval = setInterval(pullFromCloud, 3000);
        const onVis = () => {
          if (document.visibilityState === 'visible') pullFromCloud();
        };
        document.addEventListener('visibilitychange', onVis);
        window.addEventListener('focus', pullFromCloud);
        return () => {
          clearInterval(interval);
          document.removeEventListener('visibilitychange', onVis);
          window.removeEventListener('focus', pullFromCloud);
        };
      }, [pullFromCloud]);

      useEffect(() => {
        const handleMove = (e) => {
          const { itemId, folderId } = e.detail;
          commitState((prev) => ({
            ...prev,
            items: prev.items.map((it) => (it.id === itemId ? { ...it, folderId } : it))
          }));
          showToast('Item movido para a pasta!');
        };
        window.addEventListener('megabrain:move-item', handleMove);
        return () => window.removeEventListener('megabrain:move-item', handleMove);
      }, [commitState]);

      useEffect(() => {
        if (state.preferences.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [state.preferences.theme]);

      const getFolderPath = (fId) => {
        if (!fId) return '';
        const f = state.folders.find((x) => x.id === fId);
        return f ? f.name : '';
      };

      const handleSaveItem = (itemData) => {
        commitState((prev) => {
          const exists = prev.items.some((i) => i.id === itemData.id);
          const nextItems = exists
            ? prev.items.map((i) => (i.id === itemData.id ? itemData : i))
            : [itemData, ...prev.items];
          return { ...prev, items: nextItems };
        });
        showToast(itemData.isPrivate ? 'Salvo no Cofre Privado!' : 'Item salvo com sucesso!');
      };

      const applyItemVaultToggle = (item) => {
        const nextPrivate = !Boolean(item.isPrivate);
        commitState((prev) => ({
          ...prev,
          items: prev.items.map((i) => (i.id === item.id ? { ...i, isPrivate: nextPrivate, folderId: null } : i))
        }));
        showToast(nextPrivate ? 'Item movido para o Cofre!' : 'Item removido do Cofre!');
      };

      const handleToggleVault = (item) => {
        if (!state.privatePin) {
          setPendingVaultAction({ type: 'item', payload: item });
          setPinModalOpen(true);
          return;
        }
        applyItemVaultToggle(item);
      };

      const applyFolderVaultToggle = (folder) => {
        const nextPrivate = !Boolean(folder.isPrivate);
        commitState((prev) => {
          const targetIds = new Set([
            folder.id,
            ...prev.folders.filter((f) => f.parentId === folder.id).map((f) => f.id)
          ]);
          return {
            ...prev,
            folders: prev.folders.map((f) =>
              targetIds.has(f.id)
                ? { ...f, isPrivate: nextPrivate, parentId: f.id === folder.id ? null : f.parentId }
                : f
            ),
            items: prev.items.map((it) =>
              it.folderId && targetIds.has(it.folderId) ? { ...it, isPrivate: nextPrivate } : it
            )
          };
        });
        if (selectedFolderId === folder.id) setSelectedFolderId(null);
        showToast(nextPrivate ? 'Pasta movida para o Cofre!' : 'Pasta movida para o ambiente público!');
      };

      const handleToggleFolderVault = (folder) => {
        if (!state.privatePin) {
          setPendingVaultAction({ type: 'folder', payload: folder });
          setPinModalOpen(true);
          return;
        }
        applyFolderVaultToggle(folder);
      };

      const handleRequestCancelItem = (item) => {
        const hasRecurrence = item.recurrence && item.recurrence !== 'none';
        if (hasRecurrence) {
          const todayIso = new Date().toISOString().slice(0, 10);
          setCancelRecurrenceTarget({ item, dateStr: item.reminderDate || todayIso });
          return;
        }
        handleDeleteItem(item.id);
      };

      const handleCancelOnlyThisDate = (itemId, dateStr) => {
        commitState((prev) => ({
          ...prev,
          items: prev.items.map((it) =>
            it.id === itemId
              ? { ...it, canceledDates: [...(it.canceledDates || []), dateStr] }
              : it
          )
        }));
        showToast(`Cancelada apenas a ocorrência de ${dateStr}.`);
      };

      const handleCancelAllOccurrences = (itemId) => {
        commitState((prev) => ({
          ...prev,
          items: prev.items.filter((i) => i.id !== itemId)
        }));
        showToast('Cancelada para todas as ocorrências.');
      };

      const handleDeleteItem = (id) => {
        commitState((prev) => ({ ...prev, items: prev.items.filter((i) => i.id !== id) }));
        showToast('Item excluído.');
      };

      const handleToggleDone = (item) => {
        const willComplete = item.priority !== 'done';
        if (willComplete && item.notificationMode) {
          triggerConfiguredAlert('Tarefa Concluída!', item.title, item.notificationMode);
        }
        commitState((prev) => ({
          ...prev,
          stats: {
            ...prev.stats,
            completedCount: willComplete ? (prev.stats.completedCount || 0) + 1 : prev.stats.completedCount,
            studiesCount: willComplete && ((item.tags || []).includes('estudos') || (item.genreOrTopic || '').toLowerCase().includes('estud'))
              ? (prev.stats.studiesCount || 0) + 1
              : prev.stats.studiesCount,
          },
          history: willComplete
            ? [{ ...item, completedAt: new Date().toISOString() }, ...(prev.history || [])]
            : prev.history,
          items: prev.items.map((i) => (i.id === item.id ? { ...i, priority: willComplete ? 'done' : 'attention' } : i))
        }));
        showToast(willComplete ? 'Concluído e salvo no histórico!' : 'Reaberto!');
      };

      const handleMoveItemOrder = (draggedId, targetId) => {
        if (!draggedId || draggedId === targetId) return;
        commitState((prev) => {
          const list = [...prev.items];
          const fromIdx = list.findIndex((i) => i.id === draggedId);
          const toIdx = list.findIndex((i) => i.id === targetId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          return { ...prev, items: list };
        });
      };

      const handleMoveFolderOrder = (draggedFolderId, targetFolderId) => {
        if (!draggedFolderId || draggedFolderId === targetFolderId) return;
        commitState((prev) => {
          const list = [...prev.folders];
          const fromIdx = list.findIndex((f) => f.id === draggedFolderId);
          const toIdx = list.findIndex((f) => f.id === targetFolderId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          return { ...prev, folders: list };
        });
        showToast('Ordem das pastas atualizada!');
      };

      const handleUpdateBoardPos = useCallback((itemId, pos) => {
        setState((prev) => {
          const next = {
            ...prev,
            items: prev.items.map((it) => (it.id === itemId ? { ...it, boardPos: pos } : it))
          };
          try { localStorage.setItem('mega_brain_v9_state', JSON.stringify(next)); } catch (e) {}
          return next;
        });
      }, []);

      const handleToggleConnection = useCallback((fromId, toId) => {
        commitState((prev) => ({
          ...prev,
          items: prev.items.map((it) => {
            if (it.id !== fromId) return it;
            const conns = Array.isArray(it.boardConnections) ? it.boardConnections : [];
            const exists = conns.includes(toId);
            return {
              ...it,
              boardConnections: exists ? conns.filter((x) => x !== toId) : [...conns, toId]
            };
          })
        }));
        showToast('Conexão do quadro atualizada!');
      }, [commitState]);

      const allTags = useMemo(() => {
        const set = new Set();
        state.items.forEach((it) => {
          if (Boolean(it.isPrivate) === Boolean(isPrivateMode)) {
            (it.tags || []).forEach((t) => set.add(t));
          }
        });
        const arr = Array.from(set);
        const order = state.preferences.tagOrder || [];
        return arr.sort((a, b) => {
          const ia = order.indexOf(a);
          const ib = order.indexOf(b);
          if (ia === -1 && ib === -1) return a.localeCompare(b);
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
      }, [state.items, isPrivateMode, state.preferences.tagOrder]);

      const togglePrivateMode = () => {
        if (!isPrivateMode) {
          if (isPrivateUnlocked || !state.privatePin) {
            setIsPrivateMode(true);
            setSelectedFolderId(null);
            if (!state.privatePin) setPinModalOpen(true);
          } else {
            setPinModalOpen(true);
          }
        } else {
          setIsPrivateMode(false);
          setSelectedFolderId(null);
        }
      };

      const filteredItems = useMemo(() => {
        return state.items.filter((item) => {
          if (Boolean(item.isPrivate) !== Boolean(isPrivateMode)) return false;
          if (isPrivateMode && state.privatePin && !isPrivateUnlocked) return false;
          if (activeTagFilter && !(item.tags || []).includes(activeTagFilter)) return false;
          if (selectedFolderId && item.folderId !== selectedFolderId) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = (item.title || '').toLowerCase().includes(q);
            const matchPersons = (item.assignedPersons || []).some((p) => p.toLowerCase().includes(q));
            const matchTags = (item.tags || []).some((t) => t.toLowerCase().includes(q));
            const matchNotes = (item.freeNotes || []).some((n) => n.toLowerCase().includes(q));
            return matchTitle || matchPersons || matchTags || matchNotes;
          }
          return true;
        });
      }, [state.items, isPrivateMode, isPrivateUnlocked, state.privatePin, activeTagFilter, selectedFolderId, searchQuery]);

      const viewMode = state.preferences.viewMode || 'cards';

      return (
        <div className="min-h-screen flex flex-col w-full overflow-x-hidden">
          {toastMsg && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 px-4 py-2 rounded-full text-xs font-semibold shadow-xl">
              {toastMsg}
            </div>
          )}

          {/* HEADER SUPERIOR RESPONSIVO */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md border-b border-slate-200/80 dark:border-zinc-800 w-full">
            <div className="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex flex-wrap items-center justify-between gap-2.5">

                className="flex items-center gap-2 cursor-pointer select-none group"
                onClick={handleBrandLogoClick}

                        ...prev,
                        folders: prev.folders.filter((f) => f.id !== id && f.parentId !== id)
                      }));
                      showToast('Pasta removida.');
                    }}
                    onAddFolderTask={(fId) => {
                      setSelectedFolderId(fId);
                      setEditingItem(null);
                      setDefaultDateStr('');
                      setModalOpen(true);
                    }}
                    onMoveFolderOrder={handleMoveFolderOrder}
                    onToggleFolderVault={handleToggleFolderVault}
                    onOpenItemDetail={(it) => setDetailItem(it)}
                    isPrivateMode={isPrivateMode}
                  />

                  <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-3.5 shadow-material">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-2">
                      Tags (Clique para Filtrar / Arraste)
                    </span>
                    <div className="flex flex-wrap gap-1.5">
                      {allTags.map((tag) => (
                        <button
                          key={tag}
                          draggable
                          onDragStart={(e) => e.dataTransfer.setData('text/plain', `tag:${tag}`)}
                          onDragOver={(e) => e.preventDefault()}
                          onDrop={(e) => {
                            e.preventDefault();
                            const data = e.dataTransfer.getData('text/plain');
                            if (data && data.startsWith('tag:')) {
                              const draggedTag = data.split(':')[1];
                              if (draggedTag !== tag) {
                                const current = [...allTags];
                                const fi = current.indexOf(draggedTag);
                                const ti = current.indexOf(tag);
                                current.splice(fi, 1);
                                current.splice(ti, 0, draggedTag);
                                commitState((prev) => ({
                                  ...prev,
                                  preferences: { ...prev.preferences, tagOrder: current }
                                }));
                              }
                            }
                          }}
                          onClick={() => setActiveTagFilter(activeTagFilter === tag ? null : tag)}
                          className={`text-xs px-2.5 py-1 rounded-lg font-medium transition ${
                            activeTagFilter === tag
                              ? 'bg-indigo-600 text-white'
                              : 'bg-slate-100 dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50'
                          }`}
                        >
                          #{tag}
                        </button>
                      ))}
                    </div>
                  </div>

                  <StopwatchAndTimerWidget onNotify={triggerConfiguredAlert} />
                </aside>

                <section className="lg:col-span-9 space-y-4 min-w-0">
                  <div
                    className={
                      viewMode === 'list'
                        ? 'space-y-2.5'
                        : viewMode === 'thumb'
                        ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3'
                        : 'grid grid-cols-1 md:grid-cols-2 gap-4'
                    }
                  >
                    {filteredItems.map((item) => (
                      <BrainItemCard
                        key={item.id}
                        item={item}
                        folderPath={getFolderPath(item.folderId)}
                        viewMode={viewMode}
                        onOpenDetail={(it) => setDetailItem(it)}
                        onToggleDone={handleToggleDone}
                        onRequestCancelItem={handleRequestCancelItem}
                        onToggleVault={handleToggleVault}
                        onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
                        onTagClick={(t) => setActiveTagFilter(t)}
                        draggable={true}
                        onDragStart={(e) => e.dataTransfer.setData('text/plain', `item:${item.id}`)}
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={(e) => {
                          e.preventDefault();
                          const data = e.dataTransfer.getData('text/plain');
                          if (data && data.startsWith('item:')) {
                            handleMoveItemOrder(data.split(':')[1], item.id);
                          }
                        }}
                      />
                    ))}
                  </div>
                </section>
              </div>
            )}

            {activeTab === 'calendar' && (
              <CalendarScheduleView
                items={state.items}
                isPrivateMode={isPrivateMode}
                onCreateForDate={(isoDate) => {
                  setEditingItem(null);
                  setDefaultDateStr(isoDate);
                  setModalOpen(true);
                }}
                onOpenDetail={(it) => setDetailItem(it)}
                onEditItem={(it) => {
                  setEditingItem(it);
                  setModalOpen(true);
                }}
                onRequestCancelItem={handleRequestCancelItem}
              />
            )}

            {activeTab === 'detective' && (
              <DetectiveBoardView
                items={filteredItems}
                onUpdateBoardPos={handleUpdateBoardPos}
                onToggleConnection={handleToggleConnection}
                onOpenDetail={(it) => setDetailItem(it)}
              />
            )}

            {activeTab === 'reports' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-400 font-semibold">Itens Salvos Ativos</span>
                    <p className="text-3xl font-bold mt-1">{state.items.length}</p>
                  </div>
                  <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-400 font-semibold">Tarefas Concluídas</span>
                    <p className="text-3xl font-bold mt-1 text-emerald-600">{state.stats?.completedCount || 0}</p>
                  </div>
                  <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-400 font-semibold">Estudos Realizados</span>
                    <p className="text-3xl font-bold mt-1 text-indigo-600">{state.stats?.studiesCount || 0}</p>
                  </div>
                </div>

                <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                  <h3 className="text-base font-bold mb-3">Histórico de Atividades Concluídas</h3>
                  {(state.history || []).length === 0 ? (
                    <p className="text-xs text-slate-400">Nenhuma atividade registrada no histórico ainda.</p>
                  ) : (
                    <div className="space-y-2">
                      {state.history.map((h, i) => (
                        <div key={i} className="p-3 rounded-xl bg-slate-50 dark:bg-zinc-950 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-semibold">{h.title}</span>
                            <span className="text-slate-400 ml-2">{new Date(h.completedAt).toLocaleString()}</span>
                          </div>
                          <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-semibold">
                            Concluído
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="max-w-xl mx-auto bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 space-y-6 shadow-material">
                <div className="pb-5 border-b border-slate-100 dark:border-zinc-800">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <Icon name="refresh-cw" size={18} className="text-indigo-500" />
                    Sincronização Global em Tempo Real (PC ↔ Celular)
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    Use o mesmo <strong>Código da Sala</strong> no PC e no celular para ver todas as alterações instantaneamente.
                  </p>
                  <div className="mt-3 flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={roomInput}
                      onChange={(e) => setRoomInput(e.target.value)}
                      placeholder="Ex: mb-meu-cerebro"
                      className="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-sm font-mono"
                    />
                    <button
                      onClick={() => {
                        const clean = roomInput.trim();
                        if (clean) {
                          setRoomCode(clean);
                          lastPulledAtRef.current = 0;
                          pullFromCloud();
                          syncToCloud(state);
                          showToast('Sala conectada e sincronizada!');
                        }
                      }}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                    >
                      Conectar & Sincronizar
                    </button>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-2 flex items-center justify-between">
                    <span>Status: <strong>{syncStatus}</strong></span>
                    {lastSyncTime && <span>Última sync: {lastSyncTime}</span>}
                  </div>
                </div>

                <div className="pb-5 border-b border-slate-100 dark:border-zinc-800">
                  <h3 className="text-sm font-bold mb-1 flex items-center gap-1.5">
                    <Icon name="bell-ring" size={16} className="text-indigo-500" />
                    Testar Notificações, Som & Vibração
                  </h3>
                  <p className="text-xs text-slate-500 mb-3">
                    Cria uma tarefa agendada para <strong>1 minuto</strong> a partir de agora. Bloqueie a tela ou abra outro app para testar o alerta.
                  </p>
                  <div className="flex flex-wrap gap-2">
                    <button
                      type="button"
                      onClick={() => handleCreateTestAlarmTask('all')}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="alarm-clock" size={15} /> Criar Tarefa Teste (1 min • Popup + Som + Vibração)
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        unlockMobileAudioAndPermissions();
                        triggerConfiguredAlert('🔔 Teste Imediato Mega Brain', 'Som, popup e vibração funcionando!', 'all');
                      }}
                      className="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold"
                    >
                      Disparar Agora
                    </button>
                  </div>
                </div>

                <div className="pb-5 border-b border-slate-100 dark:border-zinc-800">
                  <h3 className="text-sm font-bold mb-2">PIN do Cofre Privado</h3>
                  <button
                    onClick={() => setPinModalOpen(true)}
                    className="px-4 py-2 rounded-xl bg-amber-600 text-white text-xs font-semibold"
                  >
                    {state.privatePin ? 'Alterar / Desbloquear PIN' : 'Configurar PIN do Cofre'}
                  </button>
                </div>

                <div>
                  <h3 className="text-sm font-bold mb-1">Backup & Restauração (Exportar / Importar JSON)</h3>
                  <p className="text-xs text-slate-500 mb-3">
                    Salve seus dados antes de subir novos arquivos para o GitHub/Netlify e importe quando quiser.
                  </p>
                  <div className="flex gap-3 flex-wrap">
                    <button
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
                        const dlAnchorElem = document.createElement('a');
                        dlAnchorElem.setAttribute("href", dataStr);
                        dlAnchorElem.setAttribute("download", `megabrain_backup_${new Date().toISOString().slice(0, 10)}.json`);
                        dlAnchorElem.click();
                      }}
                      className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="download" size={16} /> Exportar Backup (JSON)
                    </button>
                    <label className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 dark:hover:bg-zinc-800">
                      <Icon name="upload" size={16} /> Importar Backup
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (evt) => {
                            try {
                              const parsed = JSON.parse(evt.target.result);
                              if (parsed && parsed.items && parsed.folders) {
                                commitState(parsed);
                                showToast('Backup importado com sucesso!');
                              }
                            } catch (err) {
                              alert('Erro ao ler arquivo de backup.');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>
              </div>
            )}
          </main>

          <TaskDetailModal
            item={detailItem}
            folderPath={detailItem ? getFolderPath(detailItem.folderId) : ''}
            onClose={() => setDetailItem(null)}
            onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
            onToggleDone={handleToggleDone}
            onRequestCancel={handleRequestCancelItem}
            onToggleVault={handleToggleVault}
            onChangeNotificationMode={(id, newMode) => {
              commitState((prev) => ({
                ...prev,
                items: prev.items.map((it) => (it.id === id ? { ...it, notificationMode: newMode } : it))
              }));
              setDetailItem((prev) => (prev && prev.id === id ? { ...prev, notificationMode: newMode } : prev));
              showToast('Modo de notificação atualizado!');
            }}
          />

          <ItemFormModal
            isOpen={modalOpen}
            onClose={() => { setModalOpen(false); setEditingItem(null); setDefaultDateStr(''); }}
            onSave={(saved) => {
              handleSaveItem(saved);
              scheduleExternalWakeupPush(roomCode, saved);
            }}
            folders={state.folders}
            existingItems={state.items}
            initialItem={editingItem}
            isPrivateMode={isPrivateMode}
            defaultFolderId={selectedFolderId}
            defaultDateStr={defaultDateStr}
          />

          <PinModal
            isOpen={pinModalOpen}
            onClose={() => { setPinModalOpen(false); setPendingVaultAction(null); }}
            currentPin={state.privatePin}
            onSetPin={(newPin) => commitState((prev) => ({ ...prev, privatePin: newPin }))}
            onUnlock={() => {
              setIsPrivateUnlocked(true);
              if (pendingVaultAction?.type === 'item') {
                applyItemVaultToggle(pendingVaultAction.payload);
              } else if (pendingVaultAction?.type === 'folder') {
                applyFolderVaultToggle(pendingVaultAction.payload);
              } else {
                setIsPrivateMode(true);
              }
              setPendingVaultAction(null);
            }}
          />

          <CancelRecurrenceModal
            isOpen={Boolean(cancelRecurrenceTarget)}
            onClose={() => setCancelRecurrenceTarget(null)}
            item={cancelRecurrenceTarget?.item}
            dateStr={cancelRecurrenceTarget?.dateStr}
            onCancelOnlyThisDate={handleCancelOnlyThisDate}
            onCancelAllOccurrences={handleCancelAllOccurrences}
          />

          <WednesdayReviewModal
            isOpen={wednesdayOpen}
            onClose={() => setWednesdayOpen(false)}
            items={state.items}
            onConfirmSeen={(ids) => {
              commitState((prev) => ({
                ...prev,
                items: prev.items.map((it) => (ids.includes(it.id) ? { ...it, seenConfirmed: true } : it))
              }));
              showToast('Itens marcados como vistos!');
            }}
            onSnoozeItems={(ids, dateStr) => {
              commitState((prev) => ({
                ...prev,
                items: prev.items.map((it) => (ids.includes(it.id) ? { ...it, snoozeUntil: dateStr } : it))
              }));
              showToast(`Adiado para ${dateStr}!`);
            }}
          />

          <TourModal isOpen={tourOpen} onClose={() => setTourOpen(false)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MegaBrainApp />);
  </script>
</body>
</html>
