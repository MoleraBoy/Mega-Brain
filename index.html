    // =========================================================================
    // SINCRONIZAÇÃO EM TEMPO REAL NA NUVEM (SYNC ROOM PC <-> CELULAR)
    // =========================================================================
    const SYNC_BASE = 'https://ntfy.sh';

    function generateRoomCode() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let code = 'mb-';
      for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function getDeviceId() {
      let id = localStorage.getItem('mega_brain_device_id');
      if (!id) {
        id = 'dev-' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('mega_brain_device_id', id);
      }
      return id;
    }

    async function pushCloudState(roomCode, payload) {
      if (!roomCode) return false;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}`, {
          method: 'POST',
          body: JSON.stringify({
            updatedAt: Date.now(),
            deviceId: getDeviceId(),
            data: payload
          }),
          headers: {
            'Title': 'MegaBrainSync',
            'Tags': 'brain'
          }
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function pullCloudState(roomCode) {
      if (!roomCode) return null;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}/json?poll=1&since=all`);
        if (!res.ok) return null;
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const evt = JSON.parse(lines[i]);
            if (evt.event === 'message' && evt.message) {
              const parsed = JSON.parse(evt.message);
              if (parsed && parsed.data && parsed.updatedAt) {
                return parsed;
              }
            }
          } catch (err) {}
        }
      } catch (e) {}
      return null;
    }

    // =========================================================================
    // GERADOR DE THUMBNAIL PARA QUALQUER LINK (COM FALLBACK VISUAL GARANTIDO)
    // =========================================================================
    function buildFallbackThumbDataUrl(rawUrl, titleText) {
      try {
        const parsed = new URL(rawUrl.startsWith('http') ? rawUrl : `https://${rawUrl}`);
        const host = parsed.hostname.replace(/^www\./, '');
        const label = (titleText || host || 'Link').slice(0, 28);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4f46e5"/>
              <stop offset="100%" stop-color="#0ea5e9"/>
            </linearGradient>
          </defs>
          <rect width="800" height="450" fill="url(#g)"/>
          <circle cx="680" cy="90" r="140" fill="rgba(255,255,255,0.08)"/>
          <circle cx="120" cy="390" r="170" fill="rgba(255,255,255,0.06)"/>
          <rect x="48" y="48" width="704" height="354" rx="24" fill="rgba(15,23,42,0.42)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
          <text x="84" y="135" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">${host.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text>
          <text x="84" y="215" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">${label.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text>
          <text x="84" y="340" fill="rgba(255,255,255,0.8)" font-family="Inter, Arial, sans-serif" font-size="20">Thumbnail gerada pelo Mega Brain</text>
        </svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      } catch (e) {
        return null;
      }
    }

    async function fetchAutoThumbnail(url, titleText = '') {
      if (!url || !url.trim()) return null;
      const normalized = url.trim().startsWith('http') ? url.trim() : `https://${url.trim()}`;

      // 1. YouTube direto
      if (normalized.includes('youtube.com') || normalized.includes('youtu.be')) {
        let videoId = '';
        if (normalized.includes('youtu.be/')) videoId = normalized.split('youtu.be/')[1]?.split('?')[0];
        else if (normalized.includes('watch?v=')) videoId = normalized.split('watch?v=')[1]?.split('&')[0];
        else if (normalized.includes('/shorts/')) videoId = normalized.split('/shorts/')[1]?.split('?')[0];
        if (videoId) return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      }

      // 2. Microlink API
      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(normalized)}`);
        const data = await res.json();
        if (data && data.status === 'success' && data.data?.image?.url) {
          return data.data.image.url;
        }
      } catch (e) {}

      // 3. Screenshot / Thum.io fallback público
      try {
        const thumUrl = `https://image.thum.io/get/width/800/crop/450/${encodeURIComponent(normalized)}`;
        return thumUrl;
      } catch (e) {}

      // 4. Fallback local garantido
      return buildFallbackThumbDataUrl(normalized, titleText);
    }

    // =========================================================================
    // NOTIFICAÇÕES CONFIGURÁVEIS (POPUP, SOM, VIBRAÇÃO)
    // =========================================================================
    function triggerConfiguredAlert(title, body, mode = 'popup_only') {
      if (!mode || mode === 'none') return;

      if ((mode === 'vibrate_only' || mode === 'vibrate_sound') && typeof navigator !== 'undefined' && 'vibrate' in navigator) {
        try { navigator.vibrate([300, 150, 300, 150, 450]); } catch (e) {}
      }

      if (mode === 'vibrate_sound' && typeof window !== 'undefined') {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.65);
        } catch (e) {}
      }

      if ((mode === 'popup_only' || mode === 'vibrate_sound') && typeof window !== 'undefined' && 'Notification' in window) {
        if (Notification.permission === 'granted') {
          new Notification(title, { body });
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then((p) => {
            if (p === 'granted') new Notification(title, { body });
          });
        }
      }
    }

                  type="date"
                  value={customDate}
                  onChange={(e) => setCustomDate(e.target.value)}
                  className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
                />
                <button
                  onClick={() => {
                    if (!customDate) return;
                    onSnoozeItems(unseenLaterItems.map((i) => i.id), customDate);
                    onClose();
                  }}
                  className="px-3 py-1 rounded-lg bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-semibold"
                >
                  Agendar
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // ÁRVORE DE PASTAS: MINIMIZAR/MAXIMIZAR, ARRASTAR/SOLTAR E MOVER PARA COFRE
    // =========================================================================
    const FolderTreeSidebar = ({
      folders,
      selectedFolderId,
      onSelectFolder,
      onCreateFolder,
      onEditFolder,
      onDeleteFolder,
      onAddFolderTask,
      onMoveFolderOrder,
      onToggleFolderVault,
      isPrivateMode
    }) => {
      const [contextMenu, setContextMenu] = useState(null);
      const [editingFolderId, setEditingFolderId] = useState(null);
      const [editName, setEditName] = useState('');
      const [creatingParentId, setCreatingParentId] = useState(null);
      const [newFolderName, setNewFolderName] = useState('');
      const [collapsedMap, setCollapsedMap] = useState({});
      const [dragOverFolderId, setDragOverFolderId] = useState(null);
      const [draggedFolderId, setDraggedFolderId] = useState(null);
      const longPressTimer = useRef(null);

      const scopedFolders = folders.filter((f) => Boolean(f.isPrivate) === Boolean(isPrivateMode));

      const toggleCollapse = (folderId, e) => {
        if (e) e.stopPropagation();
        setCollapsedMap((prev) => ({ ...prev, [folderId]: !prev[folderId] }));
      };

      const handleTouchStart = (folder, e) => {
        longPressTimer.current = setTimeout(() => {
          const touch = e.touches[0];
          setDraggedFolderId(folder.id);
          setContextMenu({ folder, x: touch.clientX, y: touch.clientY });
        }, 550);
      };

      const handleTouchEnd = () => {
        if (longPressTimer.current) clearTimeout(longPressTimer.current);
      };

      const renderBranch = (parentId = null, depth = 0) => {
        const children = scopedFolders.filter((f) => (f.parentId || null) === parentId);
        return (
          <div className={depth > 0 ? 'ml-3 pl-2 border-l border-slate-200 dark:border-zinc-800 space-y-1 mt-1' : 'space-y-1'}>
            {children.map((folder) => {
              const hasSubfolders = scopedFolders.some((f) => f.parentId === folder.id);
              const isCollapsed = Boolean(collapsedMap[folder.id]);
              const isSelected = selectedFolderId === folder.id;
              const isEditing = editingFolderId === folder.id;
              const isDragTarget = dragOverFolderId === folder.id;

              return (
                <div key={folder.id} className="relative">
                  {isEditing ? (
                    <div className="flex gap-1 py-1">
                      <input
                        autoFocus
                        type="text"
                        value={editName}
                        onChange={(e) => setEditName(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            onEditFolder(folder.id, editName);
                            setEditingFolderId(null);
                          }
                        }}
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-500 bg-white dark:bg-zinc-900"
                      />
                      <button
                        onClick={() => {
                          onEditFolder(folder.id, editName);
                          setEditingFolderId(null);
                        }}
                        className="px-2 py-1 bg-indigo-600 text-white text-xs rounded"
                      >
                        OK
                      </button>
                    </div>
                  ) : (
                    <div
                      draggable
                      onDragStart={(e) => {
                        setDraggedFolderId(folder.id);
                        e.dataTransfer.setData('text/plain', `folder:${folder.id}`);
                      }}
                      onDragEnter={(e) => {
                        e.preventDefault();
                        setDragOverFolderId(folder.id);
                      }}
                      onDragOver={(e) => {
                        e.preventDefault();
                        if (dragOverFolderId !== folder.id) setDragOverFolderId(folder.id);
                      }}
                      onDragLeave={() => {
                        if (dragOverFolderId === folder.id) setDragOverFolderId(null);
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        setDragOverFolderId(null);
                        const data = e.dataTransfer.getData('text/plain') || (draggedFolderId ? `folder:${draggedFolderId}` : '');
                        setDraggedFolderId(null);
                        if (!data) return;
                        if (data.startsWith('item:')) {
                          const itemId = data.split(':')[1];
                          window.dispatchEvent(new CustomEvent('megabrain:move-item', { detail: { itemId, folderId: folder.id } }));
                        } else if (data.startsWith('folder:')) {
                          const fromFolderId = data.split(':')[1];
                          if (fromFolderId && fromFolderId !== folder.id && onMoveFolderOrder) {
                            onMoveFolderOrder(fromFolderId, folder.id);
                          }
                        }
                      }}
                      onTouchStart={(e) => handleTouchStart(folder, e)}
                      onTouchEnd={handleTouchEnd}
                      onClick={() => onSelectFolder(folder.id)}
                      onContextMenu={(e) => {
                        e.preventDefault();
                        setContextMenu({ folder, x: e.clientX, y: e.clientY });
                      }}
                      className={`group flex items-center justify-between px-2 py-1.5 rounded-lg text-sm cursor-pointer transition select-none ${
                        isDragTarget ? 'drag-over-target' : ''
                      } ${
                        isSelected
                          ? 'bg-indigo-600 text-white font-medium shadow-sm'
                          : 'text-slate-700 dark:text-zinc-300 hover:bg-slate-200/70 dark:hover:bg-zinc-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 min-w-0">
                        <button
                          type="button"
                          onClick={(e) => toggleCollapse(folder.id, e)}
                          title={isCollapsed ? 'Maximizar pasta' : 'Minimizar pasta'}
                          className={`p-0.5 rounded hover:bg-black/10 dark:hover:bg-white/10 ${
                            isSelected ? 'text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name={isCollapsed ? 'chevron-right' : 'chevron-down'} size={14} />
                        </button>
                        <Icon
                          name={folder.isPrivate ? 'lock' : isCollapsed ? 'folder' : hasSubfolders ? 'folder-open' : 'folder'}
                          size={15}
                          className={isSelected ? 'text-white' : 'text-indigo-500'}
                        />
                        <span className="truncate">{folder.name}</span>
                      </div>

                      <div className="flex items-center gap-0.5 shrink-0">
                        <button
                          type="button"
                          onClick={(e) => toggleCollapse(folder.id, e)}
                          title={isCollapsed ? 'Maximizar' : 'Minimizar'}
                          className={`p-1 rounded text-[11px] opacity-70 group-hover:opacity-100 ${
                            isSelected ? 'text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name={isCollapsed ? 'maximize-2' : 'minimize-2'} size={12} />
                        </button>
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            const rect = e.currentTarget.getBoundingClientRect();
                            setContextMenu({ folder, x: rect.left, y: rect.bottom + 5 });
                          }}
                          className={`p-1 rounded opacity-80 group-hover:opacity-100 ${isSelected ? 'text-white' : 'text-slate-500'}`}
                        >
                          <Icon name="more-vertical" size={14} />
                        </button>
                      </div>
                    </div>
                  )}

                  {creatingParentId === folder.id && (
                    <div className="mt-1 ml-4 flex gap-1">
                      <input
                        autoFocus
                        type="text"
                        value={newFolderName}
                        onChange={(e) => setNewFolderName(e.target.value)}
                        placeholder="Nome da subpasta..."
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-400 bg-white dark:bg-zinc-900"
                      />
                      <button
                        onClick={() => {
                          if (newFolderName.trim()) {
                            onCreateFolder(newFolderName.trim(), folder.id, isPrivateMode);
                            setNewFolderName('');
                            setCreatingParentId(null);
                            setCollapsedMap((prev) => ({ ...prev, [folder.id]: false }));
                          }
                        }}
                        className="px-2 py-1 bg-indigo-600 text-white text-xs rounded"
                      >
                        Criar
                      </button>
                    </div>
                  )}

                  {!isCollapsed && renderBranch(folder.id, depth + 1)}
                </div>
              );
            })}
          </div>
        );
      };

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-3.5 shadow-material">
          <div className="flex items-center justify-between mb-2.5">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
              {isPrivateMode ? 'Pastas do Cofre 🔒' : 'Pastas & Subpastas'}
            </span>
            <button
              onClick={() => {
                const name = prompt('Nome da nova pasta raiz:');
                if (name) onCreateFolder(name, null, isPrivateMode);
              }}
              className="text-xs flex items-center gap-1 text-indigo-600 dark:text-indigo-400 font-medium"
            >
              <Icon name="plus" size={14} /> Nova
            </button>
          </div>

          <button
            onClick={() => onSelectFolder(null)}
            className={`w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-sm mb-1.5 transition ${
              selectedFolderId === null
                ? 'bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-medium'
                : 'text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800'
            }`}
          >
            <Icon name="layers" size={15} />
            <span>Todas as Pastas</span>
          </button>

          {renderBranch(null, 0)}

          {contextMenu && (
            <div className="fixed inset-0 z-50" onClick={() => setContextMenu(null)}>
              <div
                style={{ top: Math.min(contextMenu.y, window.innerHeight - 280), left: Math.min(contextMenu.x, window.innerWidth - 220) }}
                className="absolute bg-white dark:bg-zinc-900 rounded-xl border border-slate-200 dark:border-zinc-700 shadow-2xl py-1.5 w-56 text-xs z-50"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-3 py-1.5 font-bold text-slate-400 border-b border-slate-100 dark:border-zinc-800 truncate">
                  {contextMenu.folder.name}
                </div>
                <button
                  onClick={() => {
                    toggleCollapse(contextMenu.folder.id);
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name={collapsedMap[contextMenu.folder.id] ? 'maximize-2' : 'minimize-2'} size={14} />
                  {collapsedMap[contextMenu.folder.id] ? 'Maximizar Pasta' : 'Minimizar Pasta'}
                </button>
                <button
                  onClick={() => {
                    setEditingFolderId(contextMenu.folder.id);
                    setEditName(contextMenu.folder.name);
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name="pencil" size={14} /> Editar / Renomear Pasta
                </button>
                <button
                  onClick={() => {
                    setCreatingParentId(contextMenu.folder.id);
                    setNewFolderName('');
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name="folder-plus" size={14} /> Criar Subpasta
                </button>
                <button
                  onClick={() => {
                    onAddFolderTask(contextMenu.folder.id);
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"
                >
                  <Icon name="check-square" size={14} /> Adicionar Tarefa aqui
                </button>
                <button
                  onClick={() => {
                    onToggleFolderVault(contextMenu.folder);
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-amber-50 dark:hover:bg-amber-950/40 text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-2"
                >
                  <Icon name={contextMenu.folder.isPrivate ? 'unlock' : 'lock'} size={14} />
                  {contextMenu.folder.isPrivate ? 'Mover Pasta para Público' : 'Mover Pasta para o Cofre'}
                </button>
                <button
                  onClick={() => {
                    if (confirm(`Deseja excluir a pasta "${contextMenu.folder.name}"?`)) {
                      onDeleteFolder(contextMenu.folder.id);
                    }
                    setContextMenu(null);
                  }}
                  className="w-full text-left px-3 py-2 hover:bg-rose-50 text-rose-600 flex items-center gap-2 border-t border-slate-100 dark:border-zinc-800"
                >
                  <Icon name="trash-2" size={14} /> Excluir Pasta
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // POMODORO TIMER COM NOTIFICAÇÃO CONFIGURÁVEL
    // =========================================================================
    const PomodoroWidget = ({ onNotify }) => {
      const [secondsLeft, setSecondsLeft] = useState(25 * 60);
      const [running, setRunning] = useState(false);
      const [mode, setMode] = useState('focus');
      const [alertMode, setAlertMode] = useState('vibrate_sound');

      useEffect(() => {
        if (!running) return;
        const timer = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              setRunning(false);
              onNotify(
                mode === 'focus' ? '⏰ Pomodoro Concluído!' : '⚡ Pausa Finalizada!',
                mode === 'focus' ? 'Hora da pausa de 5 minutos.' : 'De volta ao foco!',
                alertMode
              );
              return mode === 'focus' ? 5 * 60 : 25 * 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [running, mode, alertMode]);

      const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const secs = String(secondsLeft % 60).padStart(2, '0');

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-4 shadow-material">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <Icon name="timer" size={14} className="text-indigo-500" /> Foco Pomodoro
            </span>
            <div className="flex gap-1">
              <button
                onClick={() => { setRunning(false); setMode('focus'); setSecondsLeft(25 * 60); }}
                className={`text-[11px] px-2 py-0.5 rounded-full ${mode === 'focus' ? 'bg-indigo-100 text-indigo-700 font-bold' : 'text-slate-500'}`}
              >25m</button>
              <button
                onClick={() => { setRunning(false); setMode('break'); setSecondsLeft(5 * 60); }}
                className={`text-[11px] px-2 py-0.5 rounded-full ${mode === 'break' ? 'bg-emerald-100 text-emerald-700 font-bold' : 'text-slate-500'}`}
              >5m</button>
            </div>
          </div>

          <div className="text-3xl font-bold tracking-tight text-center my-2 font-mono">
            {mins}:{secs}
          </div>

          <div className="mb-2.5">
            <select
              value={alertMode}
              onChange={(e) => setAlertMode(e.target.value)}
              className="w-full text-[11px] px-2 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
            >
              {NOTIF_MODES.map((m) => (
                <option key={m.id} value={m.id} className="dark:bg-zinc-900">Alerta Timer: {m.label}</option>
              ))}
            </select>
          </div>

          <div className="flex gap-2">
            <button
              onClick={() => setRunning(!running)}
              className="flex-1 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-medium flex items-center justify-center gap-1"
            >
              <Icon name={running ? 'pause' : 'play'} size={14} />
              {running ? 'Pausar' : 'Iniciar'}
            </button>
            <button
              onClick={() => { setRunning(false); setSecondsLeft(mode === 'focus' ? 25 * 60 : 5 * 60); }}
              className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
            >
              Resetar
            </button>
          </div>
        </div>
      );
    };

    // =========================================================================
    // CARD DE ITEM (MOSTRA LEMBRETE/RECORRÊNCIA, CANCELAMENTO RECORRENTE, THUMB, ETC.)
    // =========================================================================
    const BrainItemCard = ({
      item,
      folderPath,
      viewMode,
      onToggleDone,
      onRequestCancelItem,
      onToggleVault,
      onEdit,
      onDelete,
      onTagClick,
      draggable,
      onDragStart,
      onDragOver,
      onDrop
    }) => {
      const pMeta = PRIORITY_META[item.priority] || PRIORITY_META.later;
      const itemImages = useMemo(() => {
        const list = [];
        if (item.thumbnail) list.push(item.thumbnail);
        if (Array.isArray(item.images)) {
          item.images.forEach((img) => {
            const src = typeof img === 'string' ? img : img?.src;
            if (src && !list.includes(src)) list.push(src);
          });
        }
        return list;
      }, [item.thumbnail, item.images]);

      const itemAudios = useMemo(() => {
        if (!Array.isArray(item.audios)) return [];
        return item.audios.map((a, idx) =>
          typeof a === 'string'
            ? { id: `aud-${idx}`, name: `Áudio ${idx + 1}`, src: a }
            : { id: a.id || `aud-${idx}`, name: a.name || `Áudio ${idx + 1}`, src: a.src }
        );
      }, [item.audios]);

      const itemNotes = useMemo(() => {
        if (!Array.isArray(item.freeNotes)) return [];
        return item.freeNotes.filter((n) => typeof n === 'string' && n.trim());
      }, [item.freeNotes]);

      const recurrenceLabel =
        item.recurrence === 'daily'
          ? 'Diária'
          : item.recurrence === 'weekly'
          ? 'Semanal'
          : item.recurrence === 'weekends'
          ? 'Fins de Semana'
          : null;

      if (viewMode === 'thumb') {
        const firstThumb = itemImages[0];
        return (
          <div
            draggable={draggable}
            onDragStart={onDragStart}
            onDragOver={onDragOver}
            onDrop={onDrop}
            onClick={() => onEdit(item)}
            className="group relative aspect-square rounded-2xl overflow-hidden bg-slate-200 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-800 cursor-pointer shadow-material"
          >
            {firstThumb ? (
              <img
                src={firstThumb}
                alt={item.title}
                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
              />
            ) : (
              <div className="w-full h-full flex flex-col items-center justify-center p-3 text-center">
                <Icon name={itemAudios.length > 0 ? 'mic' : itemNotes.length > 0 ? 'file-text' : 'bookmark'} size={24} className="text-indigo-500 mb-1" />
                <span className="text-xs font-semibold line-clamp-2">{item.title}</span>
              </div>
            )}
            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 via-black/30 to-transparent p-2.5 text-white">
              <p className="text-xs font-semibold truncate">{item.title}</p>
            </div>
          </div>
        );
      }

      if (viewMode === 'list') {
        return (
          <div
            draggable={draggable}
            onDragStart={onDragStart}
            onDragOver={onDragOver}
            onDrop={onDrop}
            className={`bg-white dark:bg-zinc-900 rounded-xl border border-slate-200/80 dark:border-zinc-800 px-3.5 py-2.5 flex items-center justify-between gap-3 shadow-material ${pMeta.border}`}
          >
            <div className="flex items-center gap-3 min-w-0">
              <button
                onClick={() => onToggleDone(item)}
                className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${
                  item.priority === 'done' ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'
                }`}
              >
                {item.priority === 'done' && <Icon name="check" size={12} />}
              </button>
              <div className="min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-sm font-semibold truncate ${item.priority === 'done' ? 'line-through opacity-60' : ''}`}>
                    {item.title}
                  </span>
                  {folderPath && <span className="text-[11px] text-slate-400">• 📁 {folderPath}</span>}
                  {item.reminderDate && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 font-semibold">
                      📅 {item.reminderDate} {item.reminderTime || ''}
                    </span>
                  )}
                  {recurrenceLabel && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-purple-50 text-purple-700 font-semibold">
                      🔁 {recurrenceLabel}
                    </span>
                  )}
                </div>
                <div className="flex flex-wrap gap-1 mt-1">
                  {(item.tags || []).map((t, idx) => (
                    <button
                      key={idx}
                      onClick={() => onTagClick(t)}
                      className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400"
                    >
                      #{t}
                    </button>
                  ))}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              <button
                onClick={() => onToggleVault(item)}
                title={item.isPrivate ? 'Tirar do Cofre' : 'Colocar no Cofre'}
                className="p-1.5 rounded-lg hover:bg-amber-50 text-amber-600"
              >
                <Icon name={item.isPrivate ? 'unlock' : 'lock'} size={14} />
              </button>
              <button onClick={() => onEdit(item)} className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800 text-slate-500">
                <Icon name="pencil" size={14} />
              </button>
              <button onClick={() => onRequestCancelItem(item)} className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500">
                <Icon name="trash-2" size={14} />
              </button>
            </div>
          </div>
        );
      }

      const hrefUrl = item.url ? (item.url.startsWith('http') ? item.url : `https://${item.url}`) : null;

      return (
        <div
          draggable={draggable}
          onDragStart={onDragStart}
          onDragOver={onDragOver}
          onDrop={onDrop}
          className={`group bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 overflow-hidden shadow-material hover:shadow-material-lg transition-all flex flex-col justify-between ${pMeta.border}`}
        >
          <div>
            {itemImages.length > 0 && (
              <div className="relative h-36 w-full overflow-hidden bg-slate-100 dark:bg-zinc-800">
                <img
                  src={itemImages[0]}
                  alt={item.title}
                  className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div className="absolute top-2.5 left-2.5 flex gap-1.5">
                  <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full border backdrop-blur-md shadow-sm ${pMeta.badge}`}>
                    {pMeta.dot} {pMeta.label.split('/')[0]}
                  </span>
                  {itemImages.length > 1 && (
                    <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-black/65 text-white">
                      +{itemImages.length - 1} foto(s)
                    </span>
                  )}
                </div>
              </div>
            )}

            <div className="p-4">
              {itemImages.length === 0 && (
                <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
                  <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full border ${pMeta.badge}`}>
                    {pMeta.dot} {pMeta.label.split('/')[0]}
                  </span>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {recurrenceLabel && (
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-purple-50 text-purple-700 dark:bg-purple-950 dark:text-purple-300 font-semibold">
                        🔁 {recurrenceLabel}
                      </span>
                    )}
                    {item.watchLater && (
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 font-semibold">
                        Ver Depois
                      </span>
                    )}
                  </div>
                </div>
              )}

              <div className="flex items-center gap-1.5 text-xs text-indigo-600 dark:text-indigo-400 font-medium mb-1 flex-wrap">
                <span>{item.genreOrTopic || 'Geral'}</span>
                {folderPath && <span className="text-slate-400">• 📁 {folderPath}</span>}
                {item.reminderDate && (
                  <span className="text-amber-600 dark:text-amber-400">
                    • 📅 {item.reminderDate} {item.reminderTime || ''}
                  </span>
                )}
              </div>

              <h3 className={`font-semibold text-base leading-snug mb-2 ${item.priority === 'done' ? 'line-through opacity-60' : ''}`}>
                {item.title}
              </h3>

              {(item.whatIsIt || item.whySaved) && (
                <div className="space-y-1 bg-slate-50 dark:bg-zinc-950/70 rounded-xl p-2.5 text-xs mb-2.5">
                  {item.whatIsIt && <p className="text-slate-600 dark:text-zinc-300"><strong>O que é:</strong> {item.whatIsIt}</p>}
                  {item.whySaved && <p className="text-slate-600 dark:text-zinc-300"><strong>Por que salvei:</strong> {item.whySaved}</p>}
                </div>
              )}

              {itemNotes.length > 0 && (
                <div className="space-y-1.5 mb-2.5">
                  <span className="text-[11px] font-semibold text-amber-700 dark:text-amber-300 block">
                    📝 Notas da tarefa ({itemNotes.length}):
                  </span>
                  {itemNotes.map((noteText, nIdx) => (
                    <div
                      key={nIdx}
                      className="text-xs p-2 rounded-lg bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200/60 dark:border-amber-800/50 text-slate-700 dark:text-zinc-200 whitespace-pre-wrap"
                    >
                      {noteText}
                    </div>
                  ))}
                </div>
              )}

              {itemAudios.length > 0 && (
                <div className="space-y-2 mb-2.5">
                  <span className="text-[11px] font-semibold text-rose-700 dark:text-rose-300 block">
                    🎤 Áudios ({itemAudios.length}):
                  </span>
                  {itemAudios.map((aud) => (
                    <div key={aud.id} className="bg-slate-50 dark:bg-zinc-950 p-2 rounded-lg border border-slate-200/70 dark:border-zinc-800">
                      <p className="text-[11px] font-medium text-slate-500 mb-1 truncate">{aud.name}</p>
                      <audio controls src={aud.src} className="w-full h-8" />
                    </div>
                  ))}
                </div>
              )}

              {itemImages.length > 1 && (
                <div className="flex gap-1.5 overflow-x-auto pb-1 mb-2">
                  {itemImages.slice(1).map((imgSrc, iIdx) => (
                    <img
                      key={iIdx}
                      src={imgSrc}
                      alt={`Foto ${iIdx + 2}`}
                      className="h-14 w-14 rounded-lg object-cover border border-slate-200 dark:border-zinc-700 shrink-0"
                    />
                  ))}
                </div>
              )}

              {item.assignedPersons && item.assignedPersons.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-2">
                  {item.assignedPersons.map((p, idx) => (
                    <span key={idx} className="text-[11px] px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 dark:bg-sky-950 dark:text-sky-300 font-medium">
                      👤 {p}
                    </span>
                  ))}
                </div>
              )}

              {item.tags && item.tags.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-3">
                  {item.tags.map((tag, idx) => (
                    <button
                      key={idx}
                      onClick={() => onTagClick(tag)}
                      className="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400 hover:underline font-medium"
                    >
                      #{tag}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="px-4 py-2.5 bg-slate-50/80 dark:bg-zinc-950/60 border-t border-slate-100 dark:border-zinc-800 flex items-center justify-between gap-2 flex-wrap">
            <div className="flex items-center gap-1.5 flex-wrap">
              {hrefUrl && (
                <a
                  href={hrefUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="px-2.5 py-1 rounded-lg bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs font-medium flex items-center gap-1"
                >
                  <Icon name="external-link" size={13} /> Abrir Link
                </a>
              )}
              <button
                onClick={() => onToggleDone(item)}
                className="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-medium flex items-center gap-1"
              >
                <Icon name="check-circle" size={13} /> {item.priority === 'done' ? 'Reabrir' : 'Concluir'}
              </button>
              <button
                onClick={() => onToggleVault(item)}
                className="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200/70 dark:border-amber-800/60 text-xs font-medium flex items-center gap-1"
              >
                <Icon name={item.isPrivate ? 'unlock' : 'lock'} size={13} />
                {item.isPrivate ? 'Tirar do Cofre' : 'Colocar no Cofre'}
              </button>
            </div>

            <div className="flex items-center gap-1">
              <button onClick={() => onEdit(item)} className="p-1.5 rounded-lg hover:bg-slate-200 text-slate-500">
                <Icon name="pencil" size={14} />
              </button>
              <button onClick={() => onRequestCancelItem(item)} className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500">
                <Icon name="trash-2" size={14} />
              </button>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // MODAL DE CRIAÇÃO / EDIÇÃO COM RESPONSIVIDADE MOBILE, BOTÃO GERAR THUMB E RECORRÊNCIA
    // =========================================================================
    const ItemFormModal = ({ isOpen, onClose, onSave, folders, initialItem, isPrivateMode, defaultFolderId }) => {
      const [kind, setKind] = useState('link_media');
      const [title, setTitle] = useState('');
      const [url, setUrl] = useState('');
      const [thumbnail, setThumbnail] = useState('');

      // Lembrete em dia específico + recorrência
      const [reminderDate, setReminderDate] = useState('');
      const [reminderTime, setReminderTime] = useState('');
      const [recurrence, setRecurrence] = useState('none');

      // Múltiplas fotos / imagens
      const [images, setImages] = useState([]);
      const cameraInputRef = useRef(null);
      const galleryInputRef = useRef(null);

      // Múltiplos áudios
      const [audios, setAudios] = useState([]);
      const [recording, setRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      // Múltiplas notas livres
      const [freeNotes, setFreeNotes] = useState([]);
      const [noteDraft, setNoteDraft] = useState('');

      const [category, setCategory] = useState('links_gerais');
      const [genreOrTopic, setGenreOrTopic] = useState('');
      const [whatIsIt, setWhatIsIt] = useState('');
      const [whySaved, setWhySaved] = useState('');
      const [tagsInput, setTagsInput] = useState('');
      const [folderId, setFolderId] = useState(defaultFolderId || '');
      const [priority, setPriority] = useState('later');
      const [notificationMode, setNotificationMode] = useState('none');
      const [watchLater, setWatchLater] = useState(false);
      const [itemIsPrivate, setItemIsPrivate] = useState(Boolean(isPrivateMode));
      const [assignedPersonInput, setAssignedPersonInput] = useState('');
      const [assignedPersons, setAssignedPersons] = useState([]);
      const [fetchingThumb, setFetchingThumb] = useState(false);

      useEffect(() => {
        if (initialItem) {
          setKind(initialItem.kind || 'link_media');
          setTitle(initialItem.title || '');
          setUrl(initialItem.url || '');
          setThumbnail(initialItem.thumbnail || '');
          setReminderDate(initialItem.reminderDate || '');
          setReminderTime(initialItem.reminderTime || '');
          setRecurrence(initialItem.recurrence || 'none');

          const loadedImgs = Array.isArray(initialItem.images)
            ? initialItem.images.map((im, idx) =>
                typeof im === 'string' ? { id: `img-${idx}`, src: im, name: `Foto ${idx + 1}` } : im
              )
            : [];
          setImages(loadedImgs);

          const loadedAuds = Array.isArray(initialItem.audios)
            ? initialItem.audios.map((au, idx) =>
                typeof au === 'string' ? { id: `aud-${idx}`, src: au, name: `Áudio ${idx + 1}` } : au
              )
            : [];
          setAudios(loadedAuds);

          setFreeNotes(Array.isArray(initialItem.freeNotes) ? initialItem.freeNotes : []);
          setNoteDraft('');
          setCategory(initialItem.category || 'links_gerais');
          setGenreOrTopic(initialItem.genreOrTopic || '');
          setWhatIsIt(initialItem.whatIsIt || '');
          setWhySaved(initialItem.whySaved || '');
          setTagsInput((initialItem.tags || []).join(', '));
          setFolderId(initialItem.folderId || defaultFolderId || '');
          setPriority(initialItem.priority || 'later');
          setNotificationMode(initialItem.notificationMode || 'none');
          setWatchLater(Boolean(initialItem.watchLater));
          setItemIsPrivate(Boolean(initialItem.isPrivate));
          setAssignedPersons(initialItem.assignedPersons || []);
        } else {
          setKind('link_media');
          setTitle('');
          setUrl('');
          setThumbnail('');
          setReminderDate('');
          setReminderTime('');
          setRecurrence('none');
          setImages([]);
          setAudios([]);
          setFreeNotes([]);
          setNoteDraft('');
          setCategory('links_gerais');
          setGenreOrTopic('');
          setWhatIsIt('');
          setWhySaved('');
          setTagsInput('');
          setFolderId(defaultFolderId || '');
          setPriority('later');
          setNotificationMode('none');
          setWatchLater(false);
          setItemIsPrivate(Boolean(isPrivateMode));
          setAssignedPersons([]);
        }
      }, [initialItem, isOpen, defaultFolderId, isPrivateMode]);

      const handleGenerateThumbNow = async () => {
        if (!url || !url.trim()) {
          alert('Cole ou digite um link primeiro para gerar a thumb.');
          return;
        }
        setFetchingThumb(true);
        const thumb = await fetchAutoThumbnail(url, title);
        if (thumb) {
          setThumbnail(thumb);
          setImages((prev) => {
            const exists = prev.some((i) => i.src === thumb);
            if (exists) return prev;
            return [{ id: `thumb-${Date.now()}`, name: 'Capa Gerada', src: thumb }, ...prev];
          });
        }
        setFetchingThumb(false);
      };

      const appendImagesFromFiles = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        Array.from(fileList).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setImages((prev) => [
              ...prev,
              {
                id: `img-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                name: file.name || 'Foto',
                src: ev.target.result
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
      };

      const appendAudioFromFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setAudios((prev) => [
            ...prev,
            {
              id: `aud-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              name: file.name || `Áudio ${prev.length + 1}`,
              src: ev.target.result
            }
          ]);
        };
        reader.readAsDataURL(file);
      };

      const startRecordingAudio = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          audioChunksRef.current = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (ev) => {
              setAudios((prev) => [
                ...prev,
                {
                  id: `aud-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  name: `Gravação de voz ${prev.length + 1}`,
                  src: ev.target.result
                }
              ]);
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach((t) => t.stop());
          };
          recorder.start();
          mediaRecorderRef.current = recorder;
          setRecording(true);
        } catch (err) {
          alert('Não foi possível acessar o microfone.');
        }
      };

      const stopRecordingAudio = () => {
        if (mediaRecorderRef.current && recording) {
          mediaRecorderRef.current.stop();
          setRecording(false);
        }
      };

      const handleAddFreeNote = () => {
        if (!noteDraft.trim()) return;
        setFreeNotes((prev) => [...prev, noteDraft.trim()]);
        setNoteDraft('');
      };

      if (!isOpen) return null;

      const scopedFolders = folders.filter((f) => Boolean(f.isPrivate) === Boolean(itemIsPrivate));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        const finalPersons = [...assignedPersons];
        if (assignedPersonInput.trim() && !finalPersons.includes(assignedPersonInput.trim())) {
          finalPersons.push(assignedPersonInput.trim());
        }

        const finalNotes = [...freeNotes];
        if (noteDraft.trim()) {
          finalNotes.push(noteDraft.trim());
        }

        const parsedTags = tagsInput
          .split(',')
          .map((t) => t.trim())
          .filter(Boolean);

        const payload = {
          ...(initialItem || {}),
          id: initialItem ? initialItem.id : `item-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          kind,
          title: title.trim(),
          url: url.trim() || undefined,
          thumbnail: thumbnail.trim() || (images[0]?.src) || undefined,
          images,
          audios,
          freeNotes: finalNotes,
          category,
          genreOrTopic: genreOrTopic.trim() || 'Geral',
          whatIsIt: whatIsIt.trim(),
          whySaved: whySaved.trim(),
          tags: parsedTags,
          folderId: folderId || null,
          priority,
          notificationMode,
          watchLater,
          reminderDate: reminderDate || '',
          reminderTime: reminderTime || '',
          recurrence: recurrence || 'none',
          canceledDates: initialItem?.canceledDates || [],
          isPrivate: Boolean(itemIsPrivate),
          assignedPersons: finalPersons,
          seenConfirmed: initialItem ? initialItem.seenConfirmed : false,
          archivedToHistory: false,
          createdAt: initialItem ? initialItem.createdAt : new Date().toISOString(),
          order: initialItem ? initialItem.order : 0,
        };

        onSave(payload);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/55 backdrop-blur-sm flex items-start justify-center p-2 sm:p-4 overflow-y-auto">
          <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200 dark:border-zinc-800 w-full max-w-2xl p-4 sm:p-6 shadow-2xl my-2 sm:my-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-zinc-800 gap-2">
              <h2 className="text-base sm:text-lg font-bold truncate">
                {initialItem ? 'Editar Tarefa / Item' : 'Nova Tarefa / Item'}
              </h2>
              <button type="button" onClick={onClose} className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800 shrink-0">
                <Icon name="x" size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 mt-4">
              {/* Campo Título (nunca cortado no celular) */}
              <div className="w-full">
                <label className="block text-xs font-semibold mb-1">Título da Tarefa / Item *</label>
                <input
                  required
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="Ex: Visita ao médico, Estudo React, Lembrete..."
                  className="w-full min-w-0 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-sm"
                />
              </div>

              {/* Campo Link + Botão Gerar Thumb ao lado */}
              <div className="w-full">
                <label className="block text-xs font-semibold mb-1">Link da Tarefa / Mídia</label>
                <div className="flex flex-col sm:flex-row gap-2 w-full">
                  <input
                    type="text"
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    placeholder="https://..."
                    className="flex-1 min-w-0 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-sm"
                  />
                  <button
                    type="button"
                    onClick={handleGenerateThumbNow}
                    disabled={fetchingThumb}
                    className="px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center justify-center gap-1.5 shrink-0"
                  >
                    <Icon name="image" size={14} />
                    {fetchingThumb ? 'Gerando...' : 'Gerar Thumb'}
                  </button>
                </div>

                {thumbnail && (
                  <div className="mt-2 flex items-center gap-3 p-2 rounded-xl bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800">
                    <img src={thumbnail} alt="Thumb gerada" className="h-14 w-24 rounded-lg object-cover shrink-0" />
                    <div className="min-w-0 flex-1">
                      <p className="text-[11px] font-semibold text-emerald-600">Thumb pronta!</p>
                      <button
                        type="button"
                        onClick={() => setThumbnail('')}
                        className="text-[11px] text-rose-500 hover:underline mt-0.5"
                      >
                        Remover thumb
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* Lembrete em dia específico + Recorrência */}
              <div className="p-3.5 rounded-xl bg-indigo-50/50 dark:bg-indigo-950/20 border border-indigo-200/70 dark:border-indigo-800/50 space-y-3">
                <span className="text-xs font-bold text-indigo-900 dark:text-indigo-200 flex items-center gap-1.5">
                  <Icon name="bell" size={14} /> Lembrete em Dia Específico & Recorrência
                </span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                  <div className="min-w-0">
                    <label className="block text-[11px] font-semibold mb-1">Dia do Lembrete</label>
                    <input
                      type="date"
                      value={reminderDate}
                      onChange={(e) => setReminderDate(e.target.value)}
                      className="w-full min-w-0 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] font-semibold mb-1">Horário (Opcional)</label>
                    <input
                      type="time"
                      value={reminderTime}
                      onChange={(e) => setReminderTime(e.target.value)}
                      className="w-full min-w-0 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] font-semibold mb-1">Recorrência</label>
                    <select
                      value={recurrence}
                      onChange={(e) => setRecurrence(e.target.value)}
                      className="w-full min-w-0 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                    >
                      {RECURRENCE_MODES.map((r) => (
                        <option key={r.id} value={r.id}>{r.label}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>

              {/* SEÇÃO 1: MÚLTIPLAS NOTAS LIVRES */}
              <div className="p-3.5 rounded-xl bg-amber-50/50 dark:bg-amber-950/20 border border-amber-200/70 dark:border-amber-800/50 space-y-2.5">
                <span className="text-xs font-bold text-amber-900 dark:text-amber-200 flex items-center gap-1.5">
                  <Icon name="file-text" size={14} /> Notas Livres na Tarefa ({freeNotes.length})
                </span>
                <textarea
                  rows={2}
                  value={noteDraft}
                  onChange={(e) => setNoteDraft(e.target.value)}
                  placeholder="Escreva uma nota livre aqui..."
                  className="w-full min-w-0 px-3 py-2 rounded-xl border border-amber-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                />
                <button
                  type="button"
                  onClick={handleAddFreeNote}
                  className="px-3 py-1.5 rounded-lg bg-amber-600 text-white text-xs font-semibold flex items-center gap-1"
                >
                  <Icon name="plus" size={13} /> Adicionar Nota
                </button>

                {freeNotes.length > 0 && (
                  <div className="space-y-1.5 pt-1">
                    {freeNotes.map((n, idx) => (
                      <div key={idx} className="flex items-start justify-between gap-2 p-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 text-xs">
                        <span className="whitespace-pre-wrap flex-1 break-words">{n}</span>
                        <button
                          type="button"
                          onClick={() => setFreeNotes(freeNotes.filter((_, i) => i !== idx))}
                          className="text-rose-500 hover:bg-rose-50 p-1 rounded shrink-0"
                        >
                          <Icon name="trash-2" size={13} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* SEÇÃO 2: MÚLTIPLOS ÁUDIOS */}
              <div className="p-3.5 rounded-xl bg-rose-50/50 dark:bg-rose-950/20 border border-rose-200/70 dark:border-rose-800/50 space-y-2.5">
                <span className="text-xs font-bold text-rose-900 dark:text-rose-200 flex items-center gap-1.5">
                  <Icon name="mic" size={14} /> Áudios da Tarefa — Gravar ou Trazer Arquivo ({audios.length})
                </span>
                <div className="flex flex-wrap items-center gap-2">
                  {!recording ? (
                    <button
                      type="button"
                      onClick={startRecordingAudio}
                      className="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold flex items-center gap-1"
                    >
                      <Icon name="mic" size={14} /> Gravar Áudio
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={stopRecordingAudio}
                      className="px-3 py-1.5 rounded-lg bg-amber-600 text-white text-xs font-semibold animate-pulse"
                    >
                      Parar Gravação
                    </button>
                  )}

                  <label className="px-3 py-1.5 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 text-xs font-semibold cursor-pointer flex items-center gap-1">
                    <Icon name="upload" size={14} /> Trazer Arquivo de Áudio
                    <input
                      type="file"
                      accept="audio/*"
                      className="hidden"
                      onChange={(e) => {
                        appendAudioFromFile(e.target.files?.[0]);
                        e.target.value = '';
                      }}
                    />
                  </label>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="min-w-0">
                  <label className="block text-xs font-semibold mb-1">Pasta</label>
                  <select
                    value={folderId}

                    className="w-full min-w-0 px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm"
                  >

                  <label className="block text-xs font-semibold mb-1">Notificação / Alerta</label>
                  <select
                    value={notificationMode}

                    className="w-full min-w-0 px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs"
                  >
