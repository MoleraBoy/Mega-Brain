    // =========================================================================
    // 3. MOTOR DE APRENDIZADO SEMÂNTICO, TNE E ALERTAS MULTIMODAIS
    // =========================================================================
    function checkIsTNE(title, whatIsIt, whySaved, tags) {
      const text = `${title} ${whatIsIt} ${whySaved} ${(tags || []).join(' ')}`.toLowerCase();
      return TNE_KEYWORDS.some((kw) => text.includes(kw));
    }

    function learnAndSuggestFromHistory(queryText, items) {
      const q = (queryText || '').toLowerCase().trim();
      if (!q) return null;
      const tokens = q.split(/[\s\-_/.:?=&,]+/).filter((t) => t.length > 2);

      let bestItem = null;
      let bestScore = 0;

      for (const item of items) {
        let score = 0;
        const corpus = `${item.title} ${item.genreOrTopic} ${item.whatIsIt} ${item.whySaved} ${(item.tags || []).join(' ')}`.toLowerCase();
        for (const tk of tokens) {
          if (corpus.includes(tk)) score += 2;
          if ((item.tags || []).some((tg) => tg.toLowerCase() === tk)) score += 3;
        }
        if (score > bestScore) {
          bestScore = score;
          bestItem = item;
        }
      }

      const domainMap = [
        { key: 'terror', cat: 'media_terror', genre: 'Terror / Suspense', what: 'Filme ou série de terror para assistir', tag: 'terror' },
        { key: 'comedia', cat: 'media_comedia', genre: 'Comédia', what: 'Conteúdo de comédia para descontrair', tag: 'comedia' },
        { key: 'comédia', cat: 'media_comedia', genre: 'Comédia', what: 'Conteúdo de comédia para descontrair', tag: 'comedia' },
        { key: 'anime', cat: 'media_geral', genre: 'Anime / Mangá', what: 'Anime ou mangá salvo na lista', tag: 'anime' },
        { key: 'manga', cat: 'media_geral', genre: 'Anime / Mangá', what: 'Mangá para leitura', tag: 'manga' },
        { key: 'spotify', cat: 'musicas', genre: 'Música / Playlist', what: 'Faixa ou playlist musical salva', tag: 'musica' },
        { key: 'receita', cat: 'receitas', genre: 'Culinária', what: 'Receita culinária para preparar', tag: 'receita' },
        { key: 'youtube', cat: 'estudos', genre: 'Videoaula / Vídeo', what: 'Vídeo educativo ou referência visual', tag: 'video' },
        { key: 'github', cat: 'estudos', genre: 'Código / Projeto', what: 'Repositório técnico de referência', tag: 'dev' },
        { key: 'pdf', cat: 'estudos', genre: 'Leitura / PDF', what: 'Material em PDF para estudo', tag: 'pdf' },
      ];

      let category = bestItem && bestScore >= 2 ? bestItem.category : 'links_gerais';
      let genreOrTopic = bestItem && bestScore >= 2 ? bestItem.genreOrTopic : '';
      let whatIsIt = bestItem && bestScore >= 2 ? bestItem.whatIsIt : '';
      let whySaved = bestItem && bestScore >= 2 ? `Baseado no seu histórico ("${bestItem.title}"): ${bestItem.whySaved}` : '';
      const tags = new Set(bestItem && bestScore >= 2 ? (bestItem.tags || []).slice(0, 3) : []);

      for (const rule of domainMap) {
        if (q.includes(rule.key)) {
          if (!bestItem || bestScore < 2) {
            category = rule.cat;
            genreOrTopic = rule.genre;
            whatIsIt = rule.what;
          }
          tags.add(rule.tag);
        }
      }

      // Reaproveita tags já usadas pelo usuário que apareçam no texto
      const userTags = Array.from(new Set(items.flatMap((i) => i.tags || [])));
      userTags.forEach((ut) => {
        if (q.includes(ut.toLowerCase())) tags.add(ut);
      });

      const finalTags = Array.from(tags);
      const isTNE = category === 'estudos' && checkIsTNE(q, whatIsIt, whySaved, finalTags);

      return { category, genreOrTopic, whatIsIt, whySaved, tags: finalTags, isTNE };
    }

    function fireTaskNotification(title, body, mode = 'popup_only') {
      if ((mode === 'vibrate_sound' || mode === 'vibrate_only') && navigator.vibrate) {
        try { navigator.vibrate([250, 120, 250, 120, 400]); } catch (e) {}
      }
      if (mode === 'vibrate_sound') {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
      }
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          new Notification(title, { body });
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then((p) => {
            if (p === 'granted') new Notification(title, { body });
          });
        }
      }
    }

      const handleCreate = (e, parentId) => {

                      isSelected
                        ? 'bg-indigo-600 text-white font-medium shadow-sm'
                        : 'text-slate-700 dark:text-zinc-300 hover:bg-slate-200/70 dark:hover:bg-zinc-800/80'
                    }`}
                    onClick={() => onSelectFolder(folder.id)}
                  >

                      <Icon name="folder" size={15} className={isSelected ? 'text-white' : 'text-indigo-500'} />

                    </div>
                    <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">

                        title="Criar subpasta dentro desta pasta"
                        onClick={(e) => {

                        className={`p-1 rounded hover:bg-black/10 ${isSelected ? 'text-white' : 'text-slate-500 dark:text-zinc-400'}`}

                      </button>
                      <button
                        title="Concluir/Arquivar pasta"
                        onClick={(e) => {
                          e.stopPropagation();
                          onArchiveFolder(folder);
                        }}
                        className={`p-1 rounded hover:bg-black/10 ${isSelected ? 'text-white' : 'text-slate-500 dark:text-zinc-400'}`}
                      >
                        <Icon name="check-circle-2" size={13} />
                      </button>
                    </div>
                  </div>

                  {creatingParentId === folder.id && (
                    <form onSubmit={(e) => handleCreate(e, folder.id)} className="mt-1 ml-4 flex gap-1">
                      <input
                        autoFocus
                        type="text"
                        value={newFolderName}
                        onChange={(e) => setNewFolderName(e.target.value)}
                        placeholder="Nova subpasta..."
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-400 bg-white dark:bg-zinc-900 focus:outline-none"

                      <button type="submit" className="px-2 py-1 bg-indigo-600 text-white text-xs rounded">OK</button>
                    </form>
                  )}

                  {renderBranch(folder.id, depth + 1)}
                </div>
              );
            })}
          </div>
        );
      };

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-3.5 shadow-material">
          <div className="flex items-center justify-between mb-2.5">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-zinc-500">
              {isPrivateMode ? 'Pastas Privadas' : 'Pastas & Subpastas'}
            </span>
            <button
              onClick={() => {
                setCreatingParentId(creatingParentId === 'ROOT' ? 'NONE' : 'ROOT');
                setNewFolderName('');
              }}
              className="text-xs flex items-center gap-1 text-indigo-600 dark:text-indigo-400 hover:underline font-medium"
            >
              <Icon name="plus" size={14} /> Nova Pasta
            </button>
          </div>

          <button
            onClick={() => onSelectFolder(null)}

        </div>
      );
    };

    // =========================================================================
    // 5. POMODORO & TIMER DE FOCO INTEGRADO
    // =========================================================================
    const PomodoroWidget = ({ onNotify }) => {
      const [secondsLeft, setSecondsLeft] = useState(25 * 60);
      const [running, setRunning] = useState(false);
      const [mode, setMode] = useState('focus'); // focus | break

      useEffect(() => {
        if (!running) return;
        const timer = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              setRunning(false);
              onNotify(
                mode === 'focus' ? '⏰ Ciclo Pomodoro Concluído!' : '⚡ Pausa Finalizada!',
                mode === 'focus' ? 'Hora de fazer uma pausa de 5 minutos.' : 'Vamos voltar ao foco!',
                'vibrate_sound'
              );
              return mode === 'focus' ? 5 * 60 : 25 * 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [running, mode]);

      const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const secs = String(secondsLeft % 60).padStart(2, '0');

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-4 shadow-material">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <Icon name="timer" size={14} className="text-indigo-500" /> Foco Pomodoro
            </span>
            <div className="flex gap-1">
              <button
                onClick={() => { setRunning(false); setMode('focus'); setSecondsLeft(25 * 60); }}
                className={`text-[11px] px-2 py-0.5 rounded-full ${mode === 'focus' ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 font-semibold' : 'text-slate-500'}`}
              >25m</button>
              <button
                onClick={() => { setRunning(false); setMode('break'); setSecondsLeft(5 * 60); }}
                className={`text-[11px] px-2 py-0.5 rounded-full ${mode === 'break' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 font-semibold' : 'text-slate-500'}`}
              >5m</button>
            </div>
          </div>
          <div className="text-3xl font-bold tracking-tight text-center my-2 font-mono">
            {mins}:{secs}
          </div>
          <div className="flex gap-2">
            <button
              onClick={() => setRunning(!running)}
              className="flex-1 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium flex items-center justify-center gap-1 transition"
            >
              <Icon name={running ? 'pause' : 'play'} size={14} />
              {running ? 'Pausar' : 'Iniciar'}
            </button>
            <button
              onClick={() => { setRunning(false); setSecondsLeft(mode === 'focus' ? 25 * 60 : 5 * 60); }}
              className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs hover:bg-slate-100 dark:hover:bg-zinc-800"
            >
              Resetar
            </button>
          </div>
        </div>
      );
    };

    // =========================================================================

    // =========================================================================
    // 7. MODAL DE CRIAÇÃO / EDIÇÃO COM APRENDIZADO SEMÂNTICO E DETECÇÃO TNE
    // =========================================================================
    const ItemFormModal = ({ isOpen, onClose, onSave, existingItems, folders, initialItem, isPrivateMode, defaultKind = 'link_media' }) => {
      const [kind, setKind] = useState(defaultKind);
      const [title, setTitle] = useState('');
      const [url, setUrl] = useState('');
      const [thumbnail, setThumbnail] = useState('');
      const [category, setCategory] = useState('links_gerais');
      const [genreOrTopic, setGenreOrTopic] = useState('');
      const [whatIsIt, setWhatIsIt] = useState('');
      const [whySaved, setWhySaved] = useState('');
      const [tagsInput, setTagsInput] = useState('');
      const [folderId, setFolderId] = useState('');
      const [priority, setPriority] = useState('later');
      const [dueDate, setDueDate] = useState('');
      const [isHabit, setIsHabit] = useState(false);
      const [habitFrequency, setHabitFrequency] = useState('daily');
      const [assignedPerson, setAssignedPerson] = useState('');
      const [notificationMode, setNotificationMode] = useState('popup_only');
      const [subtasks, setSubtasks] = useState([]);
      const [newSubtask, setNewSubtask] = useState('');
      const [amount, setAmount] = useState('');
      const [financeType, setFinanceType] = useState('bill');
      const [isTNE, setIsTNE] = useState(false);
      const [aiSuggestionNote, setAiSuggestionNote] = useState('');

      useEffect(() => {
        if (initialItem) {
          setKind(initialItem.kind);
          setTitle(initialItem.title || '');
          setUrl(initialItem.url || '');
          setThumbnail(initialItem.thumbnail || '');
          setCategory(initialItem.category || 'links_gerais');
          setGenreOrTopic(initialItem.genreOrTopic || '');
          setWhatIsIt(initialItem.whatIsIt || '');
          setWhySaved(initialItem.whySaved || '');
          setTagsInput((initialItem.tags || []).join(', '));
          setFolderId(initialItem.folderId || '');
          setPriority(initialItem.priority || 'later');
          setDueDate(initialItem.dueDate || '');
          setIsHabit(Boolean(initialItem.isHabit));
          setHabitFrequency(initialItem.habitFrequency || 'daily');
          setAssignedPerson(initialItem.assignedPerson || '');
          setNotificationMode(initialItem.notificationMode || 'popup_only');
          setSubtasks(initialItem.subtasks || []);
          setAmount(initialItem.amount != null ? String(initialItem.amount) : '');
          setFinanceType(initialItem.financeType || 'bill');
          setIsTNE(Boolean(initialItem.isTNE));
          setAiSuggestionNote('');
        } else {
          setKind(defaultKind);
          setTitle('');
          setUrl('');
          setThumbnail('');
          setCategory(defaultKind === 'finance' ? 'financas' : 'links_gerais');
          setGenreOrTopic('');
          setWhatIsIt('');
          setWhySaved('');
          setTagsInput('');
          setFolderId('');
          setPriority(defaultKind === 'task' ? 'attention' : 'later');
          setDueDate('');
          setIsHabit(false);
          setHabitFrequency('daily');
          setAssignedPerson('');
          setNotificationMode('popup_only');
          setSubtasks([]);
          setAmount('');
          setFinanceType('bill');
          setIsTNE(false);
          setAiSuggestionNote('');
        }
      }, [initialItem, isOpen, defaultKind]);

      // Aprendizado automático baseado em tags, "o que é" e "por que salvei" anteriores
      const handleAutoLearn = (triggerText) => {
        if (initialItem) return;
        const suggestion = learnAndSuggestFromHistory(triggerText, existingItems);
        if (!suggestion) return;
        if (!genreOrTopic && suggestion.genreOrTopic) setGenreOrTopic(suggestion.genreOrTopic);
        if (!whatIsIt && suggestion.whatIsIt) setWhatIsIt(suggestion.whatIsIt);
        if (!whySaved && suggestion.whySaved) setWhySaved(suggestion.whySaved);
        if (!tagsInput && suggestion.tags.length > 0) setTagsInput(suggestion.tags.join(', '));
        if (suggestion.category !== 'links_gerais') setCategory(suggestion.category);
        setIsTNE(suggestion.isTNE);
        if (suggestion.tags.length > 0 || suggestion.whatIsIt) {
          setAiSuggestionNote('✨ Preenchido automaticamente com base nas suas tags e histórico anterior.');
        }
      };

      // Atualiza detecção TNE dinamicamente se estiver na área de Estudos
      useEffect(() => {
        const parsedTags = tagsInput.split(',').map((t) => t.trim()).filter(Boolean);
        if (category === 'estudos') {
          setIsTNE(checkIsTNE(title, whatIsIt, whySaved, parsedTags));
        } else {
          setIsTNE(false);
        }
      }, [category, title, whatIsIt, whySaved, tagsInput]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {

          title: title.trim(),
          url: url.trim() || undefined,

        onClose();

    // =========================================================================
    // 10. ESPAÇO PRIVADO COM PIN E BIOMETRIA DIGITAL (WEBAUTHN)
    // =========================================================================
    const PrivateSpaceGate = ({ preferences, onUpdatePrefs, children }) => {
      const [unlocked, setUnlocked] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [error, setError] = useState('');
      const [bioSupported, setBioSupported] = useState(false);

      useEffect(() => {
        if (window.PublicKeyCredential) {
          PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
            .then((ok) => setBioSupported(ok))
            .catch(() => setBioSupported(false));
        }
      }, []);

      const handleSetupPin = (e) => {
        e.preventDefault();
        if (newPinInput.length < 4) {
          setError('Crie um PIN de pelo menos 4 dígitos.');
          return;
        }
        onUpdatePrefs({ ...preferences, privatePin: newPinInput });
        setUnlocked(true);
        setError('');
      };

      const handleUnlockWithPin = (e) => {
        e.preventDefault();
        if (pinInput === preferences.privatePin) {
          setUnlocked(true);
          setPinInput('');
          setError('');
        } else {
          setError('PIN incorreto. Tente novamente.');
        }
      };

      const handleBiometricAuth = async () => {
        try {
          const challenge = crypto.getRandomValues(new Uint8Array(32));
          const userId = crypto.getRandomValues(new Uint8Array(16));
          const cred = await navigator.credentials.create({
            publicKey: {
              challenge,
              rp: { name: 'Mega Brain Cofre Privado' },
              user: { id: userId, name: 'usuario-privado', displayName: 'Usuário Mega Brain' },
              pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
              authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
              timeout: 60000,
            },
          });
          if (cred) {
            onUpdatePrefs({ ...preferences, biometricEnabled: true });
            setUnlocked(true);
            setError('');
          }
        } catch (err) {
          setError('Autenticação biométrica cancelada ou indisponível neste dispositivo. Use o PIN.');
        }
      };

      if (unlocked) {
        return (
          <div className="space-y-4">
            <div className="bg-zinc-900 text-zinc-100 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 border border-zinc-800 shadow-material">

                  <h3 className="font-bold text-sm">Espaço Privado Desbloqueado</h3>

                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3 text-xs">
                <label className="flex items-center gap-1.5 cursor-pointer bg-zinc-800 px-3 py-1.5 rounded-xl">
                  <input
                    type="checkbox"
                    checked={preferences.includePrivateInReports}
                    onChange={(e) => onUpdatePrefs({ ...preferences, includePrivateInReports: e.target.checked })}
                  />
                  Incluir nos Relatórios
                </label>
                <label className="flex items-center gap-1.5 cursor-pointer bg-zinc-800 px-3 py-1.5 rounded-xl">
                  <input
                    type="checkbox"
                    checked={preferences.includePrivateInWednesday}
                    onChange={(e) => onUpdatePrefs({ ...preferences, includePrivateInWednesday: e.target.checked })}
                  />
                  Lembrete de Quarta-Feira
                </label>
                <button
                  onClick={() => setUnlocked(false)}
                  className="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold flex items-center gap-1"
                >
                  <Icon name="lock" size={14} /> Bloquear
                </button>
              </div>
            </div>
            {children}
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto my-10 bg-white dark:bg-zinc-900 rounded-3xl border border-slate-200 dark:border-zinc-800 p-8 shadow-material-lg text-center">
          <div className="w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto mb-4">
            <Icon name="fingerprint" size={30} />
          </div>
          <h2 className="text-xl font-bold">Espaço Privado Protegido</h2>
          <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1">
            Guarde links, tarefas e pastas confidenciais fora das estatísticas públicas.
          </p>

          {!preferences.privatePin ? (
            <form onSubmit={handleSetupPin} className="mt-6 space-y-3">
              <p className="text-xs font-medium text-indigo-600 dark:text-indigo-400">Primeiro acesso: defina seu PIN de segurança</p>
              <input
                type="password"
                inputMode="numeric"
                maxLength={8}
                value={newPinInput}
                onChange={(e) => setNewPinInput(e.target.value)}
                placeholder="Digite um PIN (mín. 4 dígitos)"
                className="w-full text-center tracking-widest text-lg px-4 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent"
              />
              <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">
                Criar PIN e Entrar
              </button>
            </form>
          ) : (
            <form onSubmit={handleUnlockWithPin} className="mt-6 space-y-3">
              <input
                type="password"
                inputMode="numeric"
                maxLength={8}
                value={pinInput}
                onChange={(e) => setPinInput(e.target.value)}

                className="w-full text-center tracking-widest text-lg px-4 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent"

              {bioSupported && (

                  className="w-full py-2.5 rounded-xl border border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 text-sm font-semibold flex items-center justify-center gap-2"

    // =========================================================================
    // 11. RELATÓRIOS ANALÍTICOS INTELIGENTES (INCLUI REGRA DE ESTUDOS E TNE)
    // =========================================================================
    const ReportsView = ({ items, history, stats, includePrivate }) => {
      const scopedItems = items.filter((i) => (includePrivate ? true : !i.isPrivate));
      const scopedHistory = history.filter((h) => (includePrivate ? true : !h.isPrivate));

      const completedTasks = tasks.filter((t) => t.priority === 'done').length + scopedHistory.filter((h) => h.entryType === 'task').length;
      const totalTasksCount = tasks.length + scopedHistory.filter((h) => h.entryType === 'task').length;
      const completionRate = totalTasksCount > 0 ? Math.round((completedTasks / totalTasksCount) * 100) : 0;

      const totalPostponed = tasks.reduce((acc, t) => acc + (t.postponeCount || 0), 0) + (stats.totalPostponedTasks || 0);
      const postponementRate = totalTasksCount > 0 ? Math.round((totalPostponed / totalTasksCount) * 100) : 0;

      // Links realmente visitados ("Visto" confirmado)
      const seenKeptInHistory = scopedHistory.filter((h) => h.entryType === 'link_media').length;
      const seenDiscarded = stats.discardedAfterSeenCount || 0;
      const totalConfirmedVisits = seenKeptInHistory + seenDiscarded;

      // Ranking do que mais está sendo salvo por categoria e tags
      const categoryCounts = {};
      const tagCounts = {};
      scopedItems.forEach((i) => {
        const label = CATEGORY_META[i.category]?.label || i.category;
        categoryCounts[label] = (categoryCounts[label] || 0) + 1;
        (i.tags || []).forEach((t) => {
          tagCounts[t] = (tagCounts[t] || 0) + 1;
        });
      });

      const topCategories = Object.entries(categoryCounts).sort((a, b) => b[1] - a[1]);
      const topTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);

      // Regra 7: Estudos — se nada foi jogado no estudo, nem traz no relatório; separa TNE!
      const studyItems = scopedItems.filter((i) => i.category === 'estudos');

            <span className="text-xs px-3 py-1 rounded-full bg-slate-200/70 dark:bg-zinc-800 font-medium">
              {includePrivate ? '🔓 Incluindo Espaço Privado' : '🛡️ Apenas Dados Públicos'}
            </span>

            <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material">
              <span className="text-xs text-slate-500 font-medium">Taxa de Conclusão de Tarefas</span>
              <div className="text-3xl font-bold text-emerald-600 mt-1">{completionRate}%</div>
              <span className="text-[11px] text-slate-400">{completedTasks} de {totalTasksCount} tarefas concluídas</span>
            </div>

            <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material">
              <span className="text-xs text-slate-500 font-medium">Taxa de Adiamento</span>
              <div className="text-3xl font-bold text-amber-500 mt-1">{postponementRate}%</div>
              <span className="text-[11px] text-slate-400">{totalPostponed} adiamentos registrados</span>
            </div>

            <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material">
              <span className="text-xs text-slate-500 font-medium">Visitas Reais Confirmadas (Visto)</span>
              <div className="text-3xl font-bold text-indigo-600 mt-1">{totalConfirmedVisits}</div>
              <span className="text-[11px] text-slate-400">{seenKeptInHistory} guardados • {seenDiscarded} descartados após ver</span>
            </div>

            <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material">
              <span className="text-xs text-slate-500 font-medium">Itens no Histórico Salvo</span>
              <div className="text-3xl font-bold text-slate-800 dark:text-zinc-100 mt-1">{scopedHistory.length}</div>
              <span className="text-[11px] text-slate-400">Links, tarefas e pastas arquivadas</span>

          {/* O que mais está sendo salvo */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">

                <div className="space-y-2.5">
                  {topCategories.map(([cat, count]) => {
                    const pct = Math.round((count / Math.max(scopedItems.length, 1)) * 100);
                    return (
                      <div key={cat}>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="font-medium">{cat}</span>
                          <span className="text-slate-500">{count} ({pct}%)</span>
                        </div>
                        <div className="w-full h-2 rounded-full bg-slate-100 dark:bg-zinc-800 overflow-hidden">
                          <div className="h-full bg-indigo-600 rounded-full" style={{ width: `${pct}%` }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material">
              <h3 className="font-bold text-sm mb-3 flex items-center gap-2">
                <Icon name="tags" size={16} className="text-indigo-500" /> Tags Mais Aprendidas pelo Sistema
              </h3>
              <div className="flex flex-wrap gap-2">
                {topTags.length === 0 ? (
                  <p className="text-xs text-slate-400">Adicione tags aos seus itens para ver o padrão.</p>
                ) : (
                  topTags.map(([tag, count]) => (
                    <span key={tag} className="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 text-xs font-semibold">
                      #{tag} <span className="opacity-70 ml-1">({count})</span>
                    </span>
                  ))
                )}
              </div>
            </div>
          </div>

          {/* Seção Condicional de Estudos (Só aparece se houver itens em Estudos) */}
          {studyItems.length > 0 && (
            <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-indigo-200 dark:border-indigo-900/60 shadow-material">
              <h3 className="font-bold text-sm mb-3 flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                <Icon name="graduation-cap" size={18} /> Diagnóstico da Área de Estudos
              </h3>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="p-3.5 rounded-xl bg-slate-50 dark:bg-zinc-950">
                  <span className="text-xs text-slate-500">Temas Reais de Estudo</span>
                  <div className="text-2xl font-bold mt-1">{realStudyTopics.length}</div>
                  <p className="text-[11px] text-slate-400 mt-0.5">Matérias, cursos e leituras técnicas</p>
                </div>
                <div className="p-3.5 rounded-xl bg-purple-50/70 dark:bg-purple-950/30 border border-purple-200/60 dark:border-purple-900">
                  <span className="text-xs text-purple-700 dark:text-purple-300 font-semibold">TNE (Tarefas que Não são Estudo)</span>
                  <div className="text-2xl font-bold text-purple-700 dark:text-purple-300 mt-1">{tneItems.length}</div>
                  <p className="text-[11px] text-purple-600/80 dark:text-purple-400 mt-0.5">
                    Ex: arrumar site, setup ou ajustes salvos dentro de Estudos
                  </p>
                </div>
                <div className="p-3.5 rounded-xl bg-slate-50 dark:bg-zinc-950">
                  <span className="text-xs text-slate-500">Estudos Concluídos</span>
                  <div className="text-2xl font-bold text-emerald-600 mt-1">
                    {realStudyTopics.filter((s) => s.priority === 'done').length}
                  </div>
                  <p className="text-[11px] text-slate-400 mt-0.5">Progresso efetivo nas trilhas</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 12. APLICAÇÃO PRINCIPAL (MEGA BRAIN SPA)
    // =========================================================================
    function MegaBrainApp() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem('mega_brain_v1_state');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          folders: INITIAL_FOLDERS,
          items: INITIAL_ITEMS,
          history: [],
          preferences: DEFAULT_PREFS,
          stats: { discardedAfterSeenCount: 0, totalPostponedTasks: 0 },
        };
      });

      const [activeTab, setActiveTab] = useState('home'); // home | links_media | tasks | studies | finance | history | reports | private
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedFolderId, setSelectedFolderId] = useState(null);
      const [personFilter, setPersonFilter] = useState('');
      const [tagFilter, setTagFilter] = useState('');
      const [modalOpen, setModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [modalDefaultKind, setModalDefaultKind] = useState('link_media');
      const [seenTarget, setSeenTarget] = useState(null);
      const [wednesdayOpen, setWednesdayOpen] = useState(false);
      const [curiositySeed, setCuriositySeed] = useState(0);
      const [draggedItemId, setDraggedItemId] = useState(null);
      const [showHomeCustomizer, setShowHomeCustomizer] = useState(false);

      // Persistência em localStorage
      useEffect(() => {
        try {
          localStorage.setItem('mega_brain_v1_state', JSON.stringify(state));
        } catch (e) {}
      }, [state]);

      // Dark / Light Mode nativo
      useEffect(() => {
        const root = document.documentElement;
        if (state.preferences.theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [state.preferences.theme]);

      // Detecção automática de Quarta-Feira (ou gatilho manual)
      useEffect(() => {
        const today = new Date();
        const todayStr = today.toISOString().slice(0, 10);
        if (today.getDay() === 3 && state.preferences.lastWednesdayPromptDate !== todayStr) {
          setWednesdayOpen(true);
          setState((prev) => ({
            ...prev,
            preferences: { ...prev.preferences, lastWednesdayPromptDate: todayStr },
          }));
        }
      }, []);

      // Helper para montar caminho completo da pasta (ex: Cinema & Séries / Maratona Terror)
      const getFolderPath = (fId) => {
        if (!fId) return '';
        const parts = [];
        let curr = state.folders.find((f) => f.id === fId);
        let guard = 0;
        while (curr && guard < 10) {
          parts.unshift(curr.name);
          curr = curr.parentId ? state.folders.find((f) => f.id === curr.parentId) : null;
          guard++;
        }
        return parts.join(' / ');
      };

      // Coleta todas as subpastas filhas recursivamente quando uma pasta é filtrada
      const getDescendantFolderIds = (rootId) => {
        if (!rootId) return [];
        const result = [rootId];
        const children = state.folders.filter((f) => f.parentId === rootId);
        children.forEach((c) => result.push(...getDescendantFolderIds(c.id)));
        return result;
      };

      // CRUD de Pastas
      const handleCreateFolder = (name, parentId, isPrivate = false) => {
        const newFolder = {
          id: `folder-${Date.now()}`,
          name,
          parentId,
          module: 'all',
          isPrivate,
          createdAt: new Date().toISOString(),
        };
        setState((prev) => ({ ...prev, folders: [...prev.folders, newFolder] }));
      };

      const handleArchiveFolder = (folder) => {
        const keep = window.confirm(`Deseja guardar a pasta "${folder.name}" na Área de Histórico ao concluí-la? (Cancelar = excluir direto)`);
        setState((prev) => ({
          ...prev,
          folders: prev.folders.filter((f) => f.id !== folder.id),
          history: keep
            ? [
                {
                  id: `hist-${Date.now()}`,
                  originalId: folder.id,
                  entryType: 'folder',
                  title: `Pasta: ${folder.name}`,
                  details: 'Pasta concluída e arquivada pelo usuário',
                  tags: [],
                  folderPath: getFolderPath(folder.parentId) || 'Raiz',
                  isPrivate: folder.isPrivate,
                  savedAt: new Date().toISOString(),
                },
                ...prev.history,
              ]
            : prev.history,
        }));
      };

      // CRUD de Itens
      const handleSaveItem = (itemData) => {
        setState((prev) => {
          const exists = prev.items.some((i) => i.id === itemData.id);
          const nextItems = exists
            ? prev.items.map((i) => (i.id === itemData.id ? itemData : i))
            : [itemData, ...prev.items];
          return { ...prev, items: nextItems };
        });
        if (itemData.kind === 'task' && itemData.dueDate) {
          fireTaskNotification(
            `Tarefa Agendada: ${itemData.title}`,
            `Modo de alerta configurado. Prazo: ${itemData.dueDate.replace('T', ' ')}`,
            itemData.notificationMode
          );
        }
      };

      const handleDeleteItem = (id) => {
        setState((prev) => ({ ...prev, items: prev.items.filter((i) => i.id !== id) }));
      };

      const handleToggleDone = (item) => {
        const becomingDone = item.priority !== 'done';
        if (becomingDone) {
          const keepInHistory = window.confirm(
            `Tarefa "${item.title}" concluída! Deseja salvá-la na Área de Histórico? (OK = Salvar no Histórico | Cancelar = Apenas marcar como concluída na lista)`
          );
          if (keepInHistory) {
            setState((prev) => ({
              ...prev,
              items: prev.items.filter((i) => i.id !== item.id),
              history: [
                {
                  id: `hist-${Date.now()}`,
                  originalId: item.id,
                  entryType: 'task',
                  title: item.title,
                  details: item.whatIsIt || item.whySaved || 'Tarefa concluída',
                  tags: item.tags || [],
                  folderPath: getFolderPath(item.folderId) || 'Raiz',
                  isPrivate: item.isPrivate,
                  savedAt: new Date().toISOString(),
                },
                ...prev.history,
              ],
            }));
            return;
          }
        }
        setState((prev) => ({
          ...prev,
          items: prev.items.map((i) =>
            i.id === item.id
              ? { ...i, priority: becomingDone ? 'done' : 'attention', completedAt: becomingDone ? new Date().toISOString() : undefined }
              : i
          ),
        }));
      };

      // Decisão após clicar em "Visto" em um link/mídia
      const handleSeenDecision = (item, keepInHistory) => {
        setState((prev) => ({
          ...prev,
          items: prev.items.filter((i) => i.id !== item.id),
          history: keepInHistory
            ? [
                {
                  id: `hist-${Date.now()}`,
                  originalId: item.id,
                  entryType: 'link_media',
                  title: item.title,
                  details: `${item.whatIsIt} — ${item.whySaved}`,
                  tags: item.tags || [],
                  folderPath: getFolderPath(item.folderId) || 'Raiz',
                  isPrivate: item.isPrivate,
                  savedAt: new Date().toISOString(),
                },
                ...prev.history,
              ]
            : prev.history,
          stats: {
            ...prev.stats,
            discardedAfterSeenCount: keepInHistory
              ? prev.stats.discardedAfterSeenCount
              : prev.stats.discardedAfterSeenCount + 1,
          },
        }));
        setSeenTarget(null);
      };

      const handlePostpone = (id) => {
        setState((prev) => ({
          ...prev,
          items: prev.items.map((i) =>
            i.id === id ? { ...i, postponeCount: (i.postponeCount || 0) + 1 } : i
          ),
          stats: {
            ...prev.stats,
            totalPostponedTasks: (prev.stats.totalPostponedTasks || 0) + 1,
          },
        }));
        fireTaskNotification('Tarefa Adiada', 'O adiamento foi registrado nas suas métricas de produtividade.', 'popup_only');
      };

      const handleToggleSubtask = (itemId, subtaskId) => {
        setState((prev) => ({
          ...prev,
          items: prev.items.map((i) =>
            i.id === itemId
              ? {
                  ...i,
                  subtasks: (i.subtasks || []).map((st) =>
                    st.id === subtaskId ? { ...st, done: !st.done } : st
                  ),
                }
              : i
          ),
        }));
      };

      // Mover item diretamente entre pastas/subpastas (Menu Links e Mídias)
      const handleMoveItemFolder = (itemId, newFolderId) => {
        setState((prev) => ({
          ...prev,
          items: prev.items.map((i) => (i.id === itemId ? { ...i, folderId: newFolderId || null } : i)),
        }));
      };

      // Drag & Drop para reordenar cards na Home
      const handleDropReorder = (targetId) => {
        if (!draggedItemId || draggedItemId === targetId) return;
        setState((prev) => {
          const sorted = [...prev.items].sort((a, b) => (a.homeOrder ?? 0) - (b.homeOrder ?? 0));
          const fromIdx = sorted.findIndex((i) => i.id === draggedItemId);
          const toIdx = sorted.findIndex((i) => i.id === targetId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [moved] = sorted.splice(fromIdx, 1);
          sorted.splice(toIdx, 0, moved);
          const reindexed = sorted.map((it, idx) => ({ ...it, homeOrder: idx }));
          return { ...prev, items: reindexed };
        });
        setDraggedItemId(null);
      };

      const publicItems = useMemo(() => state.items.filter((i) => !i.isPrivate), [state.items]);
      const privateItems = useMemo(() => state.items.filter((i) => i.isPrivate), [state.items]);

      const matchesGlobalSearch = (item) => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return (
          item.title.toLowerCase().includes(q) ||
          (item.whatIsIt || '').toLowerCase().includes(q) ||
          (item.whySaved || '').toLowerCase().includes(q) ||
          (item.genreOrTopic || '').toLowerCase().includes(q) ||
          (item.assignedPerson || '').toLowerCase().includes(q) ||
          (item.tags || []).some((t) => t.toLowerCase().includes(q))
        );

      // Widget de Curiosidade Recorrente ("Para Mais Tarde")
      const curiosityItems = useMemo(() => {
        const pool = publicItems.filter((i) => i.priority === 'later');
        if (pool.length <= 2) return pool;
        const start = curiositySeed % pool.length;
        return [pool[start], pool[(start + 1) % pool.length]];
      }, [publicItems, curiositySeed]);

      // Itens sem data para Revisão de Quarta-Feira
      const wednesdayUndatedItems = useMemo(() => {
        return state.items.filter((i) => {

          if (i.isPrivate && !state.preferences.includePrivateInWednesday) return false;
          return true;

        const folderScope = selectedFolderId ? getDescendantFolderIds(selectedFolderId) : null;
        return [...publicItems]
          .sort((a, b) => (a.homeOrder ?? 0) - (b.homeOrder ?? 0))
          .filter((item) => {
            if (!matchesGlobalSearch(item)) return false;
            if (folderScope && !folderScope.includes(item.folderId)) return false;
            if (item.priority === 'urgent' && !hf.showUrgent) return false;
            if (item.priority === 'attention' && !hf.showAttention) return false;
            if (item.priority === 'later' && !hf.showLater) return false;
            if (item.priority === 'done' && !hf.showDone) return false;
            if (hf.selectedCategories.length > 0 && !hf.selectedCategories.includes(item.category)) return false;
            return true;
          });
      }, [publicItems, searchQuery, selectedFolderId, state.preferences.homeFilters, state.folders]);

        { id: 'links_media', label: 'Links e Mídias', icon: 'compass' },
        { id: 'tasks', label: 'Compromissos & Tarefas', icon: 'check-square' },
        { id: 'studies', label: 'Estudos', icon: 'graduation-cap' },
        { id: 'finance', label: 'Finanças & Logística', icon: 'wallet' },
        { id: 'history', label: 'Histórico', icon: 'archive' },
        { id: 'reports', label: 'Relatórios', icon: 'bar-chart-2' },

                    {showHomeCustomizer && (

                        </div>

                        <div className="flex flex-wrap gap-1.5">
                          {Object.entries(CATEGORY_META).map(([catKey, meta]) => {

                            return (
                              <button

                                onClick={() => {

                                  const next = selected ? curr.filter((c) => c !== catKey) : [...curr, catKey];
                                  setState((prev) => ({
                                    ...prev,
                                    preferences: {
                                      ...prev.preferences,
                                      homeFilters: { ...prev.preferences.homeFilters, selectedCategories: next },

                                className={`text-[11px] px-2.5 py-1 rounded-full border transition ${

            {/* ===============================================================

                              className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1"
                            >
                              <Icon name="eye" size={14} /> Visto
                            </button>
                          </div>
                        </div>
                      ))}
                  </div>
                </section>
              </div>
            )}

            {/* ===============================================================
                ABA 3: COMPROMISSOS E TAREFAS (HÁBITOS, SUBTAREFAS, PESSOAS)
               =============================================================== */}
            {activeTab === 'tasks' && (
              <div className="space-y-4">
                <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-bold">Compromissos, Tarefas e Hábitos</h2>
                    <p className="text-xs text-slate-500">Filtre por pessoa vinculada, gerencie checklists passo a passo e teste alertas personalizados.</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={personFilter}
                      onChange={(e) => setPersonFilter(e.target.value)}
                      placeholder="Filtrar por pessoa (ex: Tabata, João)..."
                      className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-xs"
                    />
                    <button
                      onClick={() => { setEditingItem(null); setModalDefaultKind('task'); setModalOpen(true); }}
                      className="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                    >
                      + Nova Tarefa
                    </button>
                  </div>
                </div>

                <div className={gridClass}>
                  {publicItems
                    .filter((i) => i.kind === 'task' || i.assignedPerson)
                    .filter(matchesGlobalSearch)
                    .filter((i) =>
                      !personFilter.trim()
                        ? true
                        : (i.assignedPerson || '').toLowerCase().includes(personFilter.toLowerCase())
                    )
                    .map((item) => (
                      <BrainItemCard
                        key={item.id}
                        item={item}
                        folderPath={getFolderPath(item.folderId)}
                        viewMode={state.preferences.viewMode}
                        onToggleDone={handleToggleDone}
                        onMarkSeenClick={setSeenTarget}
                        onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
                        onDelete={handleDeleteItem}
                        onPostpone={handlePostpone}
                        onToggleSubtask={handleToggleSubtask}
                      />
                    ))}
                </div>
              </div>
            )}

            {/* ===============================================================
                ABA 4: ÁREA DE ESTUDOS (COM CLASSIFICAÇÃO AUTOMÁTICA DE TNE)
               =============================================================== */}
            {activeTab === 'studies' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <aside className="lg:col-span-3 space-y-4">
                  <FolderTreeSidebar
                    folders={state.folders}
                    selectedFolderId={selectedFolderId}
                    onSelectFolder={setSelectedFolderId}
                    onCreateFolder={(name, parentId) => handleCreateFolder(name, parentId, false)}
                    onArchiveFolder={handleArchiveFolder}
                    isPrivateMode={false}
                  />
                  <PomodoroWidget onNotify={fireTaskNotification} />
                </aside>

                <section className="lg:col-span-9 space-y-4">
                  <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h2 className="text-lg font-bold">Trilhas de Estudo & Materiais</h2>
                      <p className="text-xs text-slate-500">
                        Itens operacionais salvos aqui (como arrumar site ou setup) são marcados automaticamente como <strong>TNE (Tarefas que Não são Estudo)</strong>.
                      </p>
                    </div>
                  </div>

                  <div className={gridClass}>
                    {publicItems
                      .filter((i) => i.category === 'estudos')
                      .filter(matchesGlobalSearch)
                      .filter((i) => (!selectedFolderId ? true : getDescendantFolderIds(selectedFolderId).includes(i.folderId)))
                      .map((item) => (
                        <BrainItemCard
                          key={item.id}
                          item={item}
                          folderPath={getFolderPath(item.folderId)}
                          viewMode={state.preferences.viewMode}
                          onToggleDone={handleToggleDone}
                          onMarkSeenClick={setSeenTarget}
                          onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
                          onDelete={handleDeleteItem}
                          onPostpone={handlePostpone}
                          onToggleSubtask={handleToggleSubtask}
                        />
                      ))}
                  </div>
                </section>
              </div>
            )}

            {/* ===============================================================
                ABA 5: FINANÇAS E LOGÍSTICA
               =============================================================== */}
            {activeTab === 'finance' && (
              <div className="space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-500">Contas a Pagar</span>
                    <div className="text-2xl font-bold text-rose-600 mt-1">
                      R$ {publicItems
                        .filter((i) => i.category === 'financas' && i.financeType === 'bill' && i.priority !== 'done')
                        .reduce((acc, i) => acc + (i.amount || 0), 0)
                        .toFixed(2)}
                    </div>
                  </div>
                  <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-500">Assinaturas para Cancelar</span>
                    <div className="text-2xl font-bold text-amber-500 mt-1">
                      {publicItems.filter((i) => i.category === 'financas' && i.financeType === 'cancel_sub' && i.priority !== 'done').length} ativa(s)
                    </div>
                  </div>
                  <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material flex items-center justify-between">
                    <div>
                      <span className="text-xs text-slate-500">Economia Potencial</span>
                      <div className="text-2xl font-bold text-emerald-600 mt-1">
                        R$ {publicItems
                          .filter((i) => i.category === 'financas' && i.financeType === 'cancel_sub' && i.priority !== 'done')
                          .reduce((acc, i) => acc + (i.amount || 0), 0)
                          .toFixed(2)}/mês
                      </div>
                    </div>
                    <button
                      onClick={() => { setEditingItem(null); setModalDefaultKind('finance'); setModalOpen(true); }}
                      className="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-semibold"
                    >
                      + Registrar
                    </button>
                  </div>
                </div>

                <div className={gridClass}>
                  {publicItems
                    .filter((i) => i.category === 'financas' || i.kind === 'finance')
                    .filter(matchesGlobalSearch)
                    .map((item) => (
                      <BrainItemCard
                        key={item.id}
                        item={item}
                        folderPath={getFolderPath(item.folderId)}
                        viewMode={state.preferences.viewMode}
                        onToggleDone={handleToggleDone}
                        onMarkSeenClick={setSeenTarget}
                        onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
                        onDelete={handleDeleteItem}
                        onPostpone={handlePostpone}
                        onToggleSubtask={handleToggleSubtask}
                      />
                    ))}
                </div>
              </div>
            )}

            {/* ===============================================================
                ABA 6: ÁREA DE HISTÓRICO (ITENS CONCLUÍDOS / VISTOS GUARDADOS)
               =============================================================== */}
            {activeTab === 'history' && (
              <div className="space-y-4">
                <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-slate-200/80 dark:border-zinc-800 shadow-material flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold">Área de Histórico Salvo ({state.history.length})</h2>
                    <p className="text-xs text-slate-500">Links vistos, tarefas concluídas e pastas que você decidiu preservar.</p>
                  </div>
                </div>

                {state.history.length === 0 ? (
                  <div className="bg-white dark:bg-zinc-900 p-12 rounded-2xl border border-slate-200/80 dark:border-zinc-800 text-center text-sm text-slate-400">
                    Nenhum item arquivado no histórico ainda. Ao marcar um link como "Visto" ou concluir uma tarefa, você pode optar por salvá-lo aqui.
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {state.history.map((h) => (
                      <div key={h.id} className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-slate-200/80 dark:border-zinc-800 flex items-center justify-between gap-3 shadow-sm">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 font-semibold">
                              {h.entryType === 'link_media' ? '👁️ Link/Mídia Visto' : h.entryType === 'folder' ? '📁 Pasta' : '✅ Tarefa'}
                            </span>
                            <span className="font-bold text-sm">{h.title}</span>
                          </div>
                          <p className="text-xs text-slate-500 mt-1">{h.details} • Pasta: {h.folderPath}</p>
                        </div>
                        <button
                          onClick={() =>
                            setState((prev) => ({
                              ...prev,
                              history: prev.history.filter((x) => x.id !== h.id),
                            }))
                          }
                          className="p-2 rounded-xl hover:bg-rose-50 text-rose-500"
                          title="Excluir do histórico"
                        >
                          <Icon name="trash-2" size={16} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ===============================================================
                ABA 7: RELATÓRIOS
               =============================================================== */}
            {activeTab === 'reports' && (
              <ReportsView
                items={state.items}
                history={state.history}
                stats={state.stats}
                includePrivate={state.preferences.includePrivateInReports}
              />
            )}

            {/* ===============================================================
                ABA 8: ESPAÇO PRIVADO (PIN + BIOMETRIA DIGITAL)
               =============================================================== */}
            {activeTab === 'private' && (
              <PrivateSpaceGate
                preferences={state.preferences}
                onUpdatePrefs={(nextPrefs) => setState((prev) => ({ ...prev, preferences: nextPrefs }))}
              >
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <aside className="lg:col-span-3">
                    <FolderTreeSidebar
                      folders={state.folders}
                      selectedFolderId={selectedFolderId}
                      onSelectFolder={setSelectedFolderId}
                      onCreateFolder={(name, parentId) => handleCreateFolder(name, parentId, true)}
                      onArchiveFolder={handleArchiveFolder}
                      isPrivateMode={true}
                    />
                  </aside>
                  <section className="lg:col-span-9 space-y-4">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-base">Itens Confidenciais ({privateItems.length})</h3>
                      <button
                        onClick={() => { setEditingItem(null); setModalDefaultKind('link_media'); setModalOpen(true); }}
                        className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-zinc-950 text-xs font-bold"
                      >
                        + Adicionar Item Privado
                      </button>
                    </div>
                    <div className={gridClass}>
                      {privateItems
                        .filter(matchesGlobalSearch)
                        .filter((i) => (!selectedFolderId ? true : getDescendantFolderIds(selectedFolderId).includes(i.folderId)))
                        .map((item) => (
                          <BrainItemCard
                            key={item.id}
                            item={item}
                            folderPath={getFolderPath(item.folderId)}
                            viewMode={state.preferences.viewMode}
                            onToggleDone={handleToggleDone}
                            onMarkSeenClick={setSeenTarget}
                            onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
                            onDelete={handleDeleteItem}
                            onPostpone={handlePostpone}
                            onToggleSubtask={handleToggleSubtask}
                          />
                        ))}
                    </div>
                  </section>
                </div>
              </PrivateSpaceGate>
            )}
          </main>

          {/* MODAIS GLOBAIS */}
          <ItemFormModal
            isOpen={modalOpen}
            onClose={() => { setModalOpen(false); setEditingItem(null); }}
            onSave={handleSaveItem}
            existingItems={state.items}
            folders={state.folders}
            initialItem={editingItem}
            isPrivateMode={activeTab === 'private'}
            defaultKind={modalDefaultKind}
          />

          <SeenConfirmationModal
            item={seenTarget}
            onClose={() => setSeenTarget(null)}
            onConfirmDecision={handleSeenDecision}
          />

          <WednesdayReviewModal
            isOpen={wednesdayOpen}
            onClose={() => setWednesdayOpen(false)}
            undatedItems={wednesdayUndatedItems}
            getFolderPath={getFolderPath}
            onViewNow={(item) => {
              setWednesdayOpen(false);
              if (item.url) window.open(item.url, '_blank', 'noopener,noreferrer');
              setSeenTarget(item);
            }}
            onPostponeNextWednesday={(id) => {
              handlePostpone(id);
            }}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MegaBrainApp />);
  </script>
</body>
</html>
