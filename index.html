    const Icon = ({ name, size = 18, className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.setAttribute('class', className);
          ref.current.appendChild(i);
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

    // =========================================================================
    // SINCRONIZAÇÃO EM TEMPO REAL NA NUVEM (SYNC ROOM PC <-> CELULAR)
    // =========================================================================
    const SYNC_BASE = 'https://ntfy.sh';

    function generateRoomCode() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let code = 'mb-';
      for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function getDeviceId() {
      let id = localStorage.getItem('mega_brain_device_id');
      if (!id) {
        id = 'dev-' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('mega_brain_device_id', id);
      }
      return id;
    }

    async function pushCloudState(roomCode, payload) {
      if (!roomCode) return false;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}`, {
          method: 'POST',
          body: JSON.stringify({
            updatedAt: Date.now(),
            deviceId: getDeviceId(),
            data: payload
          }),
          headers: {
            'Title': 'MegaBrainSync',
            'Tags': 'brain'
          }
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function pullCloudState(roomCode) {
      if (!roomCode) return null;
      try {
        const res = await fetch(`${SYNC_BASE}/${encodeURIComponent(roomCode)}/json?poll=1&since=all`);
        if (!res.ok) return null;
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const evt = JSON.parse(lines[i]);
            if (evt.event === 'message' && evt.message) {
              const parsed = JSON.parse(evt.message);
              if (parsed && parsed.data && parsed.updatedAt) {
                return parsed;
              }
            }
          } catch (err) {}
        }
      } catch (e) {}
      return null;
    }

    // =========================================================================
    // GERADOR AUTOMÁTICO DE THUMBNAIL
    // =========================================================================
    async function fetchAutoThumbnail(url) {
      if (!url || !url.startsWith('http')) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let videoId = '';
        if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
        else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
        if (videoId) return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      }
      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data && data.status === 'success' && data.data?.image?.url) {
          return data.data.image.url;
        }
      } catch (e) {}
      return null;
    }

    // =========================================================================
    // NOTIFICAÇÕES CONFIGURÁVEIS (POPUP, SOM, VIBRAÇÃO)
    // =========================================================================
    function triggerConfiguredAlert(title, body, mode = 'popup_only') {
      if (!mode || mode === 'none') return;

      if ((mode === 'vibrate_only' || mode === 'vibrate_sound') && typeof navigator !== 'undefined' && 'vibrate' in navigator) {
        try { navigator.vibrate([300, 150, 300, 150, 450]); } catch (e) {}
      }

      if (mode === 'vibrate_sound' && typeof window !== 'undefined') {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25); // A5
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.65);
        } catch (e) {}
      }

      if ((mode === 'popup_only' || mode === 'vibrate_sound') && typeof window !== 'undefined' && 'Notification' in window) {
        if (Notification.permission === 'granted') {
          new Notification(title, { body });
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then((p) => {
            if (p === 'granted') new Notification(title, { body });
          });
        }
      }
    }

    // =========================================================================
    // MODAL DE PIN DO COFRE PRIVADO
    // =========================================================================
    const PinModal = ({ isOpen, onClose, currentPin, onSetPin, onUnlock }) => {

              </h3>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800">
                <Icon name="x" size={16} />
              </button>
            </div>

            {currentPin ? (
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (pinInput === currentPin) {
                    setPinInput('');
                    onUnlock();
                    onClose();
                  } else {
                    alert('PIN incorreto!');
                  }
                }}
                className="space-y-3"
              >
                <p className="text-xs text-slate-500">Digite seu PIN de acesso para visualizar itens e pastas privadas:</p>
                <input
                  type="password"
                  maxLength={8}
                  required
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  placeholder="Digite o PIN..."
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-center text-lg tracking-widest"
                />
                <button type="submit" className="w-full py-2 rounded-xl bg-amber-600 text-white text-xs font-semibold">
                  Desbloquear Espaço Privado
                </button>
              </form>
            ) : (
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (newPin.trim().length < 4) {
                    alert('Escolha um PIN de pelo menos 4 dígitos.');
                    return;
                  }
                  onSetPin(newPin.trim());
                  onUnlock();
                  onClose();
                }}
                className="space-y-3"
              >
                <p className="text-xs text-slate-500">Defina um PIN para proteger suas pastas e tarefas privadas:</p>
                <input
                  type="password"
                  maxLength={8}
                  required
                  value={newPin}
                  onChange={(e) => setNewPin(e.target.value)}

    // =========================================================================
    // REVISÃO DE QUARTA-FEIRA (ITENS PARA VER DEPOIS SEM DATA)
    // =========================================================================
    const WednesdayReviewModal = ({ isOpen, onClose, items, onConfirmSeen, onSnoozeItems }) => {
      const [selectedIds, setSelectedIds] = useState([]);
      const [customDate, setCustomDate] = useState('');

      const unseenLaterItems = useMemo(
        () => items.filter((it) => it.watchLater && !it.seenConfirmed && !it.archivedToHistory),
        [items]
      );

      useEffect(() => {
        if (isOpen) {
          setSelectedIds(unseenLaterItems.map((i) => i.id));
        }
      }, [isOpen, unseenLaterItems]);

      if (!isOpen) return null;

      const toggleSelect = (id) => {
        setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
      };

      const nextWednesdayIso = () => {
        const d = new Date();
        const diff = (3 - d.getDay() + 7) % 7 || 7;
        d.setDate(d.getDate() + diff);
        return d.toISOString().slice(0, 10);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white dark:bg-zinc-900 rounded-2xl max-w-lg w-full p-6 border border-slate-200 dark:border-zinc-800 shadow-2xl my-8 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-zinc-800 pb-3">
              <div>
                <h3 className="text-base font-bold flex items-center gap-2">
                  <Icon name="calendar" size={18} className="text-indigo-500" />
                  Check-in de Quarta: Itens "Ver Depois"
                </h3>
                <p className="text-xs text-slate-500">
                  Itens marcados para ler/assistir depois sem data fixa. Deseja ver algum hoje?
                </p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800">
                <Icon name="x" size={16} />
              </button>
            </div>

            {unseenLaterItems.length === 0 ? (
              <p className="text-xs text-slate-400 py-6 text-center">Nenhum item pendente para revisão hoje!</p>
            ) : (
              <div className="space-y-2 max-h-60 overflow-y-auto">
                {unseenLaterItems.map((it) => (
                  <label
                    key={it.id}
                    className="flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 dark:border-zinc-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-zinc-950"
                  >
                    <input
                      type="checkbox"
                      checked={selectedIds.includes(it.id)}
                      onChange={() => toggleSelect(it.id)}
                      className="rounded text-indigo-600"
                    />
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-semibold truncate">{it.title}</p>
                      <p className="text-[11px] text-slate-400 truncate">{it.whySaved || it.whatIsIt}</p>
                    </div>
                  </label>
                ))}
              </div>
            )}

            <div className="pt-3 border-t border-slate-100 dark:border-zinc-800 space-y-3">
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={() => {
                    onConfirmSeen(selectedIds);
                    onClose();
                  }}
                  className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold"
                >
                  Marcar Selecionados como Vistos ({selectedIds.length})
                </button>
                <button
                  onClick={() => {
                    onSnoozeItems(unseenLaterItems.map((i) => i.id), nextWednesdayIso());
                    onClose();
                  }}
                  className="px-3 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 text-xs font-semibold"
                >
                  Lembrar Próxima Quarta

                <button
                  onClick={onClose}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
                >
                  Nenhum Hoje
                </button>

              <div className="flex items-center gap-2 text-xs">

                  type="date"
                  value={customDate}
                  onChange={(e) => setCustomDate(e.target.value)}
                  className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
                />
                <button
                  onClick={() => {
                    if (!customDate) return;
                    onSnoozeItems(unseenLaterItems.map((i) => i.id), customDate);
                    onClose();
                  }}
                  className="px-3 py-1 rounded-lg bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-semibold"
                >
                  Agendar
                </button>
              </div>
            </div>
          </div>

    // =========================================================================
    // ÁRVORE DE PASTAS COM MENU DE CONTEXTO (CLIQUE / LONG PRESS MOBILE)
    // =========================================================================
    const FolderTreeSidebar = ({
      folders,
      selectedFolderId,
      onSelectFolder,
      onCreateFolder,
      onEditFolder,
      onDeleteFolder,
      onAddFolderTask,
      onMoveFolderOrder,
      isPrivateMode
    }) => {
      const [contextMenu, setContextMenu] = useState(null);
      const [editingFolderId, setEditingFolderId] = useState(null);
      const [editName, setEditName] = useState('');
      const [creatingParentId, setCreatingParentId] = useState(null);
      const [newFolderName, setNewFolderName] = useState('');
      const longPressTimer = useRef(null);

      const scopedFolders = folders.filter((f) => Boolean(f.isPrivate) === Boolean(isPrivateMode));

      const handleTouchStart = (folder, e) => {
        longPressTimer.current = setTimeout(() => {
          const touch = e.touches[0];
          setContextMenu({ folder, x: touch.clientX, y: touch.clientY });
        }, 550);
      };

      const handleTouchEnd = () => {
        if (longPressTimer.current) clearTimeout(longPressTimer.current);
      };

      const renderBranch = (parentId = null, depth = 0) => {
        const children = scopedFolders.filter((f) => f.parentId === parentId);
        return (
          <div className={depth > 0 ? 'ml-3 pl-2.5 border-l border-slate-200 dark:border-zinc-800 space-y-1 mt-1' : 'space-y-1'}>
            {children.map((folder) => {
              const isSelected = selectedFolderId === folder.id;
              const isEditing = editingFolderId === folder.id;

              return (
                <div key={folder.id} className="relative">
                  {isEditing ? (
                    <div className="flex gap-1 py-1">
                      <input
                        autoFocus
                        type="text"
                        value={editName}
                        onChange={(e) => setEditName(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            onEditFolder(folder.id, editName);
                            setEditingFolderId(null);
                          }
                        }}
                        className="w-full text-xs px-2 py-1 rounded border border-indigo-500 bg-white dark:bg-zinc-900"
                      />
                      <button
                        onClick={() => {
                          onEditFolder(folder.id, editName);
                          setEditingFolderId(null);
                        }}
                        className="px-2 py-1 bg-indigo-600 text-white text-xs rounded"
                      >
                        OK
                      </button>
                    </div>
                  ) : (
                    <div
                      draggable
                      onDragStart={(e) => e.dataTransfer.setData('text/plain', `folder:${folder.id}`)}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={(e) => {
                        e.preventDefault();
                        const data = e.dataTransfer.getData('text/plain');
                        if (!data) return;
                        if (data.startsWith('item:')) {
                          const itemId = data.split(':')[1];
                          window.dispatchEvent(new CustomEvent('megabrain:move-item', { detail: { itemId, folderId: folder.id } }));
                        } else if (data.startsWith('folder:')) {
                          const draggedFolderId = data.split(':')[1];
                          if (draggedFolderId !== folder.id && onMoveFolderOrder) {
                            onMoveFolderOrder(draggedFolderId, folder.id);
                          }
                        }
                      }}
                      onTouchStart={(e) => handleTouchStart(folder, e)}
                      onTouchEnd={handleTouchEnd}
                      onClick={() => onSelectFolder(folder.id)}
                      onContextMenu={(e) => {
                        e.preventDefault();
                        setContextMenu({ folder, x: e.clientX, y: e.clientY });
                      }}
                      className={`group flex items-center justify-between px-2.5 py-1.5 rounded-lg text-sm cursor-pointer transition select-none ${
                        isSelected
                          ? 'bg-indigo-600 text-white font-medium shadow-sm'
                          : 'text-slate-700 dark:text-zinc-300 hover:bg-slate-200/70 dark:hover:bg-zinc-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-2 truncate">
                        <Icon name={folder.isPrivate ? 'lock' : 'folder'} size={15} className={isSelected ? 'text-white' : 'text-indigo-500'} />
                        <span className="truncate">{folder.name}</span>
                      </div>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          const rect = e.currentTarget.getBoundingClientRect();
                          setContextMenu({ folder, x: rect.left, y: rect.bottom + 5 });
                        }}
                        className={`p-1 rounded opacity-75 group-hover:opacity-100 ${isSelected ? 'text-white' : 'text-slate-500'}`}
                      >
                        <Icon name="more-vertical" size={14} />
                      </button>
                    </div>
                  )}

                  {creatingParentId === folder.id && (
                    <div className="mt-1 ml-4 flex gap-1">
                      <input
                        autoFocus
                        type="text"
                        value={newFolderName}
                        onChange={(e) => setNewFolderName(e.target.value)}
                        placeholder="Nome da subpasta..."

    // =========================================================================
    // POMODORO TIMER COM NOTIFICAÇÃO CONFIGURÁVEL
    // =========================================================================
    const PomodoroWidget = ({ onNotify }) => {
      const [secondsLeft, setSecondsLeft] = useState(25 * 60);
      const [running, setRunning] = useState(false);
      const [mode, setMode] = useState('focus');
      const [alertMode, setAlertMode] = useState('vibrate_sound');

      useEffect(() => {
        if (!running) return;
        const timer = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              setRunning(false);
              onNotify(
                mode === 'focus' ? '⏰ Pomodoro Concluído!' : '⚡ Pausa Finalizada!',
                mode === 'focus' ? 'Hora da pausa de 5 minutos.' : 'De volta ao foco!',
                alertMode
              );
              return mode === 'focus' ? 5 * 60 : 25 * 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [running, mode, alertMode]);

      const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const secs = String(secondsLeft % 60).padStart(2, '0');

      return (
        <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-4 shadow-material">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <Icon name="timer" size={14} className="text-indigo-500" /> Foco Pomodoro
            </span>
            <div className="flex gap-1">
              <button
                onClick={() => { setRunning(false); setMode('focus'); setSecondsLeft(25 * 60); }}
                className={`text-[11px] px-2 py-0.5 rounded-full ${mode === 'focus' ? 'bg-indigo-100 text-indigo-700 font-bold' : 'text-slate-500'}`}
              >25m</button>
              <button
                onClick={() => { setRunning(false); setMode('break'); setSecondsLeft(5 * 60); }}
                className={`text-[11px] px-2 py-0.5 rounded-full ${mode === 'break' ? 'bg-emerald-100 text-emerald-700 font-bold' : 'text-slate-500'}`}
              >5m</button>
            </div>
          </div>

          <div className="text-3xl font-bold tracking-tight text-center my-2 font-mono">
            {mins}:{secs}
          </div>

          <div className="mb-2.5">
            <select
              value={alertMode}
              onChange={(e) => setAlertMode(e.target.value)}
              className="w-full text-[11px] px-2 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent"
            >
              {NOTIF_MODES.map((m) => (
                <option key={m.id} value={m.id} className="dark:bg-zinc-900">Alerta Timer: {m.label}</option>
              ))}
            </select>
          </div>

          <div className="flex gap-2">
            <button
              onClick={() => setRunning(!running)}
              className="flex-1 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-medium flex items-center justify-center gap-1"
            >
              <Icon name={running ? 'pause' : 'play'} size={14} />
              {running ? 'Pausar' : 'Iniciar'}
            </button>
            <button
              onClick={() => { setRunning(false); setSecondsLeft(mode === 'focus' ? 25 * 60 : 5 * 60); }}
              className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs"
            >
              Resetar
            </button>
          </div>
        </div>
      );
    };

            <div className="p-4">

                  {item.watchLater && (

    // =========================================================================
    // MODAL DE CRIAÇÃO / EDIÇÃO COMPLETO (NOTAS, ÁUDIO, IMAGEM, THUMB, ETC.)
    // =========================================================================
    const ItemFormModal = ({ isOpen, onClose, onSave, folders, initialItem, isPrivateMode, defaultFolderId }) => {
      const [kind, setKind] = useState('link_media');
      const [title, setTitle] = useState('');
      const [url, setUrl] = useState('');
      const [thumbnail, setThumbnail] = useState('');
      const [imageData, setImageData] = useState('');
      const [audioData, setAudioData] = useState('');
      const [recording, setRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const [category, setCategory] = useState('links_gerais');
      const [genreOrTopic, setGenreOrTopic] = useState('');
      const [whatIsIt, setWhatIsIt] = useState('');
      const [whySaved, setWhySaved] = useState('');
      const [tagsInput, setTagsInput] = useState('');
      const [folderId, setFolderId] = useState(defaultFolderId || '');
      const [priority, setPriority] = useState('later');
      const [notificationMode, setNotificationMode] = useState('none');
      const [watchLater, setWatchLater] = useState(false);
      const [assignedPersonInput, setAssignedPersonInput] = useState('');
      const [assignedPersons, setAssignedPersons] = useState([]);
      const [fetchingThumb, setFetchingThumb] = useState(false);

      useEffect(() => {
        if (initialItem) {
          setKind(initialItem.kind || 'link_media');
          setTitle(initialItem.title || '');
          setUrl(initialItem.url || '');
          setThumbnail(initialItem.thumbnail || '');
          setImageData(initialItem.imageData || '');
          setAudioData(initialItem.audioData || '');
          setCategory(initialItem.category || 'links_gerais');
          setGenreOrTopic(initialItem.genreOrTopic || '');
          setWhatIsIt(initialItem.whatIsIt || '');
          setWhySaved(initialItem.whySaved || '');
          setTagsInput((initialItem.tags || []).join(', '));
          setFolderId(initialItem.folderId || defaultFolderId || '');
          setPriority(initialItem.priority || 'later');
          setNotificationMode(initialItem.notificationMode || 'none');
          setWatchLater(Boolean(initialItem.watchLater));
          setAssignedPersons(initialItem.assignedPersons || []);
        } else {
          setKind('link_media');
          setTitle('');
          setUrl('');
          setThumbnail('');
          setImageData('');
          setAudioData('');
          setCategory('links_gerais');
          setGenreOrTopic('');
          setWhatIsIt('');
          setWhySaved('');
          setTagsInput('');
          setFolderId(defaultFolderId || '');
          setPriority('later');
          setNotificationMode('none');
          setWatchLater(false);
          setAssignedPersons([]);
        }
      }, [initialItem, isOpen, defaultFolderId]);

      const handleUrlBlur = async () => {
        if (!url || thumbnail) return;
        setFetchingThumb(true);
        const thumb = await fetchAutoThumbnail(url);
        if (thumb) setThumbnail(thumb);
        setFetchingThumb(false);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setImageData(ev.target.result);
        reader.readAsDataURL(file);
      };

      const startRecordingAudio = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          audioChunksRef.current = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (ev) => setAudioData(ev.target.result);
            reader.readAsDataURL(blob);
            stream.getTracks().forEach((t) => t.stop());
          };
          recorder.start();
          mediaRecorderRef.current = recorder;
          setRecording(true);
        } catch (err) {
          alert('Não foi possível acessar o microfone.');
        }
      };

      const stopRecordingAudio = () => {
        if (mediaRecorderRef.current && recording) {
          mediaRecorderRef.current.stop();
          setRecording(false);
        }
      };

      if (!isOpen) return null;

      const scopedFolders = folders.filter((f) => Boolean(f.isPrivate) === Boolean(isPrivateMode));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        // Se digitou pessoa no input e não clicou em + Adicionar Pessoa, inclui automaticamente
        const finalPersons = [...assignedPersons];
        if (assignedPersonInput.trim() && !finalPersons.includes(assignedPersonInput.trim())) {
          finalPersons.push(assignedPersonInput.trim());
        }

        // Separa múltiplas tags por vírgula
        const parsedTags = tagsInput
          .split(',')
          .map((t) => t.trim())
          .filter(Boolean);

        const payload = {
          ...(initialItem || {}),
          id: initialItem ? initialItem.id : `item-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          kind,
          title: title.trim(),
          url: url.trim() || undefined,
          thumbnail: thumbnail.trim() || undefined,
          imageData: imageData || undefined,
          audioData: audioData || undefined,
          category,
          genreOrTopic: genreOrTopic.trim() || 'Geral',
          whatIsIt: whatIsIt.trim(),
          whySaved: whySaved.trim(),
          tags: parsedTags,
          folderId: folderId || null,
          priority,
          notificationMode,
          watchLater,
          isPrivate: initialItem ? initialItem.isPrivate : isPrivateMode,
          assignedPersons: finalPersons,
          seenConfirmed: initialItem ? initialItem.seenConfirmed : false,
          archivedToHistory: false,
          createdAt: initialItem ? initialItem.createdAt : new Date().toISOString(),
          order: initialItem ? initialItem.order : 0,
        };

        onSave(payload);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200 dark:border-zinc-800 max-w-xl w-full p-6 shadow-2xl my-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-zinc-800">
              <h2 className="text-lg font-bold">
                {initialItem ? 'Editar Item' : 'Novo Item / Lembrete'}
              </h2>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-zinc-800">
                <Icon name="x" size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 mt-4">
              {/* Tipo de Lembrete / Item */}
              <div className="flex flex-wrap gap-1.5">
                {[

    // =========================================================================
    // APLICAÇÃO PRINCIPAL (MEGA BRAIN V6)
    // =========================================================================
    function MegaBrainApp() {
      const [roomCode, setRoomCode] = useState(() => localStorage.getItem('mega_brain_sync_room') || generateRoomCode());
      const [roomInput, setRoomInput] = useState(roomCode);
      const [syncStatus, setSyncStatus] = useState('Sincronizado');
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const lastPushRef = useRef(0);
      const lastPulledAtRef = useRef(0);

      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem('mega_brain_v6_state') || localStorage.getItem('mega_brain_v4_state');
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              folders: parsed.folders || INITIAL_FOLDERS,
              items: parsed.items || INITIAL_ITEMS,
              history: parsed.history || [],
              privatePin: parsed.privatePin || null,
              preferences: {
                theme: parsed.preferences?.theme || 'light',
                viewMode: parsed.preferences?.viewMode || 'cards',
                tagOrder: parsed.preferences?.tagOrder || []
              },
              stats: parsed.stats || { completedCount: 0, studiesCount: 0 }
            };
          }
        } catch (e) {}
        return {
          folders: INITIAL_FOLDERS,
          items: INITIAL_ITEMS,
          history: [],
          privatePin: null,
          preferences: { theme: 'light', viewMode: 'cards', tagOrder: [] },
          stats: { completedCount: 0, studiesCount: 0 }
        };
      });

      const [activeTab, setActiveTab] = useState('home');
      const [isPrivateMode, setIsPrivateMode] = useState(false);
      const [isPrivateUnlocked, setIsPrivateUnlocked] = useState(false);
      const [pinModalOpen, setPinModalOpen] = useState(false);

      const [selectedFolderId, setSelectedFolderId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTagFilter, setActiveTagFilter] = useState(null);
      const [modalOpen, setModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [tourOpen, setTourOpen] = useState(false);
      const [wednesdayOpen, setWednesdayOpen] = useState(false);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 2600);
      };

      useEffect(() => {
        localStorage.setItem('mega_brain_sync_room', roomCode);
      }, [roomCode]);

      const syncToCloud = useCallback(async (newState) => {
        if (!roomCode) return;
        setSyncStatus('Enviando...');
        const now = Date.now();
        lastPushRef.current = now;
        const ok = await pushCloudState(roomCode, newState);
        if (ok) {
          setSyncStatus('Sincronizado');
          setLastSyncTime(new Date().toLocaleTimeString());
        } else {
          setSyncStatus('Local salvo');
        }
      }, [roomCode]);

      const commitState = useCallback((updaterFn) => {
        setState((prev) => {
          const next = typeof updaterFn === 'function' ? updaterFn(prev) : updaterFn;
          try {
            localStorage.setItem('mega_brain_v6_state', JSON.stringify(next));
          } catch (e) {}
          syncToCloud(next);
          return next;
        });
      }, [syncToCloud]);

      const pullFromCloud = useCallback(async () => {
        if (!roomCode) return;
        const remote = await pullCloudState(roomCode);
        if (remote && remote.data && remote.updatedAt > lastPulledAtRef.current) {
          if (remote.deviceId !== getDeviceId() && remote.updatedAt > lastPushRef.current) {
            lastPulledAtRef.current = remote.updatedAt;
            setState(remote.data);
            try {
              localStorage.setItem('mega_brain_v6_state', JSON.stringify(remote.data));
            } catch (e) {}
            setSyncStatus('Atualizado em tempo real');
            setLastSyncTime(new Date().toLocaleTimeString());
          }
        }
      }, [roomCode]);

      useEffect(() => {
        pullFromCloud();
        const interval = setInterval(pullFromCloud, 3000);
        const onVis = () => {
          if (document.visibilityState === 'visible') pullFromCloud();
        };
        document.addEventListener('visibilitychange', onVis);
        window.addEventListener('focus', pullFromCloud);
        return () => {
          clearInterval(interval);
          document.removeEventListener('visibilitychange', onVis);
          window.removeEventListener('focus', pullFromCloud);
        };
      }, [pullFromCloud]);

      useEffect(() => {
        const handleMove = (e) => {
          const { itemId, folderId } = e.detail;
          commitState((prev) => ({
            ...prev,
            items: prev.items.map((it) => (it.id === itemId ? { ...it, folderId } : it))
          }));
          showToast('Item movido para a pasta!');
        };
        window.addEventListener('megabrain:move-item', handleMove);
        return () => window.removeEventListener('megabrain:move-item', handleMove);
      }, [commitState]);

      useEffect(() => {
        if (state.preferences.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [state.preferences.theme]);

      const getFolderPath = (fId) => {
        if (!fId) return '';
        const f = state.folders.find((x) => x.id === fId);
        return f ? f.name : '';
      };

      const handleSaveItem = (itemData) => {
        commitState((prev) => {
          const exists = prev.items.some((i) => i.id === itemData.id);
          const nextItems = exists
            ? prev.items.map((i) => (i.id === itemData.id ? itemData : i))
            : [itemData, ...prev.items];
          return { ...prev, items: nextItems };
        });
        showToast('Item salvo com sucesso!');
      };

      const handleDeleteItem = (id) => {
        commitState((prev) => ({ ...prev, items: prev.items.filter((i) => i.id !== id) }));
        showToast('Item excluído.');
      };

      const handleToggleDone = (item) => {
        const willComplete = item.priority !== 'done';
        if (willComplete && item.notificationMode) {
          triggerConfiguredAlert('Tarefa Concluída!', item.title, item.notificationMode);
        }
        commitState((prev) => ({
          ...prev,
          stats: {
            ...prev.stats,
            completedCount: willComplete ? (prev.stats.completedCount || 0) + 1 : prev.stats.completedCount,
            studiesCount: willComplete && ((item.tags || []).includes('estudos') || (item.genreOrTopic || '').toLowerCase().includes('estud'))
              ? (prev.stats.studiesCount || 0) + 1
              : prev.stats.studiesCount,
          },
          history: willComplete
            ? [{ ...item, completedAt: new Date().toISOString() }, ...(prev.history || [])]
            : prev.history,
          items: prev.items.map((i) => (i.id === item.id ? { ...i, priority: willComplete ? 'done' : 'attention' } : i))
        }));
        showToast(willComplete ? 'Concluído e salvo no histórico!' : 'Reaberto!');
      };

      const handleCompleteAndDelete = (item) => {
        commitState((prev) => ({
          ...prev,
          stats: {
            ...prev.stats,
            completedCount: (prev.stats.completedCount || 0) + 1,
          },
          history: [{ ...item, completedAt: new Date().toISOString(), deletedAfterDone: true }, ...(prev.history || [])],
          items: prev.items.filter((i) => i.id !== item.id)
        }));
        showToast('Concluído e removido do mural!');
      };

      const handleMoveItemOrder = (draggedId, targetId) => {
        if (!draggedId || draggedId === targetId) return;
        commitState((prev) => {
          const list = [...prev.items];
          const fromIdx = list.findIndex((i) => i.id === draggedId);
          const toIdx = list.findIndex((i) => i.id === targetId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          return { ...prev, items: list };
        });
      };

      const handleMoveFolderOrder = (draggedFolderId, targetFolderId) => {
        commitState((prev) => {
          const list = [...prev.folders];
          const fromIdx = list.findIndex((f) => f.id === draggedFolderId);
          const toIdx = list.findIndex((f) => f.id === targetFolderId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          return { ...prev, folders: list };
        });
      };

      const allTags = useMemo(() => {
        const set = new Set();
        state.items.forEach((it) => {
          if (Boolean(it.isPrivate) === Boolean(isPrivateMode)) {
            (it.tags || []).forEach((t) => set.add(t));
          }
        });
        const arr = Array.from(set);
        const order = state.preferences.tagOrder || [];
        return arr.sort((a, b) => {
          const ia = order.indexOf(a);
          const ib = order.indexOf(b);
          if (ia === -1 && ib === -1) return a.localeCompare(b);
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
      }, [state.items, isPrivateMode, state.preferences.tagOrder]);

      const togglePrivateMode = () => {
        if (!isPrivateMode) {
          if (isPrivateUnlocked || !state.privatePin) {
            setIsPrivateMode(true);
            setSelectedFolderId(null);
            if (!state.privatePin) setPinModalOpen(true);
          } else {
            setPinModalOpen(true);
          }
        } else {
          setIsPrivateMode(false);
          setSelectedFolderId(null);
        }
      };

      const filteredItems = useMemo(() => {
        return state.items.filter((item) => {
          if (Boolean(item.isPrivate) !== Boolean(isPrivateMode)) return false;
          if (isPrivateMode && state.privatePin && !isPrivateUnlocked) return false;
          if (activeTagFilter && !(item.tags || []).includes(activeTagFilter)) return false;
          if (selectedFolderId && item.folderId !== selectedFolderId) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = (item.title || '').toLowerCase().includes(q);
            const matchPersons = (item.assignedPersons || []).some((p) => p.toLowerCase().includes(q));
            const matchTags = (item.tags || []).some((t) => t.toLowerCase().includes(q));
            return matchTitle || matchPersons || matchTags;
          }
          return true;
        });
      }, [state.items, isPrivateMode, isPrivateUnlocked, state.privatePin, activeTagFilter, selectedFolderId, searchQuery]);

      const viewMode = state.preferences.viewMode || 'cards';

      return (
        <div className="min-h-screen flex flex-col">
          {toastMsg && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 px-4 py-2 rounded-full text-xs font-semibold shadow-xl">
              {toastMsg}
            </div>
          )}

          {/* HEADER SUPERIOR */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md border-b border-slate-200/80 dark:border-zinc-800">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center">
                  <Icon name="brain" size={20} />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-bold text-base leading-none">Mega Brain</span>
                    <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-semibold">
                      {syncStatus}
                    </span>
                  </div>
                  <span className="text-[11px] text-slate-400">Sala: {roomCode}</span>
                </div>
              </div>

              <div className="flex-1 max-w-md relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                  <Icon name="search" size={16} />
                </span>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Pesquisar tarefas, tags ou pessoas..."
                  className="w-full pl-9 pr-4 py-2 rounded-xl bg-slate-100 dark:bg-zinc-900 border-none text-xs outline-none"
                />
              </div>

              <div className="flex items-center gap-1.5 flex-wrap">
                <button
                  onClick={() => setWednesdayOpen(true)}
                  className="px-2.5 py-2 rounded-xl bg-amber-50 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 text-xs font-semibold flex items-center gap-1"
                >
                  <Icon name="calendar" size={14} /> Quarta
                </button>
                <button
                  onClick={togglePrivateMode}
                  className={`px-2.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1 ${
                    isPrivateMode
                      ? 'bg-amber-600 text-white'
                      : 'bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300'
                  }`}
                >
                  <Icon name={isPrivateMode ? 'unlock' : 'lock'} size={14} /> {isPrivateMode ? 'Sair Cofre' : 'Cofre PIN'}
                </button>
                <button
                  onClick={() => setTourOpen(true)}
                  className="px-2.5 py-2 rounded-xl bg-indigo-50 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-300 text-xs font-semibold flex items-center gap-1"
                >
                  <Icon name="help-circle" size={14} /> Tour
                </button>
                <button
                  onClick={() =>
                    commitState((prev) => ({
                      ...prev,
                      preferences: { ...prev.preferences, theme: prev.preferences.theme === 'dark' ? 'light' : 'dark' }
                    }))
                  }
                  className="p-2 rounded-xl border border-slate-200 dark:border-zinc-800"
                >
                  <Icon name={state.preferences.theme === 'dark' ? 'sun' : 'moon'} size={16} />
                </button>
                <button
                  onClick={() => { setEditingItem(null); setModalOpen(true); }}
                  className="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center gap-1"
                >
                  <Icon name="plus" size={16} /> Novo Item
                </button>
              </div>
            </div>

            {/* BARRA DE ABAS + MODO DE EXIBIÇÃO */}
            <div className="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2 py-1.5">
              <nav className="flex gap-1.5 overflow-x-auto">
                {[
                  { id: 'home', label: 'Home', icon: 'brain' },
                  { id: 'reports', label: 'Relatórios & Histórico', icon: 'bar-chart-2' },
                  { id: 'settings', label: 'Sync Global & Backup', icon: 'refresh-cw' },
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => { setActiveTab(tab.id); setActiveTagFilter(null); }}
                    className={`px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 whitespace-nowrap ${
                      activeTab === tab.id ? 'bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900' : 'text-slate-600 dark:text-zinc-400'
                    }`}
                  >
                    <Icon name={tab.icon} size={14} /> {tab.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-1 bg-slate-100 dark:bg-zinc-900 p-1 rounded-xl text-xs">
                {[
                  { id: 'cards', label: 'Blocos', icon: 'layout-grid' },
                  { id: 'list', label: 'Lista', icon: 'list' },
                  { id: 'thumb', label: 'Só Thumb', icon: 'image' },
                ].map((vm) => (
                  <button
                    key={vm.id}
                    onClick={() =>
                      commitState((prev) => ({
                        ...prev,
                        preferences: { ...prev.preferences, viewMode: vm.id }
                      }))
                    }
                    className={`px-2.5 py-1 rounded-lg flex items-center gap-1 font-medium ${
                      viewMode === vm.id ? 'bg-white dark:bg-zinc-800 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-slate-500'
                    }`}
                  >
                    <Icon name={vm.icon} size={13} /> {vm.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main className="max-w-7xl w-full mx-auto px-4 py-6 flex-1">
            {activeTagFilter && (
              <div className="mb-4 p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 flex items-center justify-between text-xs text-indigo-700 dark:text-indigo-300">
                <span>Mostrando itens atrelados à tag: <strong>#{activeTagFilter}</strong></span>
                <button onClick={() => setActiveTagFilter(null)} className="font-bold hover:underline">Limpar Filtro</button>
              </div>
            )}

            {activeTab === 'home' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <aside className="lg:col-span-3 space-y-4">
                  <FolderTreeSidebar
                    folders={state.folders}
                    selectedFolderId={selectedFolderId}
                    onSelectFolder={setSelectedFolderId}
                    onCreateFolder={(name, parentId, isPriv) => {
                      const newF = { id: `f-${Date.now()}`, name, parentId, isPrivate: isPriv };
                      commitState((prev) => ({ ...prev, folders: [...prev.folders, newF] }));
                      showToast('Pasta criada!');
                    }}
                    onEditFolder={(id, name) => {
                      commitState((prev) => ({
                        ...prev,
                        folders: prev.folders.map((f) => (f.id === id ? { ...f, name } : f))
                      }));
                      showToast('Pasta atualizada!');
                    }}
                    onDeleteFolder={(id) => {
                      commitState((prev) => ({
                        ...prev,
                        folders: prev.folders.filter((f) => f.id !== id && f.parentId !== id)
                      }));
                      showToast('Pasta removida.');
                    }}
                    onAddFolderTask={(fId) => {
                      setSelectedFolderId(fId);
                      setEditingItem(null);
                      setModalOpen(true);
                    }}
                    onMoveFolderOrder={handleMoveFolderOrder}
                    isPrivateMode={isPrivateMode}
                  />

                  {/* Tags clicáveis e reordenáveis */}
                  <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200/80 dark:border-zinc-800 p-3.5 shadow-material">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-2">
                      Tags (Clique para Filtrar / Arraste)
                    </span>
                    <div className="flex flex-wrap gap-1.5">
                      {allTags.map((tag) => (
                        <button
                          key={tag}
                          draggable
                          onDragStart={(e) => e.dataTransfer.setData('text/plain', `tag:${tag}`)}
                          onDragOver={(e) => e.preventDefault()}
                          onDrop={(e) => {
                            e.preventDefault();
                            const data = e.dataTransfer.getData('text/plain');
                            if (data && data.startsWith('tag:')) {
                              const draggedTag = data.split(':')[1];
                              if (draggedTag !== tag) {
                                const current = [...allTags];
                                const fi = current.indexOf(draggedTag);
                                const ti = current.indexOf(tag);
                                current.splice(fi, 1);
                                current.splice(ti, 0, draggedTag);
                                commitState((prev) => ({
                                  ...prev,
                                  preferences: { ...prev.preferences, tagOrder: current }
                                }));
                              }
                            }
                          }}
                          onClick={() => setActiveTagFilter(activeTagFilter === tag ? null : tag)}
                          className={`text-xs px-2.5 py-1 rounded-lg font-medium transition ${
                            activeTagFilter === tag
                              ? 'bg-indigo-600 text-white'
                              : 'bg-slate-100 dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50'
                          }`}
                        >
                          #{tag}
                        </button>
                      ))}
                    </div>
                  </div>

                  <PomodoroWidget onNotify={triggerConfiguredAlert} />
                </aside>

                <section className="lg:col-span-9 space-y-4">
                  <div
                    className={
                      viewMode === 'list'
                        ? 'space-y-2.5'
                        : viewMode === 'thumb'
                        ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3'
                        : 'grid grid-cols-1 md:grid-cols-2 gap-4'
                    }
                  >
                    {filteredItems.map((item) => (
                      <BrainItemCard
                        key={item.id}
                        item={item}
                        folderPath={getFolderPath(item.folderId)}
                        viewMode={viewMode}
                        onToggleDone={handleToggleDone}
                        onCompleteAndDelete={handleCompleteAndDelete}
                        onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
                        onDelete={handleDeleteItem}
                        onTagClick={(t) => setActiveTagFilter(t)}
                        draggable={true}
                        onDragStart={(e) => e.dataTransfer.setData('text/plain', `item:${item.id}`)}
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={(e) => {
                          e.preventDefault();
                          const data = e.dataTransfer.getData('text/plain');
                          if (data && data.startsWith('item:')) {
                            handleMoveItemOrder(data.split(':')[1], item.id);
                          }
                        }}
                      />
                    ))}
                  </div>
                </section>
              </div>
            )}

            {activeTab === 'reports' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-400 font-semibold">Itens Salvos Ativos</span>
                    <p className="text-3xl font-bold mt-1">{state.items.length}</p>
                  </div>
                  <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-400 font-semibold">Tarefas Concluídas</span>
                    <p className="text-3xl font-bold mt-1 text-emerald-600">{state.stats?.completedCount || 0}</p>
                  </div>
                  <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                    <span className="text-xs text-slate-400 font-semibold">Estudos Realizados</span>
                    <p className="text-3xl font-bold mt-1 text-indigo-600">{state.stats?.studiesCount || 0}</p>
                  </div>
                </div>

                <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-material">
                  <h3 className="text-base font-bold mb-3">Histórico de Atividades Concluídas</h3>
                  {(state.history || []).length === 0 ? (
                    <p className="text-xs text-slate-400">Nenhuma atividade registrada no histórico ainda.</p>
                  ) : (
                    <div className="space-y-2">
                      {state.history.map((h, i) => (
                        <div key={i} className="p-3 rounded-xl bg-slate-50 dark:bg-zinc-950 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-semibold">{h.title}</span>
                            <span className="text-slate-400 ml-2">{new Date(h.completedAt).toLocaleString()}</span>
                          </div>
                          <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-semibold">
                            Concluído
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="max-w-xl mx-auto bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 space-y-6 shadow-material">
                <div className="pb-5 border-b border-slate-100 dark:border-zinc-800">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <Icon name="refresh-cw" size={18} className="text-indigo-500" />
                    Sincronização Global em Tempo Real (PC ↔ Celular)
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    Use o mesmo <strong>Código da Sala</strong> no PC e no celular para ver todas as alterações instantaneamente.
                  </p>
                  <div className="mt-3 flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={roomInput}
                      onChange={(e) => setRoomInput(e.target.value)}
                      placeholder="Ex: mb-meu-cerebro"
                      className="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-sm font-mono"
                    />
                    <button
                      onClick={() => {
                        const clean = roomInput.trim();
                        if (clean) {
                          setRoomCode(clean);
                          lastPulledAtRef.current = 0;
                          pullFromCloud();
                          syncToCloud(state);
                          showToast('Sala conectada e sincronizada!');
                        }
                      }}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                    >
                      Conectar & Sincronizar
                    </button>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-2 flex items-center justify-between">
                    <span>Status: <strong>{syncStatus}</strong></span>
                    {lastSyncTime && <span>Última sync: {lastSyncTime}</span>}
                  </div>
                </div>

                <div className="pb-5 border-b border-slate-100 dark:border-zinc-800">
                  <h3 className="text-sm font-bold mb-2">PIN do Cofre Privado</h3>
                  <button
                    onClick={() => setPinModalOpen(true)}
                    className="px-4 py-2 rounded-xl bg-amber-600 text-white text-xs font-semibold"
                  >
                    {state.privatePin ? 'Alterar / Desbloquear PIN' : 'Configurar PIN do Cofre'}
                  </button>
                </div>

                <div>
                  <h3 className="text-sm font-bold mb-1">Backup & Restauração (Exportar / Importar JSON)</h3>
                  <p className="text-xs text-slate-500 mb-3">
                    Salve seus dados antes de subir novos arquivos para o GitHub/Netlify e importe quando quiser.
                  </p>
                  <div className="flex gap-3">
                    <button
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
                        const dlAnchorElem = document.createElement('a');
                        dlAnchorElem.setAttribute("href", dataStr);
                        dlAnchorElem.setAttribute("download", `megabrain_backup_${new Date().toISOString().slice(0, 10)}.json`);
                        dlAnchorElem.click();
                      }}
                      className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="download" size={16} /> Exportar Backup (JSON)
                    </button>
                    <label className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 dark:hover:bg-zinc-800">
                      <Icon name="upload" size={16} /> Importar Backup
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (evt) => {
                            try {
                              const parsed = JSON.parse(evt.target.result);
                              if (parsed && parsed.items && parsed.folders) {
                                commitState(parsed);
                                showToast('Backup importado com sucesso!');
                              }
                            } catch (err) {
                              alert('Erro ao ler arquivo de backup.');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>
              </div>
            )}
          </main>

          <ItemFormModal
            isOpen={modalOpen}
            onClose={() => { setModalOpen(false); setEditingItem(null); }}
            onSave={handleSaveItem}
            folders={state.folders}
            initialItem={editingItem}
            isPrivateMode={isPrivateMode}
            defaultFolderId={selectedFolderId}
          />

          <PinModal
            isOpen={pinModalOpen}
            onClose={() => setPinModalOpen(false)}
            currentPin={state.privatePin}
            onSetPin={(newPin) => commitState((prev) => ({ ...prev, privatePin: newPin }))}
            onUnlock={() => {
              setIsPrivateUnlocked(true);
              setIsPrivateMode(true);
            }}
          />

          <WednesdayReviewModal
            isOpen={wednesdayOpen}
            onClose={() => setWednesdayOpen(false)}
            items={state.items}
            onConfirmSeen={(ids) => {
              commitState((prev) => ({
                ...prev,
                items: prev.items.map((it) => (ids.includes(it.id) ? { ...it, seenConfirmed: true } : it))
              }));
              showToast('Itens marcados como vistos!');
            }}
            onSnoozeItems={(ids, dateStr) => {
              commitState((prev) => ({
                ...prev,
                items: prev.items.map((it) => (ids.includes(it.id) ? { ...it, snoozeUntil: dateStr } : it))
              }));
              showToast(`Adiado para ${dateStr}!`);
            }}
          />

          <TourModal isOpen={tourOpen} onClose={() => setTourOpen(false)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MegaBrainApp />);
  </script>
</body>
</html>
