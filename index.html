                    <div className="space-y-2">
                      {state.history.map((h, i) => (
                        <div key={i} className="p-3 rounded-xl bg-slate-50 dark:bg-zinc-950 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-semibold">{h.title}</span>
                            <span className="text-slate-400 ml-2">{new Date(h.completedAt).toLocaleString()}</span>
                          </div>
                          <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-semibold">
                            Concluído
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="max-w-xl mx-auto bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 space-y-6 shadow-material">
                <div className="pb-5 border-b border-slate-100 dark:border-zinc-800">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <Icon name="refresh-cw" size={18} className="text-indigo-500" />
                    Sincronização Global em Tempo Real (PC ↔ Celular)
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    Use o mesmo <strong>Código da Sala</strong> no PC e no celular para ver todas as alterações instantaneamente.
                  </p>
                  <div className="mt-3 flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={roomInput}
                      onChange={(e) => setRoomInput(e.target.value)}
                      placeholder="Ex: mb-meu-cerebro"
                      className="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-transparent text-sm font-mono"
                    />
                    <button
                      onClick={() => {
                        const clean = roomInput.trim();
                        if (clean) {
                          setRoomCode(clean);
                          lastPulledAtRef.current = 0;
                          pullFromCloud();
                          syncToCloud(state);
                          showToast('Sala conectada e sincronizada!');
                        }
                      }}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                    >
                      Conectar & Sincronizar
                    </button>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-2 flex items-center justify-between">
                    <span>Status: <strong>{syncStatus}</strong></span>
                    {lastSyncTime && <span>Última sync: {lastSyncTime}</span>}
                  </div>
                </div>

                <div className="pb-5 border-b border-slate-100 dark:border-zinc-800">
                  <h3 className="text-sm font-bold mb-2">PIN do Cofre Privado</h3>
                  <button
                    onClick={() => setPinModalOpen(true)}
                    className="px-4 py-2 rounded-xl bg-amber-600 text-white text-xs font-semibold"
                  >
                    {state.privatePin ? 'Alterar / Desbloquear PIN' : 'Configurar PIN do Cofre'}
                  </button>
                </div>

                <div>
                  <h3 className="text-sm font-bold mb-1">Backup & Restauração (Exportar / Importar JSON)</h3>
                  <p className="text-xs text-slate-500 mb-3">
                    Salve seus dados antes de subir novos arquivos para o GitHub/Netlify e importe quando quiser.
                  </p>
                  <div className="flex gap-3 flex-wrap">
                    <button
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
                        const dlAnchorElem = document.createElement('a');
                        dlAnchorElem.setAttribute("href", dataStr);
                        dlAnchorElem.setAttribute("download", `megabrain_backup_${new Date().toISOString().slice(0, 10)}.json`);
                        dlAnchorElem.click();
                      }}
                      className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="download" size={16} /> Exportar Backup (JSON)
                    </button>
                    <label className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 dark:hover:bg-zinc-800">
                      <Icon name="upload" size={16} /> Importar Backup
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (evt) => {
                            try {
                              const parsed = JSON.parse(evt.target.result);
                              if (parsed && parsed.items && parsed.folders) {
                                commitState(parsed);
                                showToast('Backup importado com sucesso!');
                              }
                            } catch (err) {
                              alert('Erro ao ler arquivo de backup.');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>
              </div>
            )}
          </main>

          <TaskDetailModal
            item={detailItem}
            folderPath={detailItem ? getFolderPath(detailItem.folderId) : ''}
            onClose={() => setDetailItem(null)}
            onEdit={(it) => { setEditingItem(it); setModalOpen(true); }}
            onToggleDone={handleToggleDone}
            onRequestCancel={handleRequestCancelItem}
            onToggleVault={handleToggleVault}
          />

          <ItemFormModal
            isOpen={modalOpen}
            onClose={() => { setModalOpen(false); setEditingItem(null); setDefaultDateStr(''); }}
            onSave={handleSaveItem}
            folders={state.folders}
            initialItem={editingItem}
            isPrivateMode={isPrivateMode}
            defaultFolderId={selectedFolderId}
            defaultDateStr={defaultDateStr}
          />

          <PinModal
            isOpen={pinModalOpen}
            onClose={() => { setPinModalOpen(false); setPendingVaultAction(null); }}
            currentPin={state.privatePin}
            onSetPin={(newPin) => commitState((prev) => ({ ...prev, privatePin: newPin }))}
            onUnlock={() => {
              setIsPrivateUnlocked(true);
              if (pendingVaultAction?.type === 'item') {
                applyItemVaultToggle(pendingVaultAction.payload);
              } else if (pendingVaultAction?.type === 'folder') {
                applyFolderVaultToggle(pendingVaultAction.payload);
              } else {
                setIsPrivateMode(true);
              }
              setPendingVaultAction(null);
            }}
          />

          <CancelRecurrenceModal
            isOpen={Boolean(cancelRecurrenceTarget)}
            onClose={() => setCancelRecurrenceTarget(null)}
            item={cancelRecurrenceTarget?.item}
            dateStr={cancelRecurrenceTarget?.dateStr}
            onCancelOnlyThisDate={handleCancelOnlyThisDate}
            onCancelAllOccurrences={handleCancelAllOccurrences}
          />

          <WednesdayReviewModal
            isOpen={wednesdayOpen}
            onClose={() => setWednesdayOpen(false)}
            items={state.items}
            onConfirmSeen={(ids) => {
              commitState((prev) => ({
                ...prev,
                items: prev.items.map((it) => (ids.includes(it.id) ? { ...it, seenConfirmed: true } : it))
              }));
              showToast('Itens marcados como vistos!');
            }}
            onSnoozeItems={(ids, dateStr) => {
              commitState((prev) => ({
                ...prev,
                items: prev.items.map((it) => (ids.includes(it.id) ? { ...it, snoozeUntil: dateStr } : it))
              }));
              showToast(`Adiado para ${dateStr}!`);
            }}
          />

          <TourModal isOpen={tourOpen} onClose={() => setTourOpen(false)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MegaBrainApp />);
  </script>
</body>
</html>
